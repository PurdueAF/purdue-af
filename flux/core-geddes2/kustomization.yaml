apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/jupyterhub/af-x509-secrets/cronjob.yaml
  - ../../apps/jupyterhub/af-x509-secrets/rbac.yaml
  - ../../apps/jupyterhub/jupyterhub/helmrelease.yaml
  - ../../apps/jupyterhub/jupyterhub/secret-auth.yaml
  - ../../apps/jupyterhub/jupyterhub/helmrepo.yaml
  - ../../apps/jupyterhub/jupyterhub-ssh/helmrelease.yaml
  - ../../apps/jupyterhub/jupyterhub-ssh/helmrepo.yaml
  - ../../apps/jupyterhub/userlist-sync/cronjob-purdue.yaml
  - ../../apps/jupyterhub/userlist-sync/cronjob-cern.yaml
  - ../../apps/jupyterhub/userlist-sync/rbac.yaml

  - ../../apps/monitoring/helmrepo-grafana-community.yaml
  - ../../apps/monitoring/helmrepo-prometheus.yaml
  - ../../apps/monitoring/helmrepo-grafana.yaml
  - ../../apps/monitoring/pyroscope/helmrelease.yaml
  - ../../apps/monitoring/pyroscope/pvc.yaml
  - ../../apps/monitoring/loki/helmrelease.yaml
  - ../../apps/monitoring/alloy/helmrelease.yaml
  - ../../apps/monitoring/af-monitoring/deployment-af-xcache-probe.yaml
  - ../../apps/monitoring/af-monitoring/services.yaml
  - ../../apps/monitoring/af-monitoring/deployment-af-node-monitor.yaml
  - ../../apps/monitoring/af-monitoring/daemonset-af-node-probe.yaml
  - ../../apps/monitoring/af-monitoring/af-node-monitor-rbac.yaml
  - ../../apps/monitoring/grafana/helmrelease.yaml
  - ../../apps/monitoring/grafana/helmrelease-private.yaml
  - ../../apps/monitoring/prometheus/helmrelease.yaml
  - ../../apps/monitoring/prometheus/servicemonitors.yaml
  - ../../apps/monitoring/prometheus/pod-monitor-svc.yaml
  - ../../apps/monitoring/prometheus/pvc.yaml
  - ../../apps/monitoring/prometheus/rbac.yaml

  - ../../apps/storage/af-shared-storage.yaml
  - ../../apps/storage/cvmfs-pvc.yaml

  - ../../apps/af-utils/pixi-global-sync/deployment.yaml

  - ../../apps/ray/helmrepo.yaml
  - ../../apps/ray/operator/helmrelease.yaml

  - ../../apps/servicex/helmrepo.yaml
  - ../../apps/servicex/servicex-anvil/helmrelease.yaml
  - ../../apps/servicex/servicex-anvil/secrets.yaml
  - ../../apps/servicex/servicex-eos/gitrepo.yaml
  - ../../apps/servicex/servicex-eos/helmrelease.yaml
  - ../../apps/servicex/servicex-eos/secrets.yaml

  - ../../apps/flyte/helmrepo.yaml
  - ../../apps/flyte/helmrelease.yaml
  - ../../apps/flyte/postgres.yaml
  - ../../apps/flyte/minio.yaml
  - ../../apps/flyte/podtemplate.yaml
  - ../../apps/flyte/secret-console-auth.yaml

  - ../../apps/krab/gitrepo.yaml
  - ../../apps/krab/helmrelease.yaml
  - ../../apps/krab/pvc.yaml
  - ../../apps/krab/outputs-owner.yaml
  - ../../apps/krab/secret-postgres.yaml
  - ../../apps/krab/secret-rabbitmq.yaml
  - ../../apps/krab/secret-celery.yaml

  - ../../apps/agentic-interface/rbac.yaml
  - ../../apps/agentic-interface/deployment.yaml
  - ../../apps/agentic-interface/service.yaml
  - ../../apps/agentic-interface/networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: jupyterhub-config
    files:
      - values.yaml=../../apps/jupyterhub/jupyterhub/values.yaml

  - name: af-userlist-sync-scripts
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/jupyterhub/userlist-sync/sync-userlist.sh
      - ../../docker/purdue-af/configs/certs/CERN-bundle.pem

  - name: jupyterhub-extra-config
    files:
      - 00-custom-spawner.py=../../apps/jupyterhub/jupyterhub/extraFiles/custom-spawner.py
      - 01-set-user-info.py=../../apps/jupyterhub/jupyterhub/extraFiles/set-user-info.py
      - 02-gpu-availability.py=../../apps/jupyterhub/jupyterhub/extraFiles/gpu-availability.py
      - 03-session-activity.py=../../apps/jupyterhub/jupyterhub/extraFiles/session-activity.py
      - gpu_queries.py=../../apps/jupyterhub/jupyterhub/extraFiles/gpu_queries.py

  - name: jupyterhub-gpu-culler
    files:
      - cull-gpu-sessions.py=../../apps/jupyterhub/jupyterhub/extraFiles/cull-gpu-sessions.py

  - name: jupyterhub-ssh-config
    files:
      - values.yaml=../../apps/jupyterhub/jupyterhub-ssh/values.yaml

  - name: af-node-monitor-config
    files:
      - ../../docker/af-node-monitor/node_healthcheck.py
      - ../../docker/af-node-monitor/probe_agent.py
      - ../../docker/af-node-monitor/job_runner.py

  - name: grafana-common-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values-common.yaml

  - name: grafana-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values.yaml

  - name: grafana-private-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values-private.yaml

  - name: grafana-datasources
    files:
      - values.yaml=../../apps/monitoring/grafana/datasources.yaml

  - name: grafana-public-dashboards
    files:
      - ../../apps/monitoring/grafana/dashboards/default.json
      - ../../apps/monitoring/grafana/dashboards/single-user.json
      - ../../apps/monitoring/grafana/dashboards/sonic.json
      - ../../apps/monitoring/grafana/dashboards/alerts.json
      - ../../apps/monitoring/grafana/dashboards/gpus.json
      - ../../apps/monitoring/grafana/dashboards/phys390.json

  - name: grafana-private-dashboards
    files:
      - ../../apps/monitoring/grafana/dashboards/agentic-interface.json
      - ../../apps/monitoring/grafana/dashboards/users-overview.json
      - ../../apps/monitoring/grafana/dashboards/pyroscope.json

  - name: prometheus-config
    files:
      - values.yaml=../../apps/monitoring/prometheus/values.yaml

  # The global env from the release copy, which only Release image writes.
  - name: pixi-global-sync
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/af-utils/pixi-global-sync/sync-global-env.py
      - ../../pixi/check-env.py
      - ../../apps/af-utils/pixi-global-sync/release/pixi.toml
      - ../../apps/af-utils/pixi-global-sync/release/pixi.lock

  - name: af-xcache-probe-config
    files:
      - ../../docker/af-node-monitor/xcache_probe.py

  - name: pyroscope-config
    files:
      - values.yaml=../../apps/monitoring/pyroscope/values.yaml

  - name: loki-config
    files:
      - values.yaml=../../apps/monitoring/loki/values.yaml

  - name: alloy-config
    files:
      - values.yaml=../../apps/monitoring/alloy/values.yaml

  - name: kuberay-operator-config
    files:
      - values.yaml=../../apps/ray/operator/values.yaml

  - name: servicex-anvil-config
    files:
      - values.yaml=../../apps/servicex/servicex-anvil/values.yaml

  - name: servicex-eos-config
    files:
      - values.yaml=../../apps/servicex/servicex-eos/values.yaml

  - name: flyte-config
    files:
      - values.yaml=../../apps/flyte/values.yaml

  - name: krab-config
    files:
      - values.yaml=../../apps/krab/values.yaml

  - name: user-docs
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../docs/docs/data-access.md
      - ../../docs/docs/getting-started.md
      - ../../docs/docs/gpus.md
      - ../../docs/docs/guide-agentic-interface.md
      - ../../docs/docs/guide-cern-eos.md
      - ../../docs/docs/guide-combine.md
      - ../../docs/docs/guide-conda.md
      - ../../docs/docs/guide-dask-gateway.md
      - ../../docs/docs/guide-dask.md
      - ../../docs/docs/guide-eos-write.md
      - ../../docs/docs/guide-file-transfer.md
      - ../../docs/docs/guide-ide-connection.md
      - ../../docs/docs/guide-mc-gen.md
      - ../../docs/docs/guide-pixi.md
      - ../../docs/docs/guide-ray-train.md
      - ../../docs/docs/guide-roofit-cuda.md
      - ../../docs/docs/guide-rucio.md
      - ../../docs/docs/guide-ssh-access.md
      - ../../docs/docs/hardware.md
      - ../../docs/docs/index.md
      - ../../docs/docs/interface.md
      - ../../docs/docs/login-methods.md
      - ../../docs/docs/scaling-out.md
      - ../../docs/docs/software.md
      - ../../docs/docs/storage.md
      - ../../docs/docs/support.md
      - ../../docs/docs/troubleshooting.md
