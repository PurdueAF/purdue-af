apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - limit-range.yaml
  - ../../apps/jupyterhub/af-x509-secrets/cronjob.yaml
  - ../../apps/jupyterhub/af-x509-secrets/rbac.yaml
  - ../../apps/jupyterhub/jupyterhub/helmrelease.yaml
  - ../../apps/jupyterhub/jupyterhub/secret-auth-geddes2.yaml
  - ../../apps/jupyterhub/jupyterhub/helmrepo.yaml
  - ../../apps/jupyterhub/database-backup/cronjob-restore.yaml
  - ../../apps/jupyterhub/jupyterhub-ssh/helmrelease.yaml
  - ../../apps/jupyterhub/jupyterhub-ssh/helmrepo.yaml
  - ../../apps/jupyterhub/userlist-sync/cronjob-purdue.yaml
  - ../../apps/jupyterhub/userlist-sync/cronjob-cern.yaml
  - ../../apps/jupyterhub/userlist-sync/rbac.yaml

  - ../../apps/monitoring/helmrepo-grafana-community.yaml
  - ../../apps/monitoring/helmrepo-prometheus.yaml
  - ../../apps/monitoring/grafana/helmrelease.yaml
  - ../../apps/monitoring/grafana/helmrelease-private.yaml
  - ../../apps/monitoring/prometheus/helmrelease.yaml
  - ../../apps/monitoring/prometheus/servicemonitors.yaml
  - ../../apps/monitoring/prometheus/pod-monitor-svc.yaml
  - ../../apps/monitoring/prometheus/pvc.yaml
  - ../../apps/monitoring/prometheus/rbac.yaml

  - ../../apps/storage/af-shared-storage.yaml
  - ../../apps/storage/cvmfs-pvc.yaml

  - ../../apps/af-utils/pixi-global-sync/deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: jupyterhub-config
    files:
      - values.yaml=../../apps/jupyterhub/jupyterhub/values.yaml

  - name: af-userlist-sync-scripts
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/jupyterhub/userlist-sync/sync-userlist.sh
      - ../../docker/purdue-af/configs/certs/CERN-bundle.pem

  - name: database-restore-scripts
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/jupyterhub/database-backup/restore-database.sh

  - name: jupyterhub-extra-config
    files:
      - 00-custom-spawner.py=../../apps/jupyterhub/jupyterhub/extraFiles/custom-spawner.py
      - 01-set-user-info.py=../../apps/jupyterhub/jupyterhub/extraFiles/set-user-info.py
      - 02-gpu-availability.py=../../apps/jupyterhub/jupyterhub/extraFiles/gpu-availability.py
      - 03-session-activity.py=../../apps/jupyterhub/jupyterhub/extraFiles/session-activity.py
      - gpu_queries.py=../../apps/jupyterhub/jupyterhub/extraFiles/gpu_queries.py

  - name: jupyterhub-gpu-culler
    files:
      - cull-gpu-sessions.py=../../apps/jupyterhub/jupyterhub/extraFiles/cull-gpu-sessions.py

  - name: jupyterhub-ssh-config
    files:
      - values.yaml=../../apps/jupyterhub/jupyterhub-ssh/values.yaml

  - name: grafana-common-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values-common.yaml

  - name: grafana-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values.yaml

  - name: grafana-private-config
    files:
      - values.yaml=../../apps/monitoring/grafana/values-private.yaml

  - name: grafana-datasources
    files:
      - values.yaml=../../apps/monitoring/grafana/datasources.yaml

  - name: grafana-public-dashboards
    files:
      - ../../apps/monitoring/grafana/dashboards/default.json
      - ../../apps/monitoring/grafana/dashboards/single-user.json
      - ../../apps/monitoring/grafana/dashboards/sonic.json
      - ../../apps/monitoring/grafana/dashboards/alerts.json
      - ../../apps/monitoring/grafana/dashboards/gpus.json
      - ../../apps/monitoring/grafana/dashboards/phys390.json

  - name: grafana-private-dashboards
    files:
      - ../../apps/monitoring/grafana/dashboards/agentic-interface.json
      - ../../apps/monitoring/grafana/dashboards/users-overview.json
      - ../../apps/monitoring/grafana/dashboards/pyroscope.json

  - name: prometheus-config
    files:
      - values.yaml=../../apps/monitoring/prometheus/values.yaml

  # The global env from the release copy, which only Release image writes.
  - name: pixi-global-sync
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/af-utils/pixi-global-sync/sync-global-env.py
      - ../../pixi/check-env.py
      - ../../apps/af-utils/pixi-global-sync/release/pixi.toml
      - ../../apps/af-utils/pixi-global-sync/release/pixi.lock
