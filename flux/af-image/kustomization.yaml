apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/af-utils/pixi-global-sync/deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pixi-global-sync
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/af-utils/pixi-global-sync/sync-global-env.py
      - ../../pixi/check-env.py
      - ../../pixi/global/pixi.toml
      - ../../pixi/global/pixi.lock
