apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: purdue-af-image
  namespace: cms
  annotations:
    cluster: geddes
spec:
  interval: 30s
  timeout: 1m
  url: https://github.com/PurdueAF/purdue-af.git
  ref:
    # The purdue-af image tags v0.X.Y; platform CalVer tags start at 2026.0.0.
    semver: "<2026.0.0"
  secretRef:
    name: flux-github-token
