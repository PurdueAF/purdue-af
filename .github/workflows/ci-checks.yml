name: CI checks

# Stage 0 of ci.yml: the quick gates every later stage waits for.

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUX_VERSION: 2.5.1
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: 4.7.0
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.8.0
  # renovate: datasource=github-releases depName=prometheus/prometheus extractVersion=^v(?<version>.+)$
  PROMETHEUS_VERSION: 3.15.1 # for promtool

jobs:
  check-lint:
    # Locally: uvx pre-commit run --all-files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color always

  check-unit:
    # Sharded, as one job it is stage 0's long pole; codecov.yml's after_n_builds counts the shards.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload (no token secret needed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tests/uv.lock
      # From the repo root, so coverage records repo-rooted paths.
      - name: Run tests with coverage
        run: >-
          uv run --project tests --frozen
          pytest -q -c tests/pyproject.toml tests -n auto
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          --cov --cov-report=xml
      - name: Skill version stamp names the release it ships in
        if: matrix.shard == 1
        run: |
          tag="agentic-interface-v$(python3 .github/workflows/bump-agentic-version.py --print-current)"
          git fetch -q --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          python3 .github/workflows/bump-agentic-version.py --skill-kind
      # Informational: a Codecov outage must not fail the test job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  check-history:
    # 4bb52757 is #333's squash as it was before main's history was rewritten.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Branch is built on the current main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/4bb5275770f2101dd748e51b2790d6d3c474d7fa...${HEAD_SHA}" \
            --jq .status 2>/dev/null) || rel=unrelated
          if [ "$rel" = ahead ] || [ "$rel" = identical ]; then
            echo "::error::This branch is built on the pre-rewrite main. Fix: git fetch origin && git rebase origin/main && git push --force-with-lease"
            exit 1
          fi

  check-manifests:
    # 24.04 ships kustomize, yq and Helm 3, which the cluster's Flux renders with; 26.04 ships Helm 4.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: ${{ env.FLUX_VERSION }}
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Install promtool
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Validate manifests
        run: ./.github/workflows/validate-manifests.sh
