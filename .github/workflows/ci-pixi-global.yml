name: CI pixi-global

# Stage 1c of ci.yml, inside the AF image built by stage 1b. Syncs
# pixi/global/pixi.lock, import-smokes the env, runs the integration challenge and
# checks CVMFS. Lock commits: RELEASING.md.

on:
  workflow_call:
    inputs:
      af-image:
        description: "Full ref of the AF image for the current input state"
        required: true
        type: string
      af-image-available:
        description: "'true' when af-image is pullable from ghcr"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # commit regenerated pixi/global/pixi.lock
      actions: write # approve or dispatch the run on a lock commit
      packages: read # pull the AF image
    env:
      CONDA_OVERRIDE_CUDA: "12.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Pick the AF image to test inside
        id: image
        uses: ./.github/actions/pick-af-image
        with:
          af-image: ${{ inputs.af-image }}
          af-image-available: ${{ inputs.af-image-available }}
      - name: Compute memo key
        id: key
        run: |
          img="${{ steps.image.outputs.image }}"
          # The :pre-release fallback is a moving tag: never memoized.
          case "$img" in
          *@sha256:*) echo "key=pixi-global-ok-$(./.github/workflows/image-inputs.sh pixi-global)-${img##*:}" ;;
          *) echo "key=" ;;
          esac | tee -a "$GITHUB_OUTPUT"
      - name: Look up recorded green run
        id: memo
        uses: ./.github/actions/memo-restore
        with:
          key: ${{ steps.key.outputs.key }}
      - name: Login to ghcr.io
        if: steps.memo.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4 # Renovate pins to digest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The runner's Docker 28 defaults to the classic store, which pulls the AF image about half as fast as containerd.
      - name: Switch Docker to the containerd image store
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '.features["containerd-snapshotter"] = true' > /tmp/daemon.json
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "docker storage driver: $(docker info --format '{{.Driver}}')"
      # The image pull and the env install overlap: each needs the other only at `docker run`.
      - name: Start the AF image pull (detached)
        if: steps.memo.outputs.hit != 'true'
        env:
          AF_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          rm -f /tmp/af-pull.done /tmp/af-pull.failed /tmp/af-pull.secs
          nohup bash -c '
            start=$SECONDS
            if docker pull -q "$AF_IMAGE"; then echo $((SECONDS - start)) > /tmp/af-pull.secs; touch /tmp/af-pull.done
            else touch /tmp/af-pull.failed; fi
          ' >/tmp/af-pull.log 2>&1 &
          echo "pulling $AF_IMAGE in the background"
      - name: Read the pixi CLI version the AF image uses
        id: pixi
        if: steps.memo.outputs.hit != 'true'
        run: echo "version=$(sed -n 's/^ARG PIXI_VERSION="\([^"]*\)".*/\1/p' docker/purdue-af/Dockerfile)" | tee -a "$GITHUB_OUTPUT"
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3 # Renovate pins to digest
        if: steps.memo.outputs.hit != 'true'
        with:
          pixi-version: v${{ steps.pixi.outputs.version }}
          manifest-path: pixi/global/pixi.toml
          run-install: false
          cache: false
      - name: Install global env (regenerate lock if out of sync)
        id: lock
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          MANIFEST=pixi/global/pixi.toml
          if pixi install --manifest-path "$MANIFEST" --locked; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pixi/global lock out of sync — regenerating with pixi lock"
            pixi lock --manifest-path "$MANIFEST"
            pixi install --manifest-path "$MANIFEST" --locked
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install CVMFS on the runner
        if: steps.memo.outputs.hit != 'true'
        uses: cvmfs-contrib/github-action-cvmfs@72f2a8d366043978d6aebee154bc9ed321c2f2a8 # v5.6
      # Revision: tests/integration_challenge/upstream.pin (part of the memo key).
      - name: Check out the integration challenge
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          pin=tests/integration_challenge/upstream.pin
          repo=$(grep -E '^repo=' "$pin" | cut -d= -f2-)
          ref=$(grep -E '^ref=' "$pin" | cut -d= -f2-)
          git init -q challenge
          git -C challenge remote add origin "$repo"
          git -C challenge fetch -q --depth 1 origin "$ref"
          git -C challenge checkout -q FETCH_HEAD
          echo "integration challenge at $ref" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Wait for the AF image
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          while [ ! -f /tmp/af-pull.done ] && [ ! -f /tmp/af-pull.failed ]; do sleep 5; done
          if [ -f /tmp/af-pull.failed ]; then
            echo "::error::AF image pull failed"; cat /tmp/af-pull.log; exit 1
          fi
          echo "AF image pulled in $(cat /tmp/af-pull.secs)s"
      # The global env's interpreter inside the AF image: the `Python (pixi global)` kernel's combination.
      - name: Start the integration challenge (detached)
        if: steps.memo.outputs.hit != 'true'
        env:
          AF_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          rm -f /tmp/challenge.rc
          nohup bash -c '
            docker run --rm --user 0:0 -v "$PWD:$PWD" -w "$PWD" "$AF_IMAGE" \
              pixi/global/.pixi/envs/default/bin/python \
              tests/integration_challenge/run_challenge.py \
              --challenge-root challenge/cms
            echo $? > /tmp/challenge.rc.tmp && mv /tmp/challenge.rc.tmp /tmp/challenge.rc
          ' >/tmp/challenge.log 2>&1 &
          echo "running the integration challenge in the background"
      - name: CVMFS smoke test (cmsset_default.sh)
        if: steps.memo.outputs.hit != 'true'
        run: |
          docker run --rm -v /cvmfs:/cvmfs:shared "${{ steps.image.outputs.image }}" bash -c '
            source /cvmfs/cms.cern.ch/cmsset_default.sh &&
            command -v scramv1 >/dev/null &&
            echo "cmsset ok: $(command -v scramv1)"'
      - name: Import-smoke the global env (inside the AF image)
        if: steps.memo.outputs.hit != 'true'
        run: |
          # --user 0: the runner's uid owns the env, and some conda-meta files are not world-readable.
          docker run --rm --user 0:0 -v "$PWD:$PWD" -w "$PWD" \
            "${{ steps.image.outputs.image }}" \
            pixi/global/.pixi/envs/default/bin/python pixi/check-env.py \
              --manifest pixi/global/pixi.toml --env default
      - name: Integration challenge result
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          while [ ! -f /tmp/challenge.rc ]; do sleep 2; done
          cat /tmp/challenge.log
          exit "$(cat /tmp/challenge.rc)"

      - name: Commit regenerated lockfile
        if: success() && steps.memo.outputs.hit != 'true' && steps.lock.outputs.updated == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/commit-lockfile.sh global
      - name: Record green run
        if: success() && steps.memo.outputs.hit != 'true' && steps.lock.outputs.updated != 'true'
        uses: ./.github/actions/memo-save
        with:
          key: ${{ steps.key.outputs.key }}
