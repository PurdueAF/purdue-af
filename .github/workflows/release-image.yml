name: Release image

# The manual greenlight for the VERSIONED images — semver X.Y.Z promoted
# by digest, GitHub Release, count-verified manifest rewrite:
#
#   - purdue-af (default): repo tag vX.Y.Z; rewrites values.yaml
#     (bump-af-version.py).
#   - agentic-interface: repo tag agentic-interface-vX.Y.Z; rewrites its
#     Deployment image tag (bump-agentic-version.py) — Flux then rolls the
#     pod onto the released tag, so deploys happen ONLY through this
#     workflow and roll back with `git revert`.
#
# The remaining first-party images (af-pod-monitor, af-node-monitor) are on
# the continuous :latest channel, moved only by the ci.yml publish stage.
#
# Two gates make "assumed success" impossible:
#
#   1. CI-green gate — the ci-ok check of the release commit (HEAD of
#      main) must have succeeded; commits whose CI never ran (e.g. pushed
#      with the default GITHUB_TOKEN) fail loudly instead of releasing
#      untested state.
#   2. Exact-state gate — the digest being promoted must be the digest of
#      ghcr :in-<hash(HEAD)> (image-inputs.sh, same definition CI builds
#      from), AND the soak channel's digest must match it too (purdue-af
#      soaks on :pre-release, agentic-interface's channel is :latest) —
#      the release ships the exact bytes built from THIS repo state.
#
# Promotion is by digest: the semver tag is added to the SAME digest that
# passed the pipeline, never a rebuild. ROLLBACK: `git revert` the release
# commit (old tags stay on ghcr forever; registry-gc never deletes them).
#
# Version streams (each minted by exactly one trigger — never cross them):
#   - platform:        YYYY.M.SEQ  → release-platform.yml
#   - purdue-af image: semver 0.X.Y (repo tag v0.X.Y) → THIS workflow
#   - agentic-interface image: semver X.Y.Z (repo tag
#     agentic-interface-vX.Y.Z) → THIS workflow
#   - everything else: :latest / :pre-release / :sha- / :in- moving tags
#     → ci.yml only, never versioned by humans
#
# ⚠ Uses AF_RELEASE_TOKEN (fine-grained PAT, contents:write on this repo)
# if present — pushes made with the default GITHUB_TOKEN do NOT trigger
# other workflows, so CI would silently skip the release commit. Falls
# back to GITHUB_TOKEN with a loud warning.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Which versioned image to release"
        type: choice
        options: [purdue-af, agentic-interface]
        default: purdue-af
      bump:
        description: "Semver bump for the new version"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version override (X.Y.Z) — leave empty to bump"
        default: ""
      force:
        description: "Bypass the CI-green and exact-state gates (emergencies only)"
        type: boolean
        default: false

permissions:
  contents: write # release commit, git tag, GitHub Release
  packages: write # semver tag on ghcr

concurrency:
  group: release-image # never run two releases concurrently, never cancel one
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ secrets.AF_RELEASE_TOKEN || github.token }}
      HAVE_RELEASE_PAT: ${{ secrets.AF_RELEASE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history for release notes
          token: ${{ secrets.AF_RELEASE_TOKEN || github.token }}
      # Everything that differs between the versioned images lives here.
      - name: Per-image configuration
        id: cfg
        run: |
          case "${{ inputs.image }}" in
            purdue-af)
              echo "repo=ghcr.io/purdueaf/purdue-af"
              echo "soak_tag=pre-release"
              echo "tag_prefix=v"
              echo "bump_script=.github/workflows/bump-af-version.py"
              echo "manifest=apps/jupyterhub/jupyterhub/values.yaml"
              ;;
            agentic-interface)
              echo "repo=ghcr.io/purdueaf/agentic-interface"
              echo "soak_tag=latest"
              echo "tag_prefix=agentic-interface-v"
              echo "bump_script=.github/workflows/bump-agentic-version.py"
              echo "manifest=apps/agentic-interface/deployment.yaml"
              ;;
            *)
              echo "::error::unknown image '${{ inputs.image }}'"; exit 1 ;;
          esac | tee -a "$GITHUB_OUTPUT"
      - name: Warn if running with the default token
        if: env.HAVE_RELEASE_PAT != 'true'
        run: |
          echo "::warning::AF_RELEASE_TOKEN secret not set — the release " \
            "commit will NOT trigger CI workflows (GITHUB_TOKEN limitation)."
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 # Renovate pins to digest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Gate 1: ci-ok succeeded for this commit"
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=ci-ok" \
            -q '.check_runs[0].conclusion // "missing"')
          echo "ci-ok on ${sha}: ${conclusion}"
          if [ "$conclusion" != "success" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "::warning::ci-ok is '${conclusion}' — proceeding because force=true"
            else
              echo "::error::ci-ok is '${conclusion}' for ${sha} — this repo state has not passed CI"
              exit 1
            fi
          fi
      - name: "Gate 2: resolve the exact-state digest"
        id: src
        env:
          IMAGE_REPO: ${{ steps.cfg.outputs.repo }}
          SOAK_TAG: ${{ steps.cfg.outputs.soak_tag }}
        run: |
          tag=$(./.github/workflows/image-inputs.sh "${{ inputs.image }}")
          ref="$IMAGE_REPO:$tag"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest) || true
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::$ref not found — CI has not published the image of this repo state"
            exit 1
          fi
          echo "exact-state image: $ref @ $digest"
          soak=$(docker buildx imagetools inspect "$IMAGE_REPO:$SOAK_TAG" --format '{{json .Manifest}}' | jq -r .digest) || true
          echo ":$SOAK_TAG digest: ${soak:-none}"
          if [ "$soak" != "$digest" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "::warning::releasing $digest which is NOT the soaking :$SOAK_TAG ($soak) — force=true"
            else
              echo "::error::the :$SOAK_TAG users are soaking ($soak) is not the image of this" \
                "repo state ($digest) — wait for CI on main to promote, or use force"
              exit 1
            fi
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Bump version in the manifest
        id: ver
        run: |
          bump="${{ steps.cfg.outputs.bump_script }}"
          if [ -n "${{ inputs.version }}" ]; then
            new=$(python3 "$bump" --set "${{ inputs.version }}" | tail -1)
          else
            new=$(python3 "$bump" --bump "${{ inputs.bump }}" | tail -1)
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          git diff --stat
      - name: Tag the digest on ghcr (promote-by-digest, no rebuild)
        env:
          IMAGE_REPO: ${{ steps.cfg.outputs.repo }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_REPO:${{ steps.ver.outputs.version }}" \
            "$IMAGE_REPO@${{ steps.src.outputs.digest }}"
          echo "promoted $IMAGE_REPO@${{ steps.src.outputs.digest }} -> :${{ steps.ver.outputs.version }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit, tag, push, publish release
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_REPO: ${{ steps.cfg.outputs.repo }}
          MANIFEST: ${{ steps.cfg.outputs.manifest }}
          # v for purdue-af (distinct from bare platform CalVer tags);
          # agentic-interface-v namespaces the second image's tags.
          TAG: ${{ steps.cfg.outputs.tag_prefix }}${{ steps.ver.outputs.version }}
          VERSION: ${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.src.outputs.digest }}
        run: |
          git config user.name "af-release-bot"
          git config user.email "af-release-bot@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "release $IMAGE image $VERSION"
          git tag -a "$TAG" -m "$IMAGE image $VERSION
          image: $IMAGE_REPO:$VERSION
          digest: $DIGEST"
          git push origin main "$TAG"
          gh release create "$TAG" \
            --title "$IMAGE image $VERSION" \
            --generate-notes \
            --notes "Image: \`$IMAGE_REPO:$VERSION\`
          Digest: \`$DIGEST\` (identical bytes to the :${{ steps.cfg.outputs.soak_tag }} that passed CI)
          " \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "released $IMAGE $VERSION -> $DIGEST" >> "$GITHUB_STEP_SUMMARY"
