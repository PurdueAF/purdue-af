name: CI pixi-base

# Stage 1a of ci.yml, before the image build, so the Dockerfile's --locked install
# sees a matching lock. Syncs pixi/base/pixi.lock and import-smokes the env in an
# EL8 userland. Lock commits: RELEASING.md.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # commit regenerated pixi/base/pixi.lock
      actions: write # approve or dispatch the run on a lock commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR head branch so a lock commit can be pushed back; main on push.
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Read the pixi CLI version the AF image uses
        id: pixi
        run: echo "version=$(sed -n 's/^ARG PIXI_VERSION="\([^"]*\)".*/\1/p' docker/purdue-af/Dockerfile)" | tee -a "$GITHUB_OUTPUT"
      # The pixi CLI is an input too: a pixi bump re-runs the install.
      - name: Compute memo key
        id: key
        run: echo "key=pixi-base-ok-$(./.github/workflows/image-inputs.sh pixi-base)-pixi${{ steps.pixi.outputs.version }}" | tee -a "$GITHUB_OUTPUT"
      - name: Look up recorded green run
        id: memo
        uses: ./.github/actions/memo-restore
        with:
          key: ${{ steps.key.outputs.key }}
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2 # Renovate pins to digest
        if: steps.memo.outputs.hit != 'true'
        with:
          pixi-version: v${{ steps.pixi.outputs.version }}
          manifest-path: pixi/base/pixi.toml
          # environments requires run-install; we install in the next step so
          # we can regenerate the lock when toml/lock disagree.
          run-install: false
          cache: false
      - name: Install base env (regenerate lock if out of sync)
        id: lock
        if: steps.memo.outputs.hit != 'true'
        run: |
          set -euo pipefail
          MANIFEST=pixi/base/pixi.toml
          if pixi install --manifest-path "$MANIFEST" --environment base-env --locked; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pixi/base lock out of sync — regenerating with pixi lock"
            pixi lock --manifest-path "$MANIFEST"
            pixi install --manifest-path "$MANIFEST" --environment base-env --locked
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import-smoke the base env (EL8 container, like production)
        if: steps.memo.outputs.hit != 'true'
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" rockylinux:8 \
            pixi/base/.pixi/envs/base-env/bin/python pixi/check-env.py \
              --manifest pixi/base/pixi.toml --env base-env
      - name: Commit regenerated lockfile
        if: success() && steps.memo.outputs.hit != 'true' && steps.lock.outputs.updated == 'true'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/commit-lockfile.sh base
      - name: Record green run
        # Only memoize in-sync trees; a lock push triggers a new commit/CI.
        if: success() && steps.memo.outputs.hit != 'true' && steps.lock.outputs.updated != 'true'
        uses: ./.github/actions/memo-save
        with:
          key: ${{ steps.key.outputs.key }}
