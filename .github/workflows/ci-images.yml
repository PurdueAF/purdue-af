name: CI images

# Stage 1 of ci.yml: content-addressed image builds. An image whose `in-<hash>`
# tag is already on ghcr is reused, not rebuilt (image-inputs.sh, docker/REGISTRY.md).
# Promotion: RELEASING.md.

on:
  workflow_call:
    outputs:
      af-image:
        description: "Digest-pinned ref (repo:in-tag@sha256:...) of the AF image for the current input state; empty when unavailable"
        value: ${{ jobs.build-af-image.outputs.image }}
      af-image-available:
        description: "'true' when the af-image ref is pullable from ghcr"
        value: ${{ jobs.build-af-image.outputs.available }}
      af-digest:
        description: "Manifest digest of the AF image (what e2e tested — publish retags THIS, not the tag)"
        value: ${{ jobs.build-af-image.outputs.digest }}
      aux-tags:
        description: "Space-separated <name>=<in-tag>=<channel-tag> pairs for the aux images"
        value: ${{ jobs.resolve.outputs.aux-tags }}

permissions:
  contents: read

env:
  AF_REPO: ghcr.io/purdueaf/purdue-af

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      af-image: ${{ steps.hashes.outputs.af-image }}
      af-exists: ${{ steps.hashes.outputs.af-exists }}
      af-digest: ${{ steps.hashes.outputs.af-digest }}
      aux-tags: ${{ steps.hashes.outputs.aux-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve input hashes
        id: hashes
        run: |
          af_tag=$(./.github/workflows/image-inputs.sh purdue-af)
          af_exists=false
          af_digest=""
          if af_digest=$(docker buildx imagetools inspect "$AF_REPO:$af_tag" \
              --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) &&
            [ -n "$af_digest" ] && [ "$af_digest" != "null" ]; then
            af_exists=true
          else
            af_digest=""
          fi
          aux_tags=""
          aux=$(yq '.jobs["build-aux-images"].strategy.matrix.include[].name' .github/workflows/ci-images.yml)
          for name in $aux; do
            tag=$(./.github/workflows/image-inputs.sh "$name")
            channel=latest
            if [ "$name" = interlink-slurm-plugin ] || [ "$name" = interlink-kubernetes-plugin ]; then
              channel=$(tr -d '[:space:]' < "docker/${name}/PLUGIN_REF")
            fi
            aux_tags="${aux_tags:+$aux_tags }${name}=${tag}=${channel}"
          done
          {
            echo "af-image=$AF_REPO:$af_tag"
            echo "af-exists=$af_exists"
            echo "af-digest=$af_digest"
            echo "aux-tags=$aux_tags"
          } | tee -a "$GITHUB_OUTPUT"

  build-af-image:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # in- tag push + registry build cache
    outputs:
      available: ${{ steps.avail.outputs.available }}
      image: ${{ steps.avail.outputs.image }}
      digest: ${{ steps.avail.outputs.digest }}
    env:
      AF_IMAGE: ${{ needs.resolve.outputs.af-image }}
      AF_EXISTS: ${{ needs.resolve.outputs.af-exists }}
      AF_DIGEST_RESOLVED: ${{ needs.resolve.outputs.af-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verified reuse — this exact input state is already on ghcr
        if: env.AF_EXISTS == 'true'
        run: echo "reusing $AF_IMAGE (already built + smoke-tested for this input state)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Free runner disk space
        if: env.AF_EXISTS != 'true'
        uses: ./.github/actions/ensure-disk
        with:
          min-free-gb: 50
          tool-cache: true
      - name: Disk before build
        if: env.AF_EXISTS != 'true'
        run: df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.AF_EXISTS != 'true'
      - name: Resolve the Dockerfile's base image on docker.io
        if: env.AF_EXISTS != 'true'
        run: |
          geddes=$(awk '$1 == "FROM" && $2 ~ /\/dockerhub-proxy-cache\// {print $2; exit}' docker/purdue-af/Dockerfile)
          [[ -n "$geddes" ]] || { echo "::error::no dockerhub-proxy-cache FROM in docker/purdue-af/Dockerfile"; exit 1; }
          {
            echo "GEDDES_BASE=$geddes"
            echo "PUBLIC_BASE=docker.io/${geddes#*/dockerhub-proxy-cache/}"
          } | tee -a "$GITHUB_ENV"
      # Before the build: cache-from needs read, cache-to and push need write.
      - name: Login to ghcr.io
        if: env.AF_EXISTS != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + in-build smoke test
        if: env.AF_EXISTS != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/purdue-af/Dockerfile
          target: smoke
          # The geddes proxy in the Dockerfile's FROM is unreachable from GitHub runners.
          build-contexts: |
            ${{ env.GEDDES_BASE }}=docker-image://${{ env.PUBLIC_BASE }}
          push: false
          # Registry-backed: the layer set exceeds the 10 GB GHA cache.
          cache-from: type=registry,ref=${{ env.AF_REPO }}:buildcache
      - name: Disk after build
        if: env.AF_EXISTS != 'true'
        run: df -h / | tee -a "$GITHUB_STEP_SUMMARY"
      # Only exports: every layer is cached from the step above. The default target ships no smoke layers.
      - name: Push in- tag + build cache (single zstd upload)
        id: push
        if: env.AF_EXISTS != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/purdue-af/Dockerfile
          tags: ${{ env.AF_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-contexts: |
            ${{ env.GEDDES_BASE }}=docker-image://${{ env.PUBLIC_BASE }}
          outputs: type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          cache-from: type=registry,ref=${{ env.AF_REPO }}:buildcache
          # force-compression on both exports: identical zstd blobs, so the registry dedups them.
          cache-to: type=registry,ref=${{ env.AF_REPO }}:buildcache,mode=max,compression=zstd,compression-level=3,force-compression=true,ignore-error=true
      # Digest-pinned: what pixi and e2e test is what publish retags, even if the in- tag moved.
      - name: Record availability
        id: avail
        env:
          PUSH_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest=""
          if [ "$AF_EXISTS" = "true" ]; then
            digest="$AF_DIGEST_RESOLVED"
          elif [ -n "$PUSH_DIGEST" ]; then
            digest="$PUSH_DIGEST"
          fi
          if [ -n "$digest" ]; then
            {
              echo "available=true"
              echo "image=$AF_IMAGE@$digest"
              echo "digest=$digest"
            } | tee -a "$GITHUB_OUTPUT"
          else
            # Fork PR: built but not pushable; downstream jobs fall back to :pre-release.
            {
              echo "available=false"
              echo "image="
              echo "digest="
            } | tee -a "$GITHUB_OUTPUT"
          fi

  build-aux-images:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # in- tag push
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agentic-interface
            dockerfile: docker/agentic-interface/Dockerfile
            context: .
          - name: af-pod-monitor
            dockerfile: docker/af-pod-monitor/Dockerfile
            context: docker/af-pod-monitor
          - name: af-node-monitor
            dockerfile: docker/af-node-monitor/Dockerfile
            context: .
          - name: agentic-analysis
            dockerfile: docker/agentic-analysis/Dockerfile
            context: .
          - name: supersonic-model-manager
            dockerfile: docker/supersonic-model-manager/Dockerfile
            context: .
          - name: interlink-slurm-plugin
            dockerfile: docker/interlink-slurm-plugin/Dockerfile
            context: .
            free_disk: true
          # uncached: exporting its environment layer to the daemon or the GHA cache outlasts building it.
          - name: ray-nrp
            dockerfile: docker/ray-nrp/Dockerfile
            context: .
            free_disk: true
            uncached: true
          - name: interlink-kubernetes-plugin
            dockerfile: docker/interlink-kubernetes-plugin/Dockerfile
            context: .
    name: aux ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve input state
        id: meta
        run: |
          tag=$(./.github/workflows/image-inputs.sh "${{ matrix.name }}")
          image="ghcr.io/purdueaf/${{ matrix.name }}:$tag"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          {
            echo "image=$image"
            echo "exists=$exists"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Verified reuse — this exact input state is already on ghcr
        if: steps.meta.outputs.exists == 'true'
        run: echo "reusing ${{ steps.meta.outputs.image }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Free runner disk space
        if: steps.meta.outputs.exists != 'true' && matrix.free_disk
        uses: ./.github/actions/ensure-disk
        with:
          min-free-gb: 50
          tool-cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.meta.outputs.exists != 'true'
        with:
          driver: ${{ matrix.uncached && 'docker' || 'docker-container' }}
      # Each Dockerfile's trailing RUN holds the image's smoke test, so a failure stops the push.
      - name: Build image
        if: steps.meta.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          load: true
          cache-from: ${{ !matrix.uncached && format('type=gha,scope={0}', matrix.name) || '' }}
          cache-to: ${{ !matrix.uncached && format('type=gha,scope={0},mode=max', matrix.name) || '' }}
      - name: Push in- tag to ghcr.io
        if: steps.meta.outputs.exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          source .github/workflows/ghcr.sh
          ghcr_retry "docker push" docker push ${{ steps.meta.outputs.image }}
