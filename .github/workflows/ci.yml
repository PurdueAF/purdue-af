name: CI

# THE pipeline — the whole automatic CI/CD strategy as one dependency graph.
# Stages live in reusable workflows (ci-*.yml, this directory); publication
# is impossible without every stage of the SAME commit succeeding.
#
#   stage 0   checks      ci-checks.yml   lint · unit tests · manifest validation
#   stage 1a  pixi-base   ci-pixi-base.yml    sync/commit pixi/base lock +
#                                             import-smoke (before AF image —
#                                             Dockerfile uses `pixi install --locked`)
#   stage 1b  images      ci-images.yml       content-addressed builds: every image
#                                             is tagged in-<hash of its input tree>;
#                                             an existing tag is VERIFIED reuse
#   stage 1c  pixi-global ci-pixi-global.yml  sync/commit pixi/global lock +
#                                             import-smoke INSIDE the stage-1 AF image
#                                             + the IRIS-HEP integration challenge
#                                             over CMS OpenData in that same env
#                                             (the env is already installed and the
#                                             image already pulled here)
#   stage 2   e2e         ci-e2e.yml      hub stack in kind, one job per channel:
#                                         e2e-production (spawns the image pinned
#                                         in values.yaml — the "e2e = production"
#                                         gate) and e2e-pre-release (spawns the
#                                         stage-1 AF image — always the current
#                                         repo state, never "whatever :pre-release
#                                         is")
#   stage 3   publish     (below)         main only, strictly behind the ci-ok gate:
#                                         :sha- provenance tags for every image,
#                                         aux continuous channel moves :latest,
#                                         AF image moves :pre-release,
#                                         main-validated (Flux experimental)
#
# ci-ok is the single branch-protection check: it fails if ANY stage did not
# succeed — a skipped-but-required job can never masquerade as a pass.
# Renovate PRs trigger this pipeline like any other PR (no weekly cron).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # never cancel a main run mid-publish; PR runs are superseded freely
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload

  # Lock sync + smoke for pixi/base BEFORE the AF image build so
  # `pixi install --locked` in the Dockerfile sees a matching lock.
  pixi-base:
    needs: checks
    uses: ./.github/workflows/ci-pixi-base.yml
    secrets:
      AF_RELEASE_TOKEN: ${{ secrets.AF_RELEASE_TOKEN }}
    permissions:
      contents: write # lockfile commits
      actions: write # workflow_dispatch when no PAT

  images:
    needs: pixi-base
    uses: ./.github/workflows/ci-images.yml
    permissions:
      contents: read
      packages: write # in- tag push + registry build cache

  pixi-global:
    needs: images
    uses: ./.github/workflows/ci-pixi-global.yml
    with:
      af-image: ${{ needs.images.outputs.af-image }}
      af-image-available: ${{ needs.images.outputs.af-image-available }}
    secrets:
      AF_RELEASE_TOKEN: ${{ secrets.AF_RELEASE_TOKEN }}
    permissions:
      contents: write # lockfile commits
      actions: write # workflow_dispatch when no PAT
      packages: read

  e2e:
    needs: images
    uses: ./.github/workflows/ci-e2e.yml
    with:
      af-image: ${{ needs.images.outputs.af-image }}
      af-image-available: ${{ needs.images.outputs.af-image-available }}
    permissions:
      contents: read
      packages: read

  ci-ok:
    # The one required status check. `if: always()` + explicit result
    # inspection: a failed OR skipped stage fails the gate — success is
    # never assumed for work that did not run.
    needs: [checks, pixi-base, images, pixi-global, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every stage succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null || {
            echo "::error::a required stage failed or was skipped — publication blocked"
            exit 1
          }

  publish:
    # Stage 3 — promote consumable channels. ONLY on push to main.
    # Never on pull_request, never on workflow_dispatch (including the
    # post-lock-commit dispatches on Renovate branches — those may build
    # and push content-addressed in-<hash> tags, but must not move
    # :latest / :pre-release / :sha- / main-validated).
    #
    # Pure retags of digests that just passed the full pipeline
    # (promote-by-digest, no rebuild):
    #   every image        → :sha-<commit>   (immutable provenance)
    #   aux images         → channel tag      (:latest for most;
    #                                          $PLUGIN_REF for interlink-slurm-plugin;
    #                                          manifests pull via geddes
    #                                          ghcr-proxy-cache on restart)
    #   purdue-af          → :pre-release    (the hub's pre-release profile,
    #                                          image_pull_policy Always)
    #   git                → main-validated  (Flux experimental source;
    #                                          moving branch — visible in the
    #                                          GH UI, not pushed by --tags;
    #                                          no workflow listens to this
    #                                          branch)
    #   agentic-interface  → AUTO-RELEASE:    when the validated digest is not
    #                                          what the Deployment pins, mint
    #                                          the next version — MINOR if the
    #                                          skill (the user-facing contract,
    #                                          an image input) changed since
    #                                          the last release, PATCH
    #                                          otherwise (promote the digest,
    #                                          rewrite the pin, commit + tag).
    #                                          Token-free: the GITHUB_TOKEN
    #                                          push triggers no CI, so the
    #                                          bump commit is validated
    #                                          in-run (one-line-retag check),
    #                                          stamped ci-ok via the API, and
    #                                          main-validated advances to it
    #                                          directly.
    # purdue-af promotion to production stays human: release-image.yml.
    needs: [ci-ok, images]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci-ok.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # main-validated branch + auto-release commit/tag
      packages: write
      checks: write # synthetic ci-ok on manifest-only auto-release commits
    steps:
      - name: Refuse to promote off main
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::refusing promote: only push to main may move" \
              " :latest / :pre-release / :sha- / main-validated" \
              " (got event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
            exit 1
          fi
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 # Renovate pins to digest
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Retags are BY DIGEST: what the pipeline tested is what ships, even
      # if a moving tag were overwritten between test and publish; and both
      # channel tags of an image always land on the same digest.
      - name: Publish aux images (:sha- + channel tag)
        env:
          AUX_TAGS: ${{ needs.images.outputs.aux-tags }}
        run: |
          set -euo pipefail
          # Every GHCR call here can fail transiently: secondary rate limits on
          # rapid back-to-back retags (run 31008040707) and DNS/network blips
          # pulling blobs (run 31053841647). Both are retryable, so wrap the
          # digest lookup as well as the retag — an unguarded `inspect` under
          # `set -e` kills the step before any retry can happen.
          # Progress goes to stderr: stdout is captured for the digest.
          ghcr_retry() {
            local what="$1"; shift
            local attempt=1 max=5 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::${what} failed after ${max} attempts" >&2
                return 1
              fi
              echo "::warning::${what} failed (attempt ${attempt}/${max}); retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retag() { ghcr_retry "imagetools create" docker buildx imagetools create "$@"; }
          first=1
          for pair in $AUX_TAGS; do
            # name=in-<hash>=<channel>  (channel is :latest for most aux images,
            # PLUGIN_REF for interlink-slurm-plugin)
            if [ "$first" -eq 0 ]; then sleep 5; else first=0; fi
            name="${pair%%=*}"; rest="${pair#*=}"
            tag="${rest%%=*}"; channel="${rest#*=}"
            repo="ghcr.io/purdueaf/${name}"
            digest=$(ghcr_retry "imagetools inspect $repo:$tag" \
              docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            [ -n "$digest" ] && [ "$digest" != "null" ] || { echo "::error::cannot resolve $repo:$tag"; exit 1; }
            retag \
              -t "$repo:sha-$GITHUB_SHA" \
              -t "$repo:$channel" \
              "$repo@$digest"
            echo "published $repo@$digest ($tag) -> :sha-${GITHUB_SHA::12} + :$channel" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish AF image (:sha- + :pre-release)
        env:
          AF_IMAGE: ${{ needs.images.outputs.af-image }} # digest-pinned ref
          AF_DIGEST: ${{ needs.images.outputs.af-digest }}
        run: |
          set -euo pipefail
          retag() {
            local attempt=1 max=5 delay=15
            until docker buildx imagetools create "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::imagetools create failed after ${max} attempts: $*"
                return 1
              fi
              echo "::warning::imagetools create failed (attempt ${attempt}/${max}); retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          repo="${AF_IMAGE%%:*}"
          retag \
            -t "$repo:sha-$GITHUB_SHA" \
            -t "$repo:pre-release" \
            "$repo@$AF_DIGEST"
          echo "published $repo@$AF_DIGEST -> :sha-${GITHUB_SHA::12} + :pre-release" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags: the auto-release step commits on main and
          # compares the skill tree against the last release tag.
          fetch-depth: 0
      - name: Auto-release agentic-interface (version bump when the image changed)
        id: autorelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same transient-GHCR-failure guard as the aux publish step; progress
          # goes to stderr because stdout is captured for digests.
          ghcr_retry() {
            local what="$1"; shift
            local attempt=1 max=5 delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::${what} failed after ${max} attempts" >&2
                return 1
              fi
              echo "::warning::${what} failed (attempt ${attempt}/${max}); retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          repo="ghcr.io/purdueaf/agentic-interface"
          # The image this run validated: the input-hash tag of the tested tree.
          want=$(./.github/workflows/image-inputs.sh agentic-interface)
          want_digest=$(ghcr_retry "imagetools inspect $repo:$want" \
            docker buildx imagetools inspect "$repo:$want" --format '{{json .Manifest}}' | jq -r .digest)
          [ -n "$want_digest" ] && [ "$want_digest" != "null" ] \
            || { echo "::error::cannot resolve $repo:$want"; exit 1; }
          # The bump commit is pushed with GITHUB_TOKEN (no PAT in this repo),
          # so it will never trigger its own CI run. That is safe ONLY when it
          # sits directly on the tree THIS run validated — if main moved on
          # while we ran, defer to the newer commit's own publish run, which
          # will redo this comparison and release on validated state.
          git fetch --tags origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved past ${GITHUB_SHA::12} — deferring auto-release" \
              "to the newer run" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout -B autorelease "$GITHUB_SHA"
          cur=$(python3 .github/workflows/bump-agentic-version.py --print-current)
          if [ "$cur" = "0.0.0" ]; then
            cur_digest="" # pin is still `latest` — nothing released yet
          else
            cur_digest=$(ghcr_retry "imagetools inspect $repo:$cur" \
              docker buildx imagetools inspect "$repo:$cur" --format '{{json .Manifest}}' | jq -r .digest) \
              || cur_digest=""
          fi
          if [ "$cur_digest" = "$want_digest" ]; then
            echo "agentic-interface :$cur is already this digest — no release" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Bump kind: MINOR when the skill — the user-facing contract of the
          # MCP server — changed since the last release; PATCH otherwise.
          # Compared as git tree ids at the validated commit vs the release
          # tag of the currently pinned version.
          skill=".claude/skills/purdue-af-agentic-interface"
          kind=patch
          if [ "$cur" != "0.0.0" ]; then
            prev_skill=$(git rev-parse "agentic-interface-v$cur:$skill" 2>/dev/null || echo none)
            now_skill=$(git rev-parse "$GITHUB_SHA:$skill")
            if [ "$prev_skill" != "$now_skill" ]; then
              kind=minor
            fi
          fi
          new=$(python3 .github/workflows/bump-agentic-version.py --bump "$kind" | tail -1)
          # Promote-by-digest: the version tag lands on the exact bytes this
          # pipeline tested, never a rebuild.
          ghcr_retry "imagetools create" \
            docker buildx imagetools create -t "$repo:$new" "$repo@$want_digest"
          git config user.name "af-release-bot"
          git config user.email "af-release-bot@users.noreply.github.com"
          git add apps/agentic-interface/deployment.yaml
          # [skip ci] is belt-and-braces: GITHUB_TOKEN pushes trigger nothing
          # anyway, and this commit is validated in-run (below) instead.
          git commit -m "auto-release agentic-interface image $new [skip ci]"
          # In-run validation, replacing the CI run this commit will never
          # get: it must differ from the tree THIS pipeline validated by
          # exactly the one rewritten image-tag line.
          if [ "$(git diff --numstat "$GITHUB_SHA" HEAD)" != \
               "$(printf '1\t1\tapps/agentic-interface/deployment.yaml')" ]; then
            echo "::error::auto-release commit is not the expected one-line manifest retag:"
            git diff --stat "$GITHUB_SHA" HEAD
            exit 1
          fi
          # A racing push loses here (non-fast-forward) — fail rather than
          # rebase onto a tree this run did not validate; the orphaned ghcr
          # version tag is harmless and the next run releases past it.
          git push origin HEAD:refs/heads/main \
            || { echo "::error::pushing the auto-release commit failed (main moved?)"; exit 1; }
          bump_sha=$(git rev-parse HEAD)
          git tag -a "agentic-interface-v$new" -m "agentic-interface image $new
          image: $repo:$new
          digest: $want_digest"
          git push origin "agentic-interface-v$new"
          # Stamp ci-ok on the bump commit so consumers of that check (the
          # purdue-af release gate) keep working: no pipeline will ever run
          # for this commit, and its content — validated tree + the one-line
          # retag checked above — has passed this run's gates by construction.
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=ci-ok -f head_sha="$bump_sha" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=auto-release (manifest-only)' \
            -f "output[summary]=One-line image retag on the tree validated as ${GITHUB_SHA} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}; no separate pipeline runs for GITHUB_TOKEN pushes." \
            > /dev/null
          echo "sha=$bump_sha" >> "$GITHUB_OUTPUT"
          echo "auto-released agentic-interface $new -> $want_digest" \
            "(main-validated advances to the bump commit below)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Advance main-validated
        env:
          # When this run minted an auto-release, advance to the bump commit —
          # it IS this run's validated tree plus the one-line retag checked
          # above, and no pipeline of its own will ever run for it. Otherwise
          # advance to the commit this run validated, as always.
          AUTORELEASE_SHA: ${{ steps.autorelease.outputs.sha }}
        run: |
          set -euo pipefail
          target="${AUTORELEASE_SHA:-$GITHUB_SHA}"
          git push --force origin "${target}:refs/heads/main-validated"
          echo "main-validated -> ${target}" | tee -a "$GITHUB_STEP_SUMMARY"
