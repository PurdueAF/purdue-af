# Builds the Zensical site on PRs and deploys it to GitHub Pages from main.
name: Docs deploy

on:
  push:
    branches:
      - main
    paths: &paths
      - "docs/**"
      - "pixi/**"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=zensical
  ZENSICAL_VERSION: 0.0.74

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.event_name != 'pull_request'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - run: pip install "zensical==${ZENSICAL_VERSION}"
      - name: Build the docs
        working-directory: docs
        run: zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/site

  # A job of its own: listed right after its upload, the artifact can still be missing (actions/deploy-pages#451).
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
