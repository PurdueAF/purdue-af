name: Registry GC

# Weekly ghcr hygiene for every image ci-images.yml builds. Deletes a package
# version only when it is older than MAX_AGE_DAYS and every tag it carries is
# an in-<hash> or sha-<commit> build tag, other than the current repo state's
# in- tag. Never deleted: untagged versions (attestation children, old cache)
# and any version with another tag (semver releases, :latest, :pre-release,
# :buildcache, the interlink-slurm-plugin PLUGIN_REF tag).
# Needs admin Actions access for this repo on every package.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write # version deletion

concurrency:
  group: registry-gc
  cancel-in-progress: false

env:
  MAX_AGE_DAYS: 14

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Delete stale build-tag versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s)
          aux=$(yq '.jobs["build-aux-images"].strategy.matrix.include[].name' .github/workflows/ci-images.yml)
          for name in purdue-af $aux; do
            keep_tag=$(./.github/workflows/image-inputs.sh "$name")
            echo "== ${name} (protecting current ${keep_tag})"
            gh api --paginate "orgs/PurdueAF/packages/container/${name}/versions?per_page=100" \
              | jq -c '.[]' | while read -r v; do
              id=$(jq -r '.id' <<<"$v")
              created=$(jq -r '.created_at' <<<"$v")
              tags=$(jq -r '.metadata.container.tags[]?' <<<"$v")
              # keep young versions
              [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] || continue
              # keep untagged versions (attestation children, old cache)
              [ -n "$tags" ] || continue
              # keep any version with a non-build tag or the current in- tag
              deletable=true
              for t in $tags; do
                case "$t" in
                "$keep_tag") deletable=false ;;
                in-* | sha-*) : ;;
                *) deletable=false ;;
                esac
              done
              [ "$deletable" = "true" ] || continue
              echo "deleting ${name} version ${id} (created ${created}; tags: $(echo "$tags" | tr '\n' ' '))" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              gh api -X DELETE "orgs/PurdueAF/packages/container/${name}/versions/${id}"
            done
          done
