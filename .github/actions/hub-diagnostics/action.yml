name: hub diagnostics
description: Dump kind-cluster state after an e2e failure.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        kubectl get pods -A -o wide
        kubectl get events -n cms --sort-by=.lastTimestamp | tail -40
        kubectl -n cms logs deployment/hub --tail=200 || true
        kubectl -n cms logs -l component=singleuser-server --tail=100 --prefix || true
        kubectl -n cms describe pods -l component=singleuser-server || true
        kubectl -n cms logs deployment/mock-cilogon --tail=50 || true
