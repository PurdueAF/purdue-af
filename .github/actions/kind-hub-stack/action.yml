name: kind hub stack
description: >-
  Bring up the full JupyterHub e2e stack in kind: free disk, uv, flux CLI,
  then cluster and deploy via tests/e2e_hub/setup-kind.sh
  (which reads its image-preload config from the CALLER STEP's env vars —
  set PRELOAD_PRODUCTION/PRODUCTION_IMAGE/PRERELEASE_IMAGE/GHCR_* on the
  step that uses this action), then port-forward hub + mock.
inputs:
  flux-version:
    description: flux CLI version
    required: false
    default: "2.5.1"
runs:
  using: composite
  steps:
    # First on purpose: must never wipe tools other steps install.
    # tool-cache stays FALSE — helm/kind-action hard-fails when
    # /opt/hostedtoolcache is deleted. Room for the ~13 GB uncompressed
    # AF image in kind.
    - name: Free runner disk space
      uses: ./.github/actions/ensure-disk
      with:
        min-free-gb: 50
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: tests/uv.lock
    - name: Install flux CLI
      uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
      with:
        version: ${{ inputs.flux-version }}
    # install_only: the action's post step would spend up to a minute deleting a cluster it created.
    - name: Install kind and kubectl
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        install_only: true
    - name: Deploy hub stack
      shell: bash
      run: tests/e2e_hub/setup-kind.sh
    - name: Port-forward hub and mock
      shell: bash
      run: |
        kubectl -n cms port-forward svc/proxy-public 8080:80 &
        kubectl -n cms port-forward svc/mock-cilogon 9090:9090 &
        sleep 3
