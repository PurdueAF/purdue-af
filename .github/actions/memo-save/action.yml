name: memo save
description: >-
  Record a green run for a memo key. Callers guard with
  `if: success() && <restore>.outputs.hit != 'true'`.
inputs:
  key:
    description: Memo key that just passed; empty records nothing
    required: true
runs:
  using: composite
  steps:
    - if: inputs.key != ''
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/memo" && echo ok > "$RUNNER_TEMP/memo/marker"
    # A failed upload only costs a re-run next time; it must not fail a green job.
    - if: inputs.key != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memo-${{ inputs.key }}
        path: ${{ runner.temp }}/memo/marker
        if-no-files-found: error
        overwrite: true
