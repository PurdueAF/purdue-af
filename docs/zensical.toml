# Zensical configuration for the Purdue Analysis Facility documentation
#
# Build:   cd docs && zensical build --clean   (output: docs/site/)
# Preview: cd docs && zensical serve

[project]

site_name = "Purdue Analysis Facility"
site_description = "Documentation for the Purdue Analysis Facility — an interactive environment for fast and scalable CMS physics analyses using dedicated computing resources at Purdue."
site_author = "Dmitry Kondratyev, Stefan Piperov"

# The site is published to GitHub Pages and served from the custom domain below;
# site_url must match it, since it is what canonical links and sitemap.xml use.
site_url = "https://analysis-facility.physics.purdue.edu/"

copyright = "Copyright &copy; Purdue University"

# Source repository (adds a link in the header).
repo_url = "https://github.com/PurdueAF/purdue-af"
repo_name = "PurdueAF/purdue-af"
edit_uri = "edit/main/docs/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/external-links.js"]


# Navigation: one section per topic. A label here is also the page's title in
# browser tabs, search results and llms.txt, so it must stand on its own.
nav = [
    { "Home" = "index.md" },
    { "Get started" = [
        { "First steps" = "getting-started.md" },
        { "Login methods" = "login-methods.md" },
        { "Interfaces and tools" = "interface.md" },
        { "SSH access" = "guide-ssh-access.md" },
        { "Local IDE" = "guide-ide-connection.md" },
    ] },
    { "Software" = [
        { "Software stacks" = "software.md" },
        { "Pixi environments" = "guide-pixi.md" },
        { "Conda environments" = "guide-conda.md" },
        { "Combine" = "guide-combine.md" },
    ] },
    { "Storage and data" = [
        { "Storage volumes" = "storage.md" },
        { "Data access" = "data-access.md" },
        { "Rucio" = "guide-rucio.md" },
        { "CERNBox" = "guide-cern-eos.md" },
        { "Writing to EOS" = "guide-eos-write.md" },
    ] },
    { "Scale-out and GPUs" = [
        { "Computing resources" = "scaling-out.md" },
        { "Dask" = "guide-dask.md" },
        { "Dask Gateway" = "guide-dask-gateway.md" },
        { "GPUs in a session" = "gpus.md" },
        { "Multi-GPU training" = "guide-ray-train.md" },
    ] },
    { "AI agents" = [
        { "Agents in a session" = "agents.md" },
        { "Agents on your machine" = "guide-agentic-interface.md" },
    ] },
    { "Hardware" = "hardware.md" },
    { "Monitoring dashboard" = "https://cms.geddes.rcac.purdue.edu/grafana/d/purdue-af-dashboard/purdue-analysis-facility-dashboard" },
    { "Guides" = [
        { "MC generation" = "guide-mc-gen.md" },
        { "RooFit on GPUs" = "guide-roofit-cuda.md" },
    ] },
    { "Help" = [
        { "Troubleshooting" = "troubleshooting.md" },
        { "Support" = "support.md" },
        { "Contributing to the docs" = "contributing.md" },
    ] },
]

# A broken link or anchor fails the build.
strict = true

# /llms.txt, and each page's Markdown beside its HTML, for agents.
# Pages that are gone, to where their content went.
[project.plugins.redirects.redirect_maps]
"guide-file-transfer.md" = "interface.md"

[project.plugins.llmstxt]
markdown_description = "User documentation of the Purdue Analysis Facility: JupyterHub sessions for CMS analysis, with Dask, Ray on GPUs, Slurm, Pixi environments and CMS data access. Each page below is also served as Markdown."

[project.plugins.llmstxt.sections]
"Pages" = ["*.md"]

[project.theme]

language = "en"
logo = "images/cms_logo.png"

features = [
    "content.action.copy",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon.admonition]
example = "lucide/code"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.snippets]
base_path = [".."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
