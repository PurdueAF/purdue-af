about: "CMS Run 2 Ultra-Legacy NanoAODv15 datasets of the H→µµ search, by data-taking period: the data, the H→µµ samples of each production mode, and the simulated backgrounds. A signal's xsec_pb is σ·B(H→µµ) from the LHC Higgs Cross Section WG's Yellow Report 4 (arXiv:1610.07922) at m_H = 125.00 GeV, with B(H→µµ) = 2.176e-4. gg → ZH, bbH, tHq and tHW have no H→µµ sample; the Yellow Report gives their cross sections too. One background, a private production, is listed by the directory of its files on Purdue's storage. A background's cross section is for the analysis to establish from a citable source. The trigger is the unprescaled isolated single-muon trigger at the thresholds of arXiv:2009.04363, section 5."
periods:
