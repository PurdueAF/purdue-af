[project]
name = "purdue-af-tests"
version = "0.0.0"
description = "Single test project for all Purdue AF suites (tests/<suite>/)"
requires-python = ">=3.12"
dependencies = [
    # test tooling
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
    # runtime deps of the sources under test
    "mcp[cli]>=1.3.0", # agentic-interface
    "fastapi>=0.115", # supersonic-model-manager
    "python-multipart>=0.0.20", # supersonic-model-manager uploads
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "oauthenticator>=17.0", # jupyterhub extraFiles
    "tornado>=6.4",
    "prometheus_client>=0.22", # exporters
    "cachetools>=5.5", # agentic-interface
    "matplotlib>=3.9", # plot-af-users cron
    "pandas>=2.2",
    "numpy>=1.26", # sonic-ray
    "onnx>=1.16", # sonic-ray tests build tiny models
    "onnxruntime>=1.20", # sonic-ray (CPU build; the image uses onnxruntime-gpu)
]

[tool.uv]
package = false
# The suites also run locally under an x86_64 uv on macOS (Intel Macs, or a
# Rosetta-installed uv on Apple Silicon), where recent onnxruntime releases
# ship no wheel; make the lock resolve to a version that installs there too.
# CI runs on Linux either way; the tests only need the CPU runtime for tiny
# models.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]
