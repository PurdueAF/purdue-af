coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

component_management:
  individual_components:
    - component_id: agentic-interface
      name: Agentic interface (MCP server)
      paths: ["docker/agentic-interface/**"]
    - component_id: jupyterhub-config
      name: JupyterHub config snippets
      paths: ["apps/jupyterhub/jupyterhub/extraFiles/**"]
    - component_id: exporters
      name: Monitoring exporters
      paths:
        - "docker/af-pod-monitor/**"
        - "docker/af-node-monitor/**"
    - component_id: supersonic-model-manager
      name: SuperSONIC model manager
      paths: ["docker/supersonic-model-manager/**"]
    - component_id: workflows
      name: Flyte workflows
      paths: ["workflows/**"]
    - component_id: scripts
      name: Standalone scripts
      paths:
        - "apps/af-utils/**"
        - "docker/purdue-af/**"
        - "helm/sonic-ray/files/**"
        - "pixi/**"
        - ".github/workflows/**"

# One concise PR comment, updated in place.
comment:
  layout: "condensed_header, diff, components"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "**/tests/**"
  - "docker/dask-gateway-server/**" # vendored fork
