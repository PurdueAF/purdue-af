[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-ray"
version = "0.1.0"
description = "The SuperSONIC model repository served by Ray Serve (KServe v2 HTTP, ONNX Runtime)"
requires-python = ">=3.12"
dependencies = [
  # The last onnxruntime-gpu built against CUDA 12 / cuDNN 9 — what the
  # rayproject/ray *-cu128 base image ships and what the Geddes GPU driver
  # (R580) supports. 1.27+ targets CUDA 13; .github/renovate.json5 holds the
  # pin until the base image and the driver move.
  "onnxruntime-gpu==1.26.0",
  "numpy>=1.26",
]
# ray[serve] (and with it fastapi/starlette) comes from the base image and is
# deliberately not listed: pinning it here would fight the image's version.

[tool.setuptools]
packages = ["sonic_ray"]
