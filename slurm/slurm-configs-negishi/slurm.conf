NodeName=cron CPUs=2 Boards=1 SocketsPerBoard=2 CoresPerSocket=1 ThreadsPerCore=1 RealMemory=3700 State=UNKNOWN
NodeName=osg CPUs=2 Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=1 MemSpecLimit=2000 RealMemory=4000 State=UNKNOWN
