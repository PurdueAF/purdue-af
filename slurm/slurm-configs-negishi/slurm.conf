# slurm.conf file generated by configurator.html.
# Put this file on all nodes of your cluster.
# See the slurm.conf man page for more information.
#
SlurmctldHost=adm.negishi.rcac.purdue.edu
#SlurmctldHost=aux.negishi.rcac.purdue.edu
#
AuthType=auth/munge
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/var/spool/slurm/slurm.state/jwt_hs256.key
#CheckpointType=checkpoint/none
CryptoType=crypto/munge
#DisableRootJobs=NO
EnforcePartLimits=ANY
Epilog=/etc/slurm/epilog.d/*
#EpilogSlurmctld=
#FirstJobId=1
#MaxJobId=999999
GresTypes=gpu,hp_cpu
#GroupUpdateForce=0
#GroupUpdateTime=600
#JobCheckpointDir=/var/slurm/checkpoint
#JobCredentialPrivateKey=
#JobCredentialPublicCertificate=
#JobFileAppend=0
#JobRequeue=1
JobSubmitPlugins=lua
LaunchParameters=use_interactive_step
InteractiveStepOptions="--interactive --preserve-env --pty $SHELL -l"
#KillOnBadExit=0
#LaunchType=launch/slurm
#Licenses=foo*4,bar
#MailProg=/bin/mail
MaxJobCount=100000
#MaxStepCount=40000
MaxTasksPerNode=128
MpiDefault=none
#MpiParams=ports=#-#
#PluginDir=
#PlugStackConfig=
#PrivateData=jobs
ProctrackType=proctrack/cgroup
Prolog=/etc/slurm/prolog.d/*
PrologFlags=x11,contain
#PrologSlurmctld=
PropagatePrioProcess=2
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
RebootProgram=/usr/site/rcac/sbin/stateless_reboot.sh
ReturnToService=1
#SallocDefaultCommand=
SlurmctldParameters=enable_configless,conmgr_threads=96,conmgr_max_connections=512,rl_enable,rl_refill_period=1,rl_refill_rate=2,rl_bucket_size=5000,rl_table_size=8192
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/run/slurm/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurm
SlurmdParameters=conmgr_max_connections=256
SlurmUser=slurm
#SlurmdUser=root
#SrunEpilog=
#SrunProlog=
StateSaveLocation=/var/spool/slurm/slurm.state
SwitchType=switch/none
#TaskEpilog=
TaskPlugin=affinity,cgroup
#TaskPluginParam=
TaskProlog=/etc/slurm/slurm-task-prolog
TopologyPlugin=topology/tree
#TmpFS=/tmp
#TrackWCKey=no
#TreeWidth=
#UnkillableStepProgram=
#UsePAM=0
ScronParameters=enable
#
#
# TIMERS
#BatchStartTimeout=10
#CompleteWait=0
#EpilogMsgTime=2000
#GetEnvTimeout=2
HealthCheckInterval=600
HealthCheckProgram=/usr/site/rcac/sbin/nhc
HealthCheckNodeState=ANY
InactiveLimit=0
KillWait=30
MessageTimeout=30
#ResvOverRun=0
MinJobAge=300
#OverTimeLimit=0
SlurmctldTimeout=120
SlurmdTimeout=3600
UnkillableStepTimeout=250
#VSizeFactor=0
Waittime=0
#
#
# SCHEDULING
#
# No mem-per-cpu limit here - set it in partitions (Negishi)
#DefMemPerCPU=1992
#MaxMemPerCPU=1992
#SchedulerTimeSlice=30
SchedulerType=sched/backfill
SchedulerParameters=bf_interval=120,bf_window=10800,bf_resolution=300,bf_max_job_test=2000,bf_max_job_assoc=50,bf_continue,max_rpc_cnt=150
#SelectType=select/cons_res
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
#
#
# JOB PRIORITY
#PriorityFlags=
PriorityType=priority/multifactor
PriorityDecayHalfLife=7-00:00:00
PriorityCalcPeriod=00:05:00
PriorityFavorSmall=NO
PriorityMaxAge=7-00:00:00
PriorityUsageResetPeriod=NONE
PriorityWeightAge=500
PriorityWeightFairshare=50000
PriorityWeightJobSize=1
PriorityWeightPartition=500
PriorityWeightQOS=55000
#
#
# LOGGING AND ACCOUNTING
AccountingStorageEnforce=associations,limits,qos,safe
#AccountingStorageHost=aux.negishi.rcac.purdue.edu
AccountingStorageHost=aux.negishi.rcac.purdue.edu
#AccountingStorageBackupHost=adm.negishi.rcac.purdue.edu
#AccountingStorageLoc=
#AccountingStoragePass=
#AccountingStoragePort=6819
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageUser=slurm
AccountingStoreFlags=job_script,job_env,job_comment
AccountingStorageTRES=gres/gpu,gres/hp_cpu
ClusterName=negishi
#DebugFlags=
#JobCompHost=
JobCompLoc=/var/log/slurm/job_comp.log
#JobCompPass=
#JobCompPort=
JobCompType=jobcomp/filetxt
#JobCompUser=
#JobContainerType=job_container/none
#JobAcctGatherFrequency=30
JobAcctGatherType=jobacct_gather/linux
SlurmctldDebug=3
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=3
SlurmdLogFile=/var/log/slurm/slurmd.log
#SlurmSchedLogFile=
#SlurmSchedLogLevel=
#
#
# POWER SAVE SUPPORT FOR IDLE NODES (optional)
#SuspendProgram=
#ResumeProgram=
#SuspendTimeout=
ResumeTimeout=1200
#ResumeRate=
#SuspendExcNodes=
#SuspendExcParts=
#SuspendRate=
#SuspendTime=
#
#
# COMPUTE NODES
NodeName=a[000-449] CPUs=128 Boards=1 SocketsPerBoard=2 CoresPerSocket=64 ThreadsPerCore=1 Gres=hp_cpu:128 MemSpecLimit=12000 RealMemory=257400 Weight=100 Feature=A,a State=UNKNOWN
NodeName=b[000-005] CPUs=128 Boards=1 SocketsPerBoard=2 CoresPerSocket=64 ThreadsPerCore=1 MemSpecLimit=12000 RealMemory=1031600 Weight=500 Feature=B,b State=UNKNOWN
NodeName=c[000-015] CPUs=256 Boards=1 SocketsPerBoard=2 CoresPerSocket=64 ThreadsPerCore=2 MemSpecLimit=12000 RealMemory=515300 Weight=200 Feature=C,c State=UNKNOWN
NodeName=g[000-004] CPUs=32  Boards=1 SocketsPerBoard=2 CoresPerSocket=16 ThreadsPerCore=1 MemSpecLimit=12000 RealMemory=515500 Gres=gpu:3 Weight=1000 Feature=G,g,MI210,mi210 State=UNKNOWN
