apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/dask-gateway/dask-gateway-k8s-interlink/helmrelease.yaml
  - ../../apps/dask-gateway/dask-gateway-k8s-interlink/ingress.yaml

  - ../../apps/dask-gateway/helmrepo.yaml
  - ../../apps/dask-gateway/dask-gateway-k8s/helmrelease.yaml
  - ../../apps/dask-gateway/dask-gateway-k8s/ingress.yaml
  - ../../apps/dask-gateway/dask-gateway-k8s-slurm/helmrelease.yaml
  - ../../apps/dask-gateway/dask-gateway-k8s-slurm/ingress.yaml

  - ../../apps/monitoring/pyroscope/helmrelease.yaml
  - ../../apps/monitoring/loki/helmrelease.yaml
  - ../../apps/monitoring/alloy/helmrelease.yaml
  - ../../apps/monitoring/tempo/helmrelease.yaml
  - ../../apps/monitoring/helmrepo-stevehipwell.yaml
  # - ../../apps/monitoring/thanos/helmrelease.yaml
  # - ../../apps/monitoring/thanos/data-pvc.yaml

  - ../../apps/servicex/helmrelease.yaml
  - ../../apps/servicex/gitrepo.yaml
  - ../../apps/servicex/gitrepo-dev.yaml
  - ../../apps/servicex/helmrepo.yaml
  - ../../apps/servicex/secrets-objectStore.yaml
  - ../../apps/servicex-s3/helmrelease.yaml
  - ../../apps/servicex-anvil/helmrelease.yaml
  # - ../../apps/servicex-interlink/helmrelease.yaml
  - ../../apps/servicex-eos/helmrelease.yaml
  - ../../apps/servicex-test/helmrelease.yaml

  - ../../apps/sonic/supersonic/helmrelease.yaml
  - ../../apps/sonic/supersonic/helmrepo.yaml
  # Model repository dashboard for the supersonic release above. Needs the
  # supersonic-model-manager-auth Secret to exist in the namespace.
  - ../../apps/sonic/model-manager/helmrelease.yaml

  - ../../apps/interlink/helmrepo.yaml
  - ../../apps/interlink/hammer/helmrelease.yaml
  - ../../apps/interlink/gautschi/helmrelease.yaml
  # Negishi stays off until the munge-key-negishi PVC exists — without it the
  # node pod only ever reaches Pending
  # - ../../apps/interlink/negishi/helmrelease.yaml

  - ../../apps/af-utils/pixi-global-sync/deployment.yaml

  - ../../apps/agentic-interface/rbac.yaml
  - ../../apps/agentic-interface/deployment.yaml
  - ../../apps/agentic-interface/service.yaml

  - ../../apps/monitoring/af-monitoring/deployment-af-node-monitor.yaml
  - ../../apps/monitoring/af-monitoring/af-node-monitor-rbac.yaml
  - ../../apps/monitoring/af-monitoring/services.yaml
  - ../../apps/infrastructure/af-node-monitor-storage.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pixi-global-sync
    options:
      annotations:
        # python/yaml use ${...}-like strings — keep Flux substitution away
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/af-utils/pixi-global-sync/sync-global-env.py
      - ../../pixi/check-env.py
      - ../../pixi/global/pixi.toml
      - ../../pixi/global/pixi.lock

  - name: dask-gateway-k8s-config
    files:
      - values.yaml=../../apps/dask-gateway/dask-gateway-k8s/values.yaml

  - name: dask-gateway-k8s-slurm-config
    files:
      - values.yaml=../../apps/dask-gateway/dask-gateway-k8s-slurm/values.yaml

  - name: dask-gateway-k8s-interlink-config
    files:
      - values.yaml=../../apps/dask-gateway/dask-gateway-k8s-interlink/values.yaml

  - name: pyroscope-config
    files:
      - values.yaml=../../apps/monitoring/pyroscope/values.yaml

  - name: loki-config
    files:
      - values.yaml=../../apps/monitoring/loki/values.yaml

  - name: alloy-config
    files:
      - values.yaml=../../apps/monitoring/alloy/values.yaml

  - name: tempo-config
    files:
      - values.yaml=../../apps/monitoring/tempo/values.yaml

  # - name: thanos-config
  #   files:
  #     - values.yaml=../../apps/monitoring/thanos/values.yaml

  - name: servicex-config
    files:
      - values.yaml=../../apps/servicex/values.yaml

  - name: servicex-s3-config
    files:
      - values.yaml=../../apps/servicex-s3/values.yaml

  - name: servicex-anvil-config
    files:
      - values.yaml=../../apps/servicex-anvil/values.yaml

  # - name: servicex-interlink-config
  #   files:
  #     - values.yaml=../../apps/servicex-interlink/values.yaml

  - name: servicex-eos-config
    files:
      - values.yaml=../../apps/servicex-eos/values.yaml

  - name: servicex-test-config
    files:
      - values.yaml=../../apps/servicex-test/values.yaml

  - name: supersonic-config
    files:
      - values.yaml=../../apps/sonic/supersonic/values.yaml

  - name: supersonic-model-manager-config
    files:
      - values.yaml=../../apps/sonic/model-manager/values-supersonic.yaml

  - name: interlink-hammer-config
    files:
      - values.yaml=../../apps/interlink/hammer/values.yaml

  - name: interlink-gautschi-config
    files:
      - values.yaml=../../apps/interlink/gautschi/values.yaml

  # - name: interlink-negishi-config
  #   files:
  #     - values.yaml=../../apps/interlink/negishi/values.yaml

  - name: af-node-monitor-config
    files:
      - ../../docker/af-node-monitor/node_healthcheck.py
