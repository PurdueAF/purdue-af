apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps/dask-gateway/helmrepo.yaml
  - ../../apps/dask-gateway/helmrelease.yaml
  - ../../apps/dask-gateway/ingress.yaml
  - ../../apps/dask-gateway/aliases.yaml

  - ../../apps/monitoring/pyroscope/helmrelease.yaml
  - ../../apps/monitoring/loki/helmrelease.yaml
  - ../../apps/monitoring/alloy/helmrelease.yaml

  - ../../apps/servicex/helmrepo.yaml
  - ../../apps/servicex/servicex-anvil/helmrelease.yaml
  - ../../apps/servicex/servicex-anvil/secrets.yaml

  # Chart source for the SuperSONIC releases below, on SuperSONIC main.
  - ../../apps/sonic/supersonic/gitrepo.yaml
  # Default SuperSONIC: CMS Run 3 MiniAOD models off CVMFS.
  - ../../apps/sonic/supersonic/helmrelease.yaml
  # AF-facing SuperSONIC with a PVC model repository.
  - ../../apps/sonic/supersonic-af/helmrelease.yaml
  # Triton offloaded to Slurm on Hammer through the interlink-hammer node.
  - ../../apps/sonic/supersonic-interlink/helmrelease.yaml
  # Sweeps the Failed Triton pods interLink leaves behind, keeping the newest.
  - ../../apps/sonic/supersonic-interlink/pod-pruner-rbac.yaml
  - ../../apps/sonic/supersonic-interlink/pod-pruner-cronjob.yaml
  # Model repository dashboard for the supersonic-af release above. Needs the
  # supersonic-model-manager-auth Secret to exist in the namespace.
  - ../../apps/sonic/model-manager/helmrelease.yaml

  - ../../apps/flyte/helmrepo.yaml
  - ../../apps/flyte/helmrelease.yaml
  - ../../apps/flyte/postgres.yaml
  - ../../apps/flyte/minio.yaml
  - ../../apps/flyte/podtemplate.yaml
  - ../../apps/flyte/secret-console-auth.yaml

  # Watches Loki for errors and opens draft PRs here when the fix is a code
  # change (workflows/self-repair).
  - ../../apps/self-repair/podtemplate.yaml
  - ../../apps/self-repair/cronjob.yaml
  - ../../apps/self-repair/secret-github.yaml
  - ../../apps/self-repair/secret-genai.yaml

  - ../../apps/ray/helmrepo.yaml
  - ../../apps/ray/operator/helmrelease.yaml

  - ../../apps/ray-train/rbac.yaml
  - ../../apps/ray-train/deployment.yaml
  - ../../apps/ray-train/service.yaml
  - ../../apps/ray-train/networkpolicy.yaml

  - ../../apps/interlink/helmrepo.yaml
  - ../../apps/interlink/hammer/helmrelease.yaml

  - ../../apps/af-utils/pixi-global-sync/deployment.yaml

  - ../../apps/agentic-interface/rbac.yaml
  - ../../apps/agentic-interface/deployment.yaml
  - ../../apps/agentic-interface/service.yaml
  - ../../apps/agentic-interface/networkpolicy.yaml

  - ../../apps/monitoring/af-monitoring/deployment-af-node-monitor.yaml
  - ../../apps/monitoring/af-monitoring/daemonset-af-node-probe.yaml
  - ../../apps/monitoring/af-monitoring/af-node-monitor-rbac.yaml
  - ../../apps/monitoring/af-monitoring/services.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: pixi-global-sync
    options:
      annotations:
        # python/yaml use ${...}-like strings — keep Flux substitution away
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/af-utils/pixi-global-sync/sync-global-env.py
      - ../../pixi/check-env.py
      - ../../pixi/global/pixi.toml
      - ../../pixi/global/pixi.lock

  - name: dask-gateway-config
    files:
      - values.yaml=../../apps/dask-gateway/values.yaml

  - name: pyroscope-config
    files:
      - values.yaml=../../apps/monitoring/pyroscope/values.yaml

  - name: loki-config
    files:
      - values.yaml=../../apps/monitoring/loki/values.yaml

  - name: alloy-config
    files:
      - values.yaml=../../apps/monitoring/alloy/values.yaml

  - name: servicex-anvil-config
    files:
      - values.yaml=../../apps/servicex/servicex-anvil/values.yaml

  - name: supersonic-config
    files:
      - values.yaml=../../apps/sonic/supersonic/values.yaml

  - name: supersonic-af-config
    files:
      - values.yaml=../../apps/sonic/supersonic-af/values.yaml

  - name: supersonic-interlink-config
    files:
      - values.yaml=../../apps/sonic/supersonic-interlink/values.yaml

  # Hand-written Envoy config for supersonic-interlink, referenced by
  # envoy.external_config in its values.
  - name: supersonic-interlink-envoy-config-custom
    files:
      - envoy.yaml=../../apps/sonic/supersonic-interlink/envoy-config.yaml

  - name: supersonic-model-manager-config
    files:
      - values.yaml=../../apps/sonic/model-manager/values-supersonic-af.yaml

  - name: kuberay-operator-config
    files:
      - values.yaml=../../apps/ray/operator/values.yaml

  - name: ray-train-gateway
    options:
      annotations:
        # code and a template, not manifests — keep Flux substitution away
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../apps/ray-train/gateway.py
      - ../../apps/ray-train/raycluster.yaml

  - name: flyte-config
    files:
      - values.yaml=../../apps/flyte/values.yaml

  - name: interlink-hammer-config
    files:
      - values.yaml=../../apps/interlink/hammer/values.yaml

  - name: af-node-monitor-config
    files:
      - ../../docker/af-node-monitor/node_healthcheck.py
      - ../../docker/af-node-monitor/probe_agent.py
      - ../../docker/af-node-monitor/job_runner.py

  # Read by the self-repair launcher at every tick, so a merged code change is
  # picked up by the next run with no redeploy.
  - name: self-repair-workflow
    options:
      annotations:
        # python uses ${...}-like strings — keep Flux substitution away
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../workflows/self-repair/self_repair.py
      - ../../workflows/self-repair/triage.py
      - ../../workflows/self-repair/prompts.py
      - ../../workflows/self-repair/genai_proxy.py
      - ../../workflows/self-repair/config.yaml

  # The platform context every agent in an AF session reads, mounted into the
  # self-repair task pods at the path the purdue-af image bakes it into.
  - name: self-repair-platform-context
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../docker/purdue-af/agents/platform-context.md
