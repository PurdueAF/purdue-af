[workspace]
authors = ["Dmitry Kondratyev"]
channels = ["conda-forge"]
name = "pixi-global"
# The cuda entry is the __cuda virtual package the GPU builds need.
platforms = [{ platform = "linux-64", cuda = "12.4" }]
# A lock written by a newer pixi is not readable by an older one.
requires-pixi = ">=0.81"
version = "0.1.0"

[dependencies]
awkward = "*"
awkward-pandas = "*"
bokeh = "3.10.0.*"
# boost = "*"
cabinetry = "*"
ca-certificates = "*"
certifi = "*"
click = "*"
cms-combine = "==11.0.0"
coffea = "2026.9.0.*"
correctionlib="*"
dask = "*"
dask-gateway = "*"
dask-histogram = "*"
dask-jobqueue = "*"
dask-memusage = "*"
dask-ml = "*"
dask-xgboost = "*"
distributed = "*"
eigen = "*"
fsspec-xrootd = "*"
gcc_linux-64 = "*"
graphviz = "*"
gpustat = "*"
gsl = "*"
gxx_linux-64 = "*"
h5py = "<3.16.1"
hepdata-lib = "*"
hist = "*"
ipykernel = "*"
ipympl = "*"
ipywidgets = "*"
jupyter = "*"
jupyter-sshd-proxy = "0.3.0.*"
law = "*"
lhapdf = "*"
libgcc-devel_linux-64 = "*"
libstdcxx-devel_linux-64 = "*"
lmfit = "*"
# madminer = "*"
mamba = "*"
matplotlib = "*"
mimesis = "*"
# floor: an unconstrained solve can pick mlflow 1.x, whose protos fail under protobuf >= 4
mlflow = ">=3"
mplhep = ">=1.1.2"
numba = "*"
numpy = "*"
omegaconf = "*"
openssl = "*"
openssh = "*"
optuna = "*"
pandas = "*"
particle = "*"
pcre2 = "*"
pip = "*"
plotly = "*"
py-spy = "*"
pyarrow = "*"
pycurl = "*"
pydot = "*"
pyhf = "*"
pyjuliacall = "*"
pytest = "*"
python = "3.13.*"
python-graphviz = "*"
pytorch = "2.13.*"
# floor: Ray Train clusters run from this env, with Ray's token authentication (2.52+)
ray-default = ">=2.52"
ray-train = "*"
rucio-clients = "*"
root = ">=6.40.2,<6.41"
scikit-learn = "*"
scikit-optimize = "*"
scipy = "*"
seaborn = "*"
setuptools = "*"
sysroot_linux-64 = "*"
tbb = "*"
torch-geometric = "*"
tqdm = "*"
uncertainties = "*"
uproot = "*"
vdt = "*"
vector = "*"
wrapt = "<2"
xgboost = "*"
# The version pixi/base pins; root_base links libxrootd 6.x on its own.
xrootd = "5.9.2.*"
zuko = "*"

[pypi-dependencies]
cmsstyle = "*"
dbs3-client = "*"
phyprakit = "*"
scalpl = "*"
servicex = "==3.3.1"
termplotlib = "*"
xgbfir = "*"
roastcoffea = "*"
pyroscope-io = "*"
