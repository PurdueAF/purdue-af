# Lock with the pixi version pinned by ARG PIXI_VERSION in docker/purdue-af/Dockerfile.
[workspace]
name = "base-env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Core runtime
python        = "3.12.*"
conda         = "==26.7.2"
mamba         = "==2.9.0"
jupyter_core  = "==5.9.1"
jupyter       = "==1.1.1"
code-server   = "==4.138.0"
jupyter-vscode-proxy = "==0.7"
jupyter-server-proxy = "==4.6.0"

# Jupyter pieces
jupyter_server = "==2.21.1"
notebook      = "==7.6.3"
jupyterhub    = "==6.0.1"
jupyterlab    = "==4.6.4"
ipyparallel   = "==9.2.0"
nodejs        = "22.*"

# AI in JupyterLab; pulls in jupyter_server_documents, the RTC-backed engine for every notebook.
jupyter-ai    = "==3.2.0"

# Kernel discovery / misc
nb_conda_kernels      = "==2.5.1"
metakernel            = "==1.0.7"
importlib-metadata    = "<8.8"   # opentelemetry-api requires <8.8.0

# Other tools
# xrootd puts xrdcp/xrdfs on the session PATH.
xrootd        = "==5.9.2"  # matches the global env
rucio-clients = "==41.2.2"
pytest        = "==9.1.1"
lz4           = "==4.4.5"
ipywidgets    = "==8.1.9"
ipympl        = "==0.10.0"
bokeh         = "==3.10.0"
# p-suffix = upstream "portable" releases (stable, not pre-release); Renovate
# parses them via the regex-versioning rule in renovate.json5.
# >=10.2p1 required alongside mamba >=2.8 (both sides must agree on krb5 1.22).
openssh       = "10.5p1"
uv            = "==0.12.18"

[pypi-dependencies]
jupyterlab-git            = "==0.54.1"
jupyter-resource-usage    = "==1.3.0"
jupyterlab_iframe         = "==0.5.0"
jupyter-archive           = "==3.5.1"
jupyterlab_favorites      = "==3.5.2"
purdue-af-shutdown-button = "==0.2.0"
purdue-af-vscode-button   = "==0.1.2"
jupyterlab-topbar-text    = "==1.1.0"
jupyterlab-theme-toggler  = "==1.1.0"
dask-gateway              = "==2026.3.0"
pyroscope-io              = "==1.2.4"
opentelemetry-api                      = "==1.44.0"
opentelemetry-sdk                      = "==1.44.0"
opentelemetry-exporter-otlp-proto-http = "==1.44.0"
jupyter-sshd-proxy        = "==0.3.0"
pixi-kernel               = "==0.7.1"

[environments]
base-env = { features = [] }
