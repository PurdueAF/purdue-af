# Lock file must be generated with pixi 0.62.2 (lock format v6); see docker/purdue-af/Dockerfile.
[workspace]
name = "base-env"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Core runtime
python        = "3.12.*"
conda         = "==26.7.0"
mamba         = "==2.8.1"
jupyter_core  = "==5.9.1"
jupyter       = "==1.1.1"
code-server   = "==4.130.0"
jupyter-vscode-proxy = "==0.7"
jupyter-server-proxy = "==4.5.0"

# Jupyter pieces
jupyter_server = "==2.20.0"
notebook      = "==7.6.1"
jupyterhub    = "==5.5.0"
jupyterlab    = "==4.6.2"
ipyparallel   = "==9.2.0"
nodejs        = "22.*"

# Kernel discovery / misc
nb_conda_kernels      = "==2.5.1"
metakernel            = "==1.0.0"
importlib-metadata    = "<8.8"   # opentelemetry-api requires <8.8.0

# Other tools
# xrootd puts xrdcp/xrdfs on the session PATH: the grid clients in /usr/bin
# (gfal, voms-proxy-init) are useless for XRootD reads without it, and users
# should not need the global pixi env just to copy a file.
xrootd        = "==5.9.2"  # matches the global env
rucio-clients = "==41.1.1"
pytest        = "==9.1.1"
lz4           = "==4.4.5"
ipywidgets    = "==8.1.8"
ipympl        = "==0.10.0"
bokeh         = "==3.9.2"
# p-suffix = upstream "portable" releases (stable, not pre-release); Renovate
# parses them via the regex-versioning rule in renovate.json5.
# >=10.2p1 required alongside mamba >=2.8 (both sides must agree on krb5 1.22).
openssh       = "==10.4p1"
uv            = "==0.12.1"

[pypi-dependencies]
jupyterlab-git            = "==0.54.1"
jupyter-resource-usage    = "==1.2.1"
jupyterlab_iframe         = "==0.5.0"
jupyter-archive           = "==3.5.1"
jupyterlab_favorites      = "==3.5.2"
purdue-af-shutdown-button = "==0.1.0"
purdue-af-vscode-button   = "==0.1.2"
jupyterlab-topbar-text    = "==1.1.0"
jupyterlab-theme-toggler  = "==1.1.0"
dask-gateway              = "==2026.3.0"
pyroscope-io              = "==1.2.1"
opentelemetry-api                      = "==1.44.0"
opentelemetry-sdk                      = "==1.44.0"
opentelemetry-exporter-otlp-proto-http = "==1.44.0"
jupyter-sshd-proxy        = "==0.3.0"
pixi-kernel               = "==0.7.1"

[environments]
base-env = { features = [] }
