apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flyte-postgres
spec:
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flyte-postgres
  template:
    metadata:
      labels:
        app: flyte-postgres
    spec:
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      containers:
        - name: postgres
          image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: flyte
            - name: POSTGRES_PASSWORD
              value: flyte
            - name: POSTGRES_DB
              value: flyte
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flyte-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: flyte-postgres
spec:
  selector:
    app: flyte-postgres
  ports:
    - port: 5432
