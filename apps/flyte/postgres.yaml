apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flyte-postgres
spec:
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flyte-postgres
  template:
    metadata:
      labels:
        app: flyte-postgres
    spec:
      nodeSelector:
        ${af_node_label:=cms-af-prod}: ${af_node_label_value:="true"}
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      initContainers:
        # A fresh volume's root is root-owned; Postgres runs as uid 70 and needs its own PGDATA.
        - name: pgdata-owner
          image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/postgres:16.15-alpine
          command:
            - sh
            - -c
            - d=/var/lib/postgresql/data/pgdata; mkdir -p $d; [ "$(stat -c %u $d)" = 70 ] || { chmod 700 $d && chown 70:70 $d; }
          securityContext:
            capabilities:
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/postgres:16.15-alpine
          securityContext:
            runAsUser: 70
            runAsGroup: 70
          env:
            - name: POSTGRES_USER
              value: flyte
            - name: POSTGRES_PASSWORD
              value: flyte
            - name: POSTGRES_DB
              value: flyte
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flyte-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: flyte-postgres
spec:
  selector:
    app: flyte-postgres
  ports:
    - port: 5432
