apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: flyte
spec:
  interval: 1m
  chart:
    spec:
      chart: flyte-binary
      version: "v2.0.48"
      sourceRef:
        kind: HelmRepository
        name: flyteorg
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: flyte-config
      valuesKey: values.yaml
