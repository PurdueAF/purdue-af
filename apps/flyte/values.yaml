fullnameOverride: flyte

flyte-core-components:
  runs:
    storagePrefix: s3://flyte
  actions:
    kubernetes:
      namespace: cms

configuration:
  database:
    postgres:
      host: flyte-postgres
      dbname: flyte
      username: flyte
      password: flyte
  storage:
    metadataContainer: flyte
    provider: s3
    providerConfig:
      s3:
        region: us-east-1
        disableSSL: true
        endpoint: http://flyte-minio.cms.svc.cluster.local:9000
        authType: accesskey
        accessKey: flyte
        secretKey: flyteflyte
  inline:
    plugins:
      k8s:
        default-pod-template-name: flyte-task
        default-env-vars:
          - FLYTE_AWS_ENDPOINT: http://flyte-minio.cms.svc.cluster.local:9000
          - FLYTE_AWS_ACCESS_KEY_ID: flyte
          - FLYTE_AWS_SECRET_ACCESS_KEY: flyteflyte
          - _U_EP_OVERRIDE: flyte-http.cms:8090
          - _U_INSECURE: "true"
          - _U_USE_ACTIONS: "1"

deployment:
  waitForDB:
    image:
      repository: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/postgres
      tag: 16-alpine
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  extraPodSpec:
    nodeSelector:
      cms-af-prod: "true"
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: cms-af
        effect: NoSchedule

# The console calls the API on its own origin, so the ingress below serves
# both: the SPA under /v2, the flyteidl2.* services next to it. Basic auth in
# front of everything — the API has no auth of its own, and anyone who reaches
# it can run tasks in cms.
console:
  replicaCount: 1
  image:
    # What :latest resolved to on 2026-09-16; the image publishes git-sha tags only.
    tag: 51cf2bba8935adbd47280c41f56041f23fd10600
  env:
    # The Next.js server binds to $HOSTNAME, which Kubernetes sets to the pod
    # name, i.e. the pod IP only. Fine for the ingress, unreachable for
    # `kubectl port-forward`, which dials 127.0.0.1 inside the pod.
    - name: HOSTNAME
      value: "0.0.0.0"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule

# The auth Secret is secret-console-auth.yaml.
ingress:
  create: ${enable_ingresses}
  host: flyte-cms.geddes.rcac.purdue.edu
  ingressClassName: public
  tls:
    - hosts:
        - flyte-cms.geddes.rcac.purdue.edu
  commonAnnotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: flyte-console-auth
    nginx.ingress.kubernetes.io/auth-realm: Flyte console

flyteconnector:
  enabled: false
