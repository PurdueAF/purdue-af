# What the AF Prometheus scrapes. Two Services rather than one because Ray and
# Triton expose /metrics on different ports and only the workers run Triton:
# a single Service carrying both ports would have Prometheus scraping 8002 on
# the head, where nothing listens.
#
# Neither can be the LoadBalancer in triton-service.yaml — the `pods` job
# scrapes /metrics on *every* port of a Service it keeps, and 8000/8001 are not
# metrics endpoints.
#
# The app/release/component labels become the `app`, `release` and `component`
# Prometheus labels (apps/monitoring/prometheus/values.yaml). release=sonic-ray
# is what makes the nv_* series here selectable in the SuperSONIC dashboards
# the same way the supersonic release's are.
#
# They select on the labels the RayService pod templates set rather than on
# ray.io/cluster: RayService names the cluster it owns <name>-raycluster-<hash>
# and renames it on every NewCluster upgrade.
apiVersion: v1
kind: Service
metadata:
  name: sonic-ray-metrics
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
    app.kubernetes.io/component: ray
    scrape_metrics: "true"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
  ports:
    # Ray and Ray Serve metrics: replica counts, queue lengths, latencies.
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sonic-ray-triton-metrics
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
    app.kubernetes.io/component: triton
    scrape_metrics: "true"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
    app.kubernetes.io/component: worker
  ports:
    # Triton's own nv_* metrics — the series the SuperSONIC dashboards plot.
    - name: triton-metrics
      port: 8002
      targetPort: triton-metrics
