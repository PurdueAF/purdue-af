# The inference entry point, and the direct analogue of the supersonic release's
# Envoy Service: one address on the geddes private pool, fronting every Triton,
# with kube-proxy doing the round-robin Envoy's loadBalancerPolicy does.
#
# The only way in, for gRPC and HTTP alike: nothing proxies inference through
# Ray. CMSSW's SONIC clients point at :8001 here exactly as they point at the
# supersonic release's Envoy address.
#
# Traffic bypassing Ray is also why the worker group cannot be autoscaled on
# Ray's own request metrics — the controller in serve/sonic_serve.py reads
# Triton's queue depth instead.
#
# It selects worker pods only: the head runs no Triton.
apiVersion: v1
kind: Service
metadata:
  name: sonic-ray-triton
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
    app.kubernetes.io/component: triton
  annotations:
    metallb.universe.tf/address-pool: geddes-private-pool
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
    app.kubernetes.io/component: worker
  ports:
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: http
      port: 8000
      targetPort: http
