# Triton on Ray: the production SuperSONIC serving stack, with Ray doing what
# Envoy and KEDA do in apps/sonic/supersonic.
#
# Every worker pod runs the same Triton image, with the same arguments, the
# same resources and the same model repository as the supersonic release — so
# feature parity is not approximated, it is the same server. Ray owns the pods
# and scales them; a Serve replica sits beside each Triton and proxies HTTP to
# it, which is what ties "one more replica" to "one more Triton".
#
#   SuperSONIC                          | this release
#   ------------------------------------+-------------------------------------
#   triton (GPU inference servers)      | the triton container in each
#                                       |   gpu-group worker pod, unchanged
#   envoy (entry point, LB svc)         | sonic-ray-triton Service (gRPC, HTTP)
#                                       |   and the Serve proxy for HTTP
#   KEDA ScaledObject, 1 -> 10 replicas | Serve autoscaling 1 -> 10, driving
#                                       |   the Ray worker autoscaler
#   model repository PVC at /models     | same PVC, read-only
#
# A RayService rather than the ray-cluster Helm chart: the chart renders a bare
# RayCluster with no Serve application, and it is the Serve application that
# makes replica count and Triton count the same number.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: sonic-ray
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
spec:
  # Roll a new cluster in and cut over once its Serve app is healthy, rather
  # than mutating the running one — the closest thing to the maxUnavailable: 0
  # rollout the supersonic Envoy Deployment is patched with.
  upgradeStrategy:
    type: NewCluster

  serveConfigV2: |
    applications:
      - name: sonic
        import_path: sonic_serve:app
        route_prefix: /
        runtime_env:
          env_vars:
            # Same pod, same network namespace as the Triton container.
            TRITON_HTTP: http://127.0.0.1:8000
        deployments:
          - name: TritonProxy
            ray_actor_options:
              num_cpus: 0.5
              # Each worker advertises exactly one "triton", so a replica can
              # only land on a pod that has a Triton — and one more replica
              # means one more pod, which brings one more Triton.
              resources:
                triton: 1
            # Triton does its own batching and queueing; the proxy must not
            # become the queue.
            max_ongoing_requests: 256
            autoscaling_config:
              # keda.minReplicaCount / maxReplicaCount of the supersonic release.
              min_replicas: 1
              max_replicas: 10
              target_ongoing_requests: 64
              # keda.scaleUp/scaleDown.stabilizationWindowSeconds.
              upscale_delay_s: 30
              downscale_delay_s: 45

  rayClusterConfig:
    rayVersion: "2.52.0"

    # Adds worker pods when Serve asks for replicas that do not fit — the
    # second half of what KEDA does for Triton.
    enableInTreeAutoscaling: true
    autoscalerOptions:
      upscalingMode: Default
      idleTimeoutSeconds: 45
      resources:
        limits: { cpu: 500m, memory: 512Mi }
        requests: { cpu: 500m, memory: 512Mi }

    headGroupSpec:
      # The Serve HTTP entry point. Clients on the geddes private pool, never a
      # public ingress — same as envoy.service.type in the supersonic release.
      serviceType: LoadBalancer
      headService:
        metadata:
          annotations:
            metallb.universe.tf/address-pool: geddes-private-pool
      rayStartParams:
        # The head runs the Serve HTTP proxy and nothing else — no Triton, no
        # replicas, exactly like Envoy. num-cpus: 0 keeps replicas off it.
        num-cpus: "0"
        dashboard-host: 0.0.0.0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ray
            app.kubernetes.io/instance: sonic-ray
            app.kubernetes.io/component: head
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.52.0
              imagePullPolicy: IfNotPresent
              env:
                # Where the Serve app is imported from.
                - name: PYTHONPATH
                  value: /serve_app
              ports:
                - { name: gcs-server, containerPort: 6379 }
                - { name: client, containerPort: 10001 }
                - { name: dashboard, containerPort: 8265 }
                - { name: metrics, containerPort: 8080 }
                - { name: serve, containerPort: 8000 }
              resources:
                limits: { cpu: "2", memory: 8Gi }
                requests: { cpu: "2", memory: 8Gi }
              volumeMounts:
                - { name: serve-app, mountPath: /serve_app }
                - { name: log-volume, mountPath: /tmp/ray }
          volumes:
            - name: serve-app
              configMap: { name: sonic-ray-serve-app }
            - name: log-volume
              emptyDir: {}
          # Same placement as supersonic's triton and envoy pods.
          nodeSelector: { "cms-af-prod": "true" }
          tolerations:
            - key: hub.jupyter.org/dedicated
              operator: Equal
              value: cms-af
              effect: NoSchedule

    workerGroupSpecs:
      - groupName: gpu-group
        replicas: 1
        minReplicas: 1
        maxReplicas: 10
        rayStartParams:
          # The resource the Serve replica claims. It is what pairs one replica
          # with one Triton, and what the Ray autoscaler provisions pods for.
          resources: '"{\"triton\": 1}"'
        template:
          metadata:
            labels:
              app.kubernetes.io/name: ray
              app.kubernetes.io/instance: sonic-ray
              app.kubernetes.io/component: worker
          spec:
            containers:
              # The Ray side of the pod: the Serve replica and the raylet. It
              # holds no models and needs no GPU — it forwards over loopback.
              - name: ray-worker
                image: rayproject/ray:2.52.0
                imagePullPolicy: IfNotPresent
                env:
                  - name: PYTHONPATH
                    value: /serve_app
                resources:
                  limits: { cpu: "1", memory: 2Gi }
                  requests: { cpu: "1", memory: 2Gi }
                volumeMounts:
                  - { name: serve-app, mountPath: /serve_app }
                  - { name: log-volume, mountPath: /tmp/ray }

              # The inference server itself — image, arguments and resources
              # copied from apps/sonic/supersonic/values.yaml, so this is the
              # production Triton, not an approximation of it.
              - name: triton
                image: nvcr.io/nvidia/tritonserver:26.04-py3
                imagePullPolicy: IfNotPresent
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    /opt/tritonserver/bin/tritonserver \
                    --model-repository=/models \
                    --model-control-mode=explicit \
                    --load-model=* \
                    --allow-gpu-metrics=true \
                    --log-verbose=0 \
                    --disable-auto-complete-config \
                    --exit-timeout-secs=60
                ports:
                  - { name: http, containerPort: 8000 }
                  - { name: grpc, containerPort: 8001 }
                  - { name: triton-metrics, containerPort: 8002 }
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: 16
                    memory: 16G
                  requests:
                    nvidia.com/gpu: 1
                    cpu: 16
                    memory: 16G
                # A large repository can take minutes to load; the startup
                # probe buys that time without making readiness lax afterwards.
                startupProbe:
                  httpGet: { path: /v2/health/ready, port: http }
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 24
                readinessProbe:
                  httpGet: { path: /v2/health/ready, port: http }
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 3
                  # supersonic's triton.readinessProbe.successThreshold.
                  successThreshold: 3
                volumeMounts:
                  - {
                      name: model-repository,
                      mountPath: /models,
                      readOnly: true,
                    }
            volumes:
              - name: serve-app
                configMap: { name: sonic-ray-serve-app }
              - name: log-volume
                emptyDir: {}
              # The claim the SuperSONIC model manager writes
              # (apps/sonic/model-manager). Read-only here: Triton only reads
              # it, and this release does not own the repository.
              - name: model-repository
                persistentVolumeClaim:
                  claimName: supersonic-model-repository
                  readOnly: true
            nodeSelector: { "cms-af-prod": "true" }
            tolerations:
              - key: hub.jupyter.org/dedicated
                operator: Equal
                value: cms-af
                effect: NoSchedule
