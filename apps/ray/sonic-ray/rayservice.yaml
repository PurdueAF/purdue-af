# Triton on Ray: the production SuperSONIC serving stack, scheduled and
# autoscaled by KubeRay instead of by Envoy and KEDA.
#
# Every worker pod runs the same Triton image, with the same arguments, the
# same resources and the same model repository as apps/sonic/supersonic — so
# feature parity is not approximated, it is the same server. What is not
# copied is the autoscaling: there is no KEDA here and no Prometheus in the
# loop. The Ray autoscaler owns the worker group, and a single controller
# replica on the head turns Triton's own queue depth into Ray resource demand
# (apps/ray/sonic-ray/serve/sonic_serve.py).
#
#   SuperSONIC                          | this release
#   ------------------------------------+-------------------------------------
#   triton (GPU inference servers)      | the triton container in each
#                                       |   gpu-group worker pod, unchanged
#   envoy (entry point, LB svc)         | sonic-ray-triton Service
#   KEDA ScaledObject + Prometheus      | Ray autoscaler, driven by
#                                       |   request_resources() from Triton's
#                                       |   own nv_inference_pending_request_count
#   model repository PVC at /models     | same PVC, read-only
#
# A RayService rather than the ray-cluster Helm chart: the chart renders a bare
# RayCluster with nowhere to declare the controller that does the scaling.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: sonic-ray
  labels:
    app.kubernetes.io/name: ray
    app.kubernetes.io/instance: sonic-ray
spec:
  # Roll a new cluster in and cut over once it is healthy, rather than mutating
  # the running one. It costs one extra GPU for the length of an upgrade; if
  # none is free the new cluster simply waits and the old one keeps serving.
  upgradeStrategy:
    type: NewCluster

  serveConfigV2: |
    # Nothing routes inference through Serve — gRPC goes straight to the Triton
    # containers — so the proxy belongs only where the controller runs.
    proxy_location: HeadOnly
    applications:
      - name: sonic
        import_path: sonic_serve:app
        route_prefix: /
        deployments:
          - name: TritonAutoscaler
            num_replicas: 1
            ray_actor_options:
              # No CPU reservation and no GPU: it scrapes and decides. The
              # controller resource pins it to the head, where nothing else
              # runs, so it can never occupy a GPU pod.
              num_cpus: 0
              resources:
                controller: 1
            # The scaling policy. Changing it is a config update, not a
            # restart — Serve calls reconfigure() with this.
            user_config:
              min_servers: 1
              max_servers: 10
              # Queued-or-executing requests per Triton before another is asked
              # for; Ray Serve's target_ongoing_requests, in Triton's currency.
              target_pending_per_server: 16
              control_interval_s: 10
              # Releasing a pod kills the Triton in it, so a lull between
              # batches must not be mistaken for the end of the workload.
              downscale_delay_s: 300

  rayClusterConfig:
    rayVersion: "2.52.0"

    # The controller's request_resources() calls land here.
    enableInTreeAutoscaling: true
    autoscalerOptions:
      upscalingMode: Default
      # Only ever reclaims pods the controller has stopped asking for: nothing
      # else in the cluster wants the triton resource, so an unwanted worker
      # goes idle immediately. The delay is the second half of downscale_delay_s.
      idleTimeoutSeconds: 60
      resources:
        limits: { cpu: 500m, memory: 512Mi }
        requests: { cpu: 500m, memory: 512Mi }

    headGroupSpec:
      # ClusterIP: the head serves the dashboard and the controller's status
      # endpoint, neither of which belongs on a load balancer. Inference has
      # its own entry point in triton-service.yaml.
      serviceType: ClusterIP
      rayStartParams:
        # No Ray work of any kind belongs on the head — except the controller,
        # which asks for the resource below instead of for CPU.
        num-cpus: "0"
        resources: '"{\"controller\": 1}"'
        dashboard-host: 0.0.0.0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ray
            app.kubernetes.io/instance: sonic-ray
            app.kubernetes.io/component: head
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.52.0
              imagePullPolicy: IfNotPresent
              env:
                # Where the controller is imported from.
                - name: PYTHONPATH
                  value: /serve_app
              ports:
                - { name: gcs-server, containerPort: 6379 }
                - { name: client, containerPort: 10001 }
                - { name: dashboard, containerPort: 8265 }
                - { name: metrics, containerPort: 8080 }
                - { name: serve, containerPort: 8000 }
              resources:
                limits: { cpu: "2", memory: 8Gi }
                requests: { cpu: "2", memory: 8Gi }
              volumeMounts:
                - { name: serve-app, mountPath: /serve_app }
                - { name: log-volume, mountPath: /tmp/ray }
          volumes:
            - name: serve-app
              configMap: { name: sonic-ray-serve-app }
            - name: log-volume
              emptyDir: {}
          # Same placement as supersonic's triton and envoy pods.
          nodeSelector: { "cms-af-prod": "true" }
          tolerations:
            - key: hub.jupyter.org/dedicated
              operator: Equal
              value: cms-af
              effect: NoSchedule

    workerGroupSpecs:
      - groupName: gpu-group
        replicas: 1
        minReplicas: 1
        maxReplicas: 10
        rayStartParams:
          # One "triton" per pod is the whole scaling vocabulary: the
          # controller asks for N of them, the autoscaler runs N pods, and each
          # pod carries one Triton on one GPU.
          resources: '"{\"triton\": 1}"'
        template:
          metadata:
            labels:
              app.kubernetes.io/name: ray
              app.kubernetes.io/instance: sonic-ray
              app.kubernetes.io/component: worker
          spec:
            # Triton drains in-flight requests on SIGTERM (--exit-timeout-secs
            # below); the kubelet must wait for it rather than killing the pod
            # out from under a client.
            terminationGracePeriodSeconds: 90
            containers:
              # The Ray side of the pod: a raylet advertising the triton
              # resource, and nothing else. It runs no actors, which is exactly
              # what lets the autoscaler reclaim this pod when the controller
              # stops asking for it.
              - name: ray-worker
                image: rayproject/ray:2.52.0
                imagePullPolicy: IfNotPresent
                resources:
                  limits: { cpu: "1", memory: 2Gi }
                  requests: { cpu: "1", memory: 2Gi }
                volumeMounts:
                  - { name: log-volume, mountPath: /tmp/ray }

              # The inference server itself — image, arguments and resources
              # copied from apps/sonic/supersonic/values.yaml, so this is the
              # production Triton, not an approximation of it.
              - name: triton
                image: nvcr.io/nvidia/tritonserver:26.04-py3
                imagePullPolicy: IfNotPresent
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    /opt/tritonserver/bin/tritonserver \
                    --model-repository=/models \
                    --model-control-mode=explicit \
                    --load-model=* \
                    --allow-gpu-metrics=true \
                    --log-verbose=0 \
                    --disable-auto-complete-config \
                    --exit-timeout-secs=60
                ports:
                  - { name: http, containerPort: 8000 }
                  - { name: grpc, containerPort: 8001 }
                  - { name: triton-metrics, containerPort: 8002 }
                resources:
                  limits:
                    nvidia.com/gpu: 1
                    cpu: 16
                    memory: 16G
                  requests:
                    nvidia.com/gpu: 1
                    cpu: 16
                    memory: 16G
                # A large repository can take minutes to load; the startup
                # probe buys that time without making readiness lax afterwards.
                startupProbe:
                  httpGet: { path: /v2/health/ready, port: http }
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 24
                readinessProbe:
                  httpGet: { path: /v2/health/ready, port: http }
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 3
                  # supersonic's triton.readinessProbe.successThreshold.
                  successThreshold: 3
                volumeMounts:
                  - {
                      name: model-repository,
                      mountPath: /models,
                      readOnly: true,
                    }
            volumes:
              - name: log-volume
                emptyDir: {}
              # The claim the SuperSONIC model manager writes
              # (apps/sonic/model-manager). Read-only here: Triton only reads
              # it, and this release does not own the repository.
              - name: model-repository
                persistentVolumeClaim:
                  claimName: supersonic-model-repository
                  readOnly: true
            nodeSelector: { "cms-af-prod": "true" }
            tolerations:
              - key: hub.jupyter.org/dedicated
                operator: Equal
                value: cms-af
                effect: NoSchedule
