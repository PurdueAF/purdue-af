# Values for the `sonic-ray` release: the supersonic release's Triton, run on
# Ray in the cms namespace on Geddes.
#
# The triton: block is apps/sonic/supersonic/values.yaml's, key for key —
# image, command, arguments, resources, readiness, model repository — so what
# this release serves is what supersonic serves. tests/manifests/test_ray.py
# keeps the two equal.
#
# Autoscaling is not copied: no KEDA, no Prometheus in the loop. See the chart.

triton:
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: "26.04-py3"
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/models \
      --model-control-mode=explicit \
      --load-model=* \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --disable-auto-complete-config \
      --exit-timeout-secs=60
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  readinessProbe:
    successThreshold: 3
  # The claim the SuperSONIC model manager creates and writes
  # (apps/sonic/model-manager) and the supersonic Triton pods mount.
  modelRepository:
    claimName: supersonic-model-repository
    mountPath: /models

# Same placement as supersonic's triton and envoy pods, for every pod here.
nodeSelector: { "cms-af-prod": "true" }
tolerations:
  - key: hub.jupyter.org/dedicated
    operator: Equal
    value: cms-af
    effect: NoSchedule

# Same private pool as supersonic's Envoy: reachable from the AF, never a
# public ingress.
service:
  annotations:
    metallb.universe.tf/address-pool: geddes-private-pool
