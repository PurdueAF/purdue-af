# Ray cluster approximating the production SuperSONIC release
# (apps/sonic/supersonic). Same nodes, same per-server GPU/CPU/memory shape,
# same replica range, same private-pool entry point, same Prometheus.
#
# What maps to what:
#
#   SuperSONIC                          | this cluster
#   ------------------------------------+--------------------------------------
#   triton (GPU inference servers)      | worker group "gpu-group"
#   envoy (gRPC entry point, LB svc)    | Ray head + head LoadBalancer service
#   keda ScaledObject, 1 -> 10 replicas | in-tree Ray autoscaler, 1 -> 10
#   model repository PVC at /models     | same PVC, mounted read-only
#   scrape_metrics: "true" on a Service | apps/ray/sonic-ray/metrics-service.yaml
#
# What does NOT map: this chart deploys a bare RayCluster, not a serving
# application. There is no Ray Serve app and therefore no Triton equivalent
# actually answering inference requests — see the README.

# RayCluster and its resources are named "sonic-ray" rather than
# "sonic-ray-kuberay" (chart default appends nameOverride).
fullnameOverride: sonic-ray

image:
  repository: rayproject/ray
  tag: 2.52.0
  pullPolicy: IfNotPresent

head:
  # Must match the image tag above; the autoscaler sidecar is pinned to it.
  rayVersion: "2.52.0"

  # Replaces SuperSONIC's KEDA ScaledObject. KEDA scales the Triton Deployment
  # on a Prometheus query; the Ray autoscaler scales the worker group on
  # pending Ray tasks/actors. Same 1 -> 10 range (see worker.min/maxReplicas).
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    # Closest analogue to keda.scaleDown.stabilizationWindowSeconds: 45.
    idleTimeoutSeconds: 45
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "500m"
        memory: "512Mi"

  rayStartParams:
    # The head is the entry point, not a server — mirrors Envoy, which holds no
    # models. num-cpus: 0 keeps every Ray task/actor off the head pod.
    num-cpus: "0"
    dashboard-host: 0.0.0.0

  # Explicit ports replace KubeRay's defaults (gcs-server/client/dashboard/
  # metrics); "serve" is added so an eventual Ray Serve app is reachable on the
  # head Service the same way Envoy exposes Triton's gRPC port.
  ports:
    - name: gcs-server
      containerPort: 6379
    - name: client
      containerPort: 10001
    - name: dashboard
      containerPort: 8265
    - name: metrics
      containerPort: 8080
    - name: serve
      containerPort: 8000

  resources:
    limits:
      cpu: "2"
      memory: "8Gi"
    requests:
      cpu: "2"
      memory: "8Gi"

  # Same placement as supersonic's triton and envoy pods.
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule

  headService:
    metadata:
      annotations:
        metallb.universe.tf/address-pool: geddes-private-pool

  volumes:
    - name: log-volume
      emptyDir: {}
  volumeMounts:
    - name: log-volume
      mountPath: /tmp/ray

worker:
  groupName: gpu-group
  replicas: 1
  # keda.minReplicaCount / keda.maxReplicaCount of the supersonic release.
  minReplicas: 1
  maxReplicas: 10

  image:
    repository: rayproject/ray
    tag: 2.52.0-gpu
    pullPolicy: IfNotPresent

  # Identical to supersonic's triton.resources — one GPU per server, requests
  # equal to limits.
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G

  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule

  volumes:
    - name: log-volume
      emptyDir: {}
    # The claim the SuperSONIC model manager writes (apps/sonic/model-manager).
    # Mounted read-only here: this cluster is a consumer of the repository, and
    # only the model manager may write to it.
    - name: model-repository
      persistentVolumeClaim:
        claimName: supersonic-model-repository
        readOnly: true
  volumeMounts:
    - name: log-volume
      mountPath: /tmp/ray
    - name: model-repository
      mountPath: /models
      readOnly: true

# Mirrors envoy.service.type in the supersonic release: clients reach the
# cluster on the geddes private pool, never through a public ingress.
service:
  type: LoadBalancer
