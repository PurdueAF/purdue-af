{{- include "sonic-ray.validate" . -}}
{{- $name := include "sonic-ray.name" . -}}
# The cluster and the Serve application on it.
#
# A RayService rather than a RayCluster because the server is a Ray Serve
# application, and RayService is what runs one declaratively — with a health
# check on the application, and with NewCluster upgrades that only cut over
# once it answers.
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonic-ray.labels" . | nindent 4 }}
spec:
  upgradeStrategy:
    type: {{ .Values.ray.upgradeStrategy }}

  serveConfigV2: |
    applications:
      - name: sonic
        import_path: sonic_ray.serve_app:sonic
        route_prefix: /
        deployments:
          - name: SonicServer
            # One GPU per replica is the unit of scaling: a replica is a
            # server with every servable model loaded, and a worker pod has
            # exactly one GPU, so a replica is a pod.
            ray_actor_options:
              num_gpus: 1
            max_ongoing_requests: {{ .Values.serve.maxOngoingRequests }}
            graceful_shutdown_timeout_s: {{ .Values.serve.gracefulShutdownTimeoutS }}
            health_check_period_s: {{ .Values.serve.healthCheckPeriodS }}
            health_check_timeout_s: {{ .Values.serve.healthCheckTimeoutS }}
            autoscaling_config:
              min_replicas: {{ .Values.serve.minReplicas }}
              max_replicas: {{ .Values.serve.maxReplicas }}
              target_ongoing_requests: {{ .Values.serve.targetOngoingRequests }}
              upscale_delay_s: {{ .Values.serve.upscaleDelayS }}
              downscale_delay_s: {{ .Values.serve.downscaleDelayS }}

  # KubeRay's Service for the Serve HTTP proxies — the inference entry point.
  # It selects pods whose proxy is healthy, so a worker still loading models
  # is not in rotation.
  serveService:
    metadata:
      name: {{ $name }}-serve
      labels:
        {{- include "sonic-ray.labels" . | nindent 8 }}
        app.kubernetes.io/component: serve
      {{- with .Values.service.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      type: {{ .Values.service.type }}
      ports:
        - name: http
          port: 8000
          targetPort: 8000
          protocol: TCP

  rayClusterConfig:
    rayVersion: {{ .Values.ray.version | quote }}
    # Serve's replica demand lands here: a replica with no GPU to run on is
    # a pending resource request, and the autoscaler adds a worker for it.
    enableInTreeAutoscaling: true
    autoscalerOptions:
      upscalingMode: Default
      idleTimeoutSeconds: {{ .Values.ray.autoscaler.idleTimeoutSeconds }}
      resources:
        {{- toYaml .Values.ray.autoscaler.resources | nindent 8 }}

    headGroupSpec:
      # Never exposed: the dashboard has no authentication. Inference has
      # its own Service above.
      serviceType: ClusterIP
      rayStartParams:
        num-cpus: "0"
        dashboard-host: 0.0.0.0
      template:
        metadata:
          labels:
            {{- include "sonic-ray.podSelector" . | nindent 12 }}
            app.kubernetes.io/component: head
        spec:
          containers:
            - name: ray-head
              image: {{ include "sonic-ray.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                {{- include "sonic-ray.env" . | nindent 16 }}
              ports:
                - { name: gcs-server, containerPort: 6379 }
                - { name: client, containerPort: 10001 }
                - { name: dashboard, containerPort: 8265 }
                - { name: metrics, containerPort: 8080 }
                - { name: serve, containerPort: 8000 }
              resources:
                {{- toYaml .Values.ray.head.resources | nindent 16 }}
              volumeMounts:
                - { name: log-volume, mountPath: /tmp/ray }
          volumes:
            - name: log-volume
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}

    workerGroupSpecs:
      - groupName: gpu-group
        replicas: {{ .Values.ray.worker.minReplicas }}
        minReplicas: {{ .Values.ray.worker.minReplicas }}
        maxReplicas: {{ .Values.ray.worker.maxReplicas }}
        # KubeRay derives num-gpus from the container's nvidia.com/gpu limit.
        rayStartParams: {}
        template:
          metadata:
            labels:
              {{- include "sonic-ray.podSelector" . | nindent 14 }}
              app.kubernetes.io/component: worker
          spec:
            terminationGracePeriodSeconds: {{ .Values.ray.worker.terminationGracePeriodSeconds }}
            containers:
              - name: ray-worker
                image: {{ include "sonic-ray.image" . }}
                imagePullPolicy: {{ .Values.image.pullPolicy }}
                env:
                  {{- include "sonic-ray.env" . | nindent 18 }}
                ports:
                  - { name: metrics, containerPort: 8080 }
                  - { name: serve, containerPort: 8000 }
                resources:
                  {{- toYaml .Values.ray.worker.resources | nindent 18 }}
                volumeMounts:
                  - { name: log-volume, mountPath: /tmp/ray }
                  - name: model-repository
                    mountPath: {{ .Values.modelRepository.mountPath }}
                    readOnly: true
            volumes:
              - name: log-volume
                emptyDir: {}
              - name: model-repository
                persistentVolumeClaim:
                  claimName: {{ .Values.modelRepository.claimName }}
                  readOnly: true
            {{- with .Values.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.tolerations }}
            tolerations:
              {{- toYaml . | nindent 14 }}
            {{- end }}
