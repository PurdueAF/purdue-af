{{- $name := include "sonic-ray.name" . -}}
# What the AF Prometheus scrapes, by the scrape_metrics label: Ray's own
# metrics — including Serve's per-deployment request counts, latencies and
# queue depths — from head and workers alike. Headless, so each pod is a
# target of its own. Not the serve Service above: a scrape job keyed on the
# label hits /metrics on every port of the Service it keeps.
#
# The app/instance labels become the Prometheus app/release labels, so the
# ray_serve_* series here carry release="{{ $name }}".
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonic-ray.labels" . | nindent 4 }}
    app.kubernetes.io/component: ray
    scrape_metrics: "true"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "sonic-ray.podSelector" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
