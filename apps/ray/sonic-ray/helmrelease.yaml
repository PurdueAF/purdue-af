apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonic-ray
spec:
  suspend: false
  interval: 1m
  # The ray.io CRDs must exist before the chart's RayService applies.
  dependsOn:
    - name: kuberay-operator
  chart:
    spec:
      chart: ./helm/sonic-ray
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: purdue-af-experimental
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: sonic-ray-config
      valuesKey: values.yaml
