apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: sonic-ray
spec:
  suspend: false
  interval: 1m
  # The chart renders a RayCluster CR, so the CRDs (and the controller that
  # reconciles them) have to exist first.
  dependsOn:
    - name: kuberay-operator
  chart:
    spec:
      chart: ray-cluster
      version: "1.7.0"
      sourceRef:
        kind: HelmRepository
        name: kuberay
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: sonic-ray-config
      valuesKey: values.yaml
