apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      chart: kuberay-operator
      version: "1.7.1"
      sourceRef:
        kind: HelmRepository
        name: kuberay
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: kuberay-operator-config
      valuesKey: values.yaml
