singleNamespaceInstall: true

# Every AF workload runs on the cms-af-prod nodes (alloy tails only those).
nodeSelector:
  cms-af-prod: "true"
tolerations:
  - key: "hub.jupyter.org/dedicated"
    operator: "Equal"
    value: "cms-af"
    effect: "NoSchedule"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Unlisted gates keep the operator's defaults; this alpha one makes KubeRay write a RayCluster's spec.networkPolicy (apps/ray-train).
featureGates:
  - name: RayClusterNetworkPolicy
    enabled: true
