# Dask Gateway (KubeBackend) with a `cluster` option:
#   - geddes (default): scheduler + workers on AF nodes (same as dask-gateway-k8s)
#   - hammer / gautschi: scheduler + workers on the interLink virtual node
#     (Slurm via VK). Purdue LDAP UID only; conda/pixi under /depot or /cvmfs.
gateway:
  replicas: 1
  prefix: /
  loglevel: WARN
  image:
    name: ghcr.io/dask/dask-gateway-server
    tag: 2024.1.0
    pullPolicy: IfNotPresent
  auth:
    type: simple
    simple:
      password: null
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi
  service:
    annotations:
      metallb.universe.tf/address-pool: geddes-public-pool
  env:
    - name: NAMESPACE
      value: ${namespace}
    - name: RELEASE_NAME
      value: dask-gateway-k8s-interlink
  backend:
    image:
      name: ghcr.io/dask/dask-gateway
      tag: 2024.1.0
      pullPolicy:
    imagePullSecrets: []
    namespace: ${namespace}
    environment: {}
    # Defaults = geddes. options_handler overrides nodeSelector / volumes /
    # annotations when cluster is hammer or gautschi.
    scheduler:
      cores:
        request: 4
        limit: 8
      memory:
        request: 16G
        limit: 32G
      extraPodConfig:
        nodeSelector:
          cms-af-prod: "true"
        tolerations:
          - key: "hub.jupyter.org/dedicated"
            operator: "Equal"
            value: "cms-af"
            effect: "NoSchedule"
        volumes:
          - name: depot
            nfs:
              server: datadepot.rcac.purdue.edu
              path: /depot/cms
          - name: work
            persistentVolumeClaim:
              claimName: af-shared-storage
          - name: cvmfs
            persistentVolumeClaim:
              claimName: cvmfs
      extraContainerConfig:
        env:
          - name: DASK_LOGGING__DISTRIBUTED
            value: warning
        volumeMounts:
          - name: depot
            mountPath: /depot/cms
            mountPropagation: HostToContainer
          - name: work
            mountPath: /work/
            mountPropagation: HostToContainer
          - name: cvmfs
            mountPath: /cvmfs
            mountPropagation: HostToContainer
    worker:
      extraPodConfig:
        nodeSelector:
          cms-af-prod: "true"
        tolerations:
          - key: "hub.jupyter.org/dedicated"
            operator: "Equal"
            value: "cms-af"
            effect: "NoSchedule"
        volumes:
          - name: cvmfs
            persistentVolumeClaim:
              claimName: cvmfs
          - name: eos
            hostPath:
              path: /eos
          - name: depot
            nfs:
              server: datadepot.rcac.purdue.edu
              path: /depot/cms
          - name: work
            persistentVolumeClaim:
              claimName: af-shared-storage
      extraContainerConfig:
        env:
          - name: DASK_LOGGING__DISTRIBUTED
            value: warning
          - name: PYTHONWARNINGS
            value: "ignore::FutureWarning:coffea"
          - name: DASK_DISTRIBUTED__WORKER__PRELOAD
            value: '["/work/projects/purdue-af/dask_pyroscope_preload.py"]'
          - name: DASK_DISTRIBUTED__WORKER__PRELOAD_ARGV
            value: "[[]]"
          - name: DASK_DISTRIBUTED__WORKER__PROFILE__INTERVAL
            value: "1000000000"
        volumeMounts:
          - name: cvmfs
            mountPath: /cvmfs
            mountPropagation: HostToContainer
          - name: eos
            mountPath: /eos
            mountPropagation: HostToContainer
          - name: depot
            mountPath: /depot/cms
            mountPropagation: HostToContainer
          - name: work
            mountPath: /work/
            mountPropagation: HostToContainer
  extraConfig:
    config: |
      c.DaskGateway.address = ':8000'
      c.KubeBackend.api_url = 'http://dask-gateway-k8s-interlink.geddes.rcac.purdue.edu:80/api'

      c.ClusterConfig.cluster_max_cores = 201
      c.ClusterConfig.cluster_max_memory = '1200 G'
      c.ClusterConfig.cluster_max_workers = 200
      c.ClusterConfig.adaptive_period = 15
      # Longer than dask-gateway-k8s: interLink → Slurm queue wait.
      c.ClusterConfig.idle_timeout = 86400
      c.Backend.cluster_start_timeout = 900
      c.Backend.worker_start_timeout = 900
      c.Backend.worker_start_failure_limit = 8

      INTERLINK_CLUSTERS = {
          "hammer": {
              "node": "interlink-hammer",
              "partition": "hammer-nodes",
              "account": "cms",
          },
          "gautschi": {
              "node": "interlink-gautschi",
              "partition": "cpu",
              "account": "cms",
          },
      }
      AF_NODE_SELECTOR = {"cms-af-prod": "true"}
      AF_TOLERATIONS = [
          {
              "key": "hub.jupyter.org/dedicated",
              "operator": "Equal",
              "value": "cms-af",
              "effect": "NoSchedule",
          },
      ]
      INTERLINK_TOLERATIONS = [
          {
              "key": "virtual-node.interlink/no-schedule",
              "operator": "Exists",
          },
      ]
      # Virtual nodes: only depot NFS is reliable; cvmfs via singularity --bind.
      INTERLINK_VOLUMES = [
          {
              "name": "depot",
              "nfs": {
                  "server": "datadepot.rcac.purdue.edu",
                  "path": "/depot/cms",
              },
          },
      ]
      INTERLINK_VOLUME_MOUNTS = [
          {
              "name": "depot",
              "mountPath": "/depot/cms",
              "mountPropagation": "HostToContainer",
          },
      ]
      GEDDES_SCHEDULER_MOUNTS = [
          {
              "name": "depot",
              "mountPath": "/depot/cms",
              "mountPropagation": "HostToContainer",
          },
          {
              "name": "work",
              "mountPath": "/work/",
              "mountPropagation": "HostToContainer",
          },
          {
              "name": "cvmfs",
              "mountPath": "/cvmfs",
              "mountPropagation": "HostToContainer",
          },
      ]
      GEDDES_WORKER_MOUNTS = [
          {
              "name": "cvmfs",
              "mountPath": "/cvmfs",
              "mountPropagation": "HostToContainer",
          },
          {
              "name": "eos",
              "mountPath": "/eos",
              "mountPropagation": "HostToContainer",
          },
          {
              "name": "depot",
              "mountPath": "/depot/cms",
              "mountPropagation": "HostToContainer",
          },
          {
              "name": "work",
              "mountPath": "/work/",
              "mountPropagation": "HostToContainer",
          },
      ]
      GEDDES_SCHEDULER_VOLUMES = [
          {
              "name": "depot",
              "nfs": {
                  "server": "datadepot.rcac.purdue.edu",
                  "path": "/depot/cms",
              },
          },
          {
              "name": "work",
              "persistentVolumeClaim": {"claimName": "af-shared-storage"},
          },
          {
              "name": "cvmfs",
              "persistentVolumeClaim": {"claimName": "cvmfs"},
          },
      ]
      GEDDES_WORKER_VOLUMES = [
          {
              "name": "cvmfs",
              "persistentVolumeClaim": {"claimName": "cvmfs"},
          },
          {"name": "eos", "hostPath": {"path": "/eos"}},
          {
              "name": "depot",
              "nfs": {
                  "server": "datadepot.rcac.purdue.edu",
                  "path": "/depot/cms",
              },
          },
          {
              "name": "work",
              "persistentVolumeClaim": {"claimName": "af-shared-storage"},
          },
      ]

      def ldap_lookup(username):
          import subprocess
          import pkg_resources
          import sys

          try:
              pkg_resources.get_distribution('ldap3')
          except pkg_resources.DistributionNotFound:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--user", "ldap3"])

          from ldap3 import Server, Connection, SUBTREE
          url = "geddes-aux.rcac.purdue.edu"
          baseDN = "ou=People,dc=rcac,dc=purdue,dc=edu"
          search_filter = "(uid={0}*)"
          attrs = ['uidNumber','gidNumber']
          s = Server(host= url ,use_ssl= True, get_info= 'ALL')
          conn = Connection(s, version = 3, authentication = "ANONYMOUS")
          conn.start_tls()
          conn.search(
              search_base = baseDN,
              search_filter = search_filter.format(username),
              search_scope = SUBTREE,
              attributes = attrs
          )
          ldap_result_id = json.loads(conn.response_to_json())
          result = ldap_result_id[u'entries'][0][u'attributes']
          uid_number = result[u'uidNumber']
          gid_number = result [u'gidNumber']
          return uid_number, gid_number


      def _require_depot_or_cvmfs(path, what):
          allowed = ("/depot/", "/cvmfs/")
          if not path.startswith(allowed):
              raise ValueError(
                  f"{what} for interLink (hammer/gautschi) must live under "
                  f"/depot/ or /cvmfs/ (got {path!r}). /work and /home are "
                  "not visible on Slurm nodes."
              )


      from dask_gateway_server.options import Options, Float, Mapping, String, Select
      import os.path

      def options_handler(options, user):
          cluster = (getattr(options, "cluster", None) or "geddes").strip().lower()
          if cluster not in ("geddes",) + tuple(INTERLINK_CLUSTERS):
              raise ValueError(
                  f"Unknown cluster {cluster!r}. Choose geddes, hammer, or gautschi."
              )
          use_interlink = cluster in INTERLINK_CLUSTERS

          if use_interlink:
              if user.name == "jovyan" or ("-cern" in user.name) or ("-fnal" in user.name):
                  raise ValueError(
                      "interLink clusters (hammer/gautschi) are available to "
                      "Purdue accounts only. Use cluster='geddes' or the "
                      "default Kubernetes Dask Gateway."
                  )
              try:
                  uid, gid = ldap_lookup(user.name)
              except Exception as exc:
                  raise ValueError(
                      f"Could not resolve Purdue LDAP UID for {user.name!r}: {exc}"
                  ) from exc
          elif user.name == "jovyan":
              uid, gid = 1000, 1000
          elif ("-cern" in user.name) or ("-fnal" in user.name):
              if not options.env:
                  raise ValueError(
                      "'env' must be specified in new_cluster(), for example env=dict(os.environ)"
                  )
              if ("NB_UID" not in options.env) or ("NB_GID" not in options.env):
                  raise ValueError("NB_UID and NB_GID variables must exist in 'env'")
              uid, gid = int(options.env["NB_UID"]), int(options.env["NB_GID"])
          else:
              uid, gid = ldap_lookup(user.name)

          if "NVIDIA_VISIBLE_DEVICES" in options.env:
              del options.env["NVIDIA_VISIBLE_DEVICES"]

          conda_env = None
          pixi_project = getattr(options, "pixi_project", None)
          if pixi_project and pixi_project.strip():
              user_conda_env = getattr(options, "conda_env", None)
              if user_conda_env and user_conda_env.strip():
                  raise ValueError(
                      "pixi-env and conda-env are mutually exclusive. Please specify only one."
                  )
              pixi_project_dir = pixi_project.strip()
              if use_interlink:
                  _require_depot_or_cvmfs(pixi_project_dir, "pixi_project")
              pixi_project_name = getattr(options, "pixi_env", "default")
              pixi_toml_path = os.path.join(pixi_project_dir, "pixi.toml")
              if not os.path.exists(pixi_toml_path):
                  raise ValueError(
                      f"pixi.toml not found in {pixi_project_dir}. "
                      "Please provide a valid pixi project directory."
                  )
              env_path = os.path.join(
                  pixi_project_dir, ".pixi", "envs", pixi_project_name
              )
              if not os.path.exists(env_path):
                  raise ValueError(
                      f"Pixi environment '{pixi_project_name}' not found at {env_path}. "
                      f"Please build it first with 'pixi install' in {pixi_project_dir}."
                  )
              bin_python = os.path.join(env_path, "bin", "python")
              bin_python3 = os.path.join(env_path, "bin", "python3")
              if not (os.path.exists(bin_python) or os.path.exists(bin_python3)):
                  raise ValueError(
                      f"Environment at {env_path} does not appear to be a valid conda environment."
                  )
              conda_env = env_path
          else:
              user_conda_env = getattr(options, "conda_env", None)
              if not user_conda_env or not user_conda_env.strip():
                  raise ValueError("Either conda_env or pixi_project must be specified")
              conda_env = user_conda_env.strip()
              if use_interlink:
                  _require_depot_or_cvmfs(conda_env, "conda_env")

          options.env["PATH"] = f"{conda_env}/bin/:" + options.env.pop("PATH", "")
          options.env["CPLUS_INCLUDE_PATH"] = (
              f"{conda_env}/x86_64-conda-linux-gnu/sysroot/usr/include"
          )
          options.env["XRD_REQUESTTIMEOUT"] = "300"
          options.env["XRD_CPCHUNKSIZE"] = "1048576"
          options.env["XRD_CONNECTIONWINDOW"] = "300"
          options.env["XRD_CONNECTIONRETRY"] = "5"
          options.env["XRD_STREAMTIMEOUT"] = "300"
          options.env["DASK_DISTRIBUTED__COMM__TIMEOUTS__CONNECT"] = (
              "300s" if use_interlink else "60s"
          )

          death_timeout = "900" if use_interlink else "180"
          worker_cmd = [
              f"{conda_env}/bin/dask",
              "worker",
              "--death-timeout",
              death_timeout,
          ]
          scheduler_cmd = [f"{conda_env}/bin/dask", "scheduler"]

          security = {"securityContext": {"runAsUser": uid, "runAsGroup": gid}}
          if use_interlink:
              meta = INTERLINK_CLUSTERS[cluster]
              node_sel = {"kubernetes.io/hostname": meta["node"]}
              tolerations = INTERLINK_TOLERATIONS
              volumes = INTERLINK_VOLUMES
              # /work preload is invisible on Slurm; prefer depot copy if present.
              options.env["DASK_DISTRIBUTED__WORKER__PRELOAD"] = (
                  '["/depot/cms/purdue-af/dask_pyroscope_preload_slurm.py"]'
              )
              annotations = {
                  "slurm-job.vk.io/singularity-options": "--unsquash --bind /cvmfs",
                  "slurm-job.vk.io/flags": (
                      f"--uid={uid} -A {meta['account']} -p {meta['partition']}"
                  ),
              }
          else:
              node_sel = AF_NODE_SELECTOR
              tolerations = AF_TOLERATIONS
              volumes = None
              annotations = {}

          # Replace sticky keys each request (shared c.KubeClusterConfig).
          for target in (
              c.KubeClusterConfig.scheduler_extra_pod_config,
              c.KubeClusterConfig.worker_extra_pod_config,
          ):
              target.update(security)
              target["nodeSelector"] = dict(node_sel)
              target["tolerations"] = list(tolerations)

          if use_interlink:
              c.KubeClusterConfig.scheduler_extra_pod_config["volumes"] = list(volumes)
              c.KubeClusterConfig.worker_extra_pod_config["volumes"] = list(volumes)
              c.KubeClusterConfig.scheduler_extra_container_config["volumeMounts"] = list(
                  INTERLINK_VOLUME_MOUNTS
              )
              c.KubeClusterConfig.worker_extra_container_config["volumeMounts"] = list(
                  INTERLINK_VOLUME_MOUNTS
              )
          else:
              c.KubeClusterConfig.scheduler_extra_pod_config["volumes"] = list(
                  GEDDES_SCHEDULER_VOLUMES
              )
              c.KubeClusterConfig.worker_extra_pod_config["volumes"] = list(
                  GEDDES_WORKER_VOLUMES
              )
              c.KubeClusterConfig.scheduler_extra_container_config["volumeMounts"] = list(
                  GEDDES_SCHEDULER_MOUNTS
              )
              c.KubeClusterConfig.worker_extra_container_config["volumeMounts"] = list(
                  GEDDES_WORKER_MOUNTS
              )

          # Assign (don't .clear()) — traitlets Dict may be a LazyConfigValue.
          c.KubeClusterConfig.scheduler_extra_pod_annotations = dict(annotations)
          c.KubeClusterConfig.worker_extra_pod_annotations = dict(annotations)

          c.KubeClusterConfig.scheduler_extra_pod_labels = {
              "user": user.name,
              "cluster": cluster,
          }
          c.KubeClusterConfig.worker_extra_pod_labels = {
              "user": user.name,
              "cluster": cluster,
          }

          setup_cmd = (
              "export DASK_TEMPORARY_DIRECTORY=/tmp/dask-$USER; "
              "export DASK_DISTRIBUTED__WORKER__PROFILE__INTERVAL=1000000000; "
              "export DASK_DISTRIBUTED__SCHEDULER__PROFILE__INTERVAL=1000000000; "
          )
          desired_cores = options.worker_cores
          desired_memory = int(options.worker_memory * 2 ** 30)
          return {
              "worker_cores": desired_cores,
              "worker_cores_limit": desired_cores,
              "worker_memory": desired_memory,
              "worker_memory_limit": desired_memory,
              "environment": options.env,
              "scheduler_cmd": scheduler_cmd,
              "worker_cmd": worker_cmd,
              "scheduler_setup": setup_cmd,
              "worker_setup": setup_cmd,
          }

      c.Backend.cluster_options = Options(
          Select(
              "cluster",
              ["geddes", "hammer", "gautschi"],
              default="geddes",
              label="Target cluster (geddes=AF k8s; hammer/gautschi=interLink/Slurm)",
          ),
          String("conda_env", default="", label="Conda environment"),
          String(
              "pixi_project",
              default="",
              label="Pixi project path (mutually exclusive with conda-env)",
          ),
          String(
              "pixi_env",
              default="default",
              label="Pixi environment within project (default: 'default')",
          ),
          Float("worker_cores", default=1, min=0.1, max=64, label="Cores per worker"),
          Float(
              "worker_memory",
              default=4,
              min=0.1,
              max=64,
              label="Memory per worker (GiB)",
          ),
          Mapping("env", {}, label="Environment variables"),
          handler=options_handler,
      )

      from dask_gateway_server.backends.kubernetes import KubeBackend
      from dask_gateway_server.backends.base import PublicException
      from dask_gateway_server import models

      _max_active_clusters_per_user = 1
      _orig_kube_start_cluster = KubeBackend.start_cluster

      async def _kube_start_cluster_limited(self, user, cluster_options):
          if _max_active_clusters_per_user:
              busy = await self.list_clusters(
                  username=user.name,
                  statuses=[
                      models.ClusterStatus.PENDING,
                      models.ClusterStatus.RUNNING,
                      models.ClusterStatus.STOPPING,
                  ],
              )
              if len(busy) >= _max_active_clusters_per_user:
                  raise PublicException(
                      f"You may only have {_max_active_clusters_per_user} active Dask Gateway cluster(s) at a time. "
                      "Stop your existing cluster or wait for it to finish shutting down before creating another."
                  )
          return await _orig_kube_start_cluster(self, user, cluster_options)

      KubeBackend.start_cluster = _kube_start_cluster_limited
traefik:
  replicas: 2
  image:
    name: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/traefik
    tag: 2.10.4
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi
  loglevel: ERROR
  dashboard: false
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
    ports:
      web:
        port: 80
        nodePort: null
      tcp:
        port: 8786
        nodePort: null
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

controller:
  enabled: true
  annotations: {}
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2
      memory: 4Gi
  imagePullSecrets: []
  loglevel: ERROR
  completedClusterMaxAge: 86400
  completedClusterCleanupPeriod: 600
  backoffBaseDelay: 0.1
  backoffMaxDelay: 300
  k8sApiRateLimit: 50
  k8sApiRateLimitBurst: 100
  image:
    name: ghcr.io/dask/dask-gateway-server
    tag: 2024.1.0
    pullPolicy: IfNotPresent
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  affinity: {}
