apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dask-gateway
spec:
  interval: 1m
  chart:
    spec:
      chart: dask-gateway
      version: "2024.1.0"
      sourceRef:
        kind: HelmRepository
        name: dask
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: dask-gateway-config
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: "api-.*"
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: depot
                  nfs:
                    server: datadepot.rcac.purdue.edu
                    path: /depot/cms
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: work
                  persistentVolumeClaim:
                    claimName: af-shared-storage
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: cvmfs
                  persistentVolumeClaim:
                    claimName: cvmfs
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: depot
                  mountPath: /depot/cms
                  mountPropagation: HostToContainer
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: work
                  mountPath: /work/
                  mountPropagation: HostToContainer
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: cvmfs
                  mountPath: /cvmfs
                  mountPropagation: HostToContainer
          - target:
              kind: Service
              name: "api-.*"
            patch: |
              - op: add
                path: /spec/type
                value: LoadBalancer
          # The chart has no controller extraConfig: the launch command makes workers past a cluster's floor preemptible.
          - target:
              kind: Deployment
              name: "controller-.*"
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/args
                value:
                  - python
                  - -c
                  - |
                    from dask_gateway_server.app import main
                    from dask_gateway_server.backends.kubernetes import controller

                    FLOOR_CORES = 100
                    PREEMPTIBLE = "low-priority-preemptible"
                    create_pods = controller.KubeController.batch_create_pods
                    container_status = controller.get_container_status

                    async def create_tiered_pods(self, info, namespace, pod, count):
                        cores = float(pod["spec"]["containers"][0]["resources"]["requests"]["cpu"])
                        live = (self.informers["pod"].get(f"{namespace}.{name}") for name in info.running | info.pending)
                        kept = sum(1 for p in live if p and p["spec"].get("priorityClassName") != PREEMPTIBLE)
                        floor = min(count, max(0, int(FLOOR_CORES // cores) - kept))
                        burst = {**pod, "spec": {**pod["spec"], "priorityClassName": PREEMPTIBLE}}
                        failed = await create_pods(self, info, namespace, pod, floor)
                        return await create_pods(self, info, namespace, burst, count - floor) or failed

                    # Upstream tracks a worker pod only once it is scheduled, and creates the ones still waiting again.
                    def worker_status(pod, name):
                        by_phase = name == "dask-worker" and pod["status"].get("phase") != "Running"
                        return container_status(pod, name) or ({} if by_phase else None)

                    controller.KubeController.batch_create_pods = create_tiered_pods
                    controller.get_container_status = worker_status
                    main(["kube-controller", "--config", "/etc/dask-gateway/dask_gateway_config.py"])
