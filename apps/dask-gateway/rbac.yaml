apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dask-gateway-controller-quotas
rules:
  # Read by the controller's launch command before it starts a preemptible worker.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dask-gateway-controller-quotas
subjects:
  - kind: ServiceAccount
    name: controller-dask-gateway
    namespace: cms
roleRef:
  kind: Role
  name: dask-gateway-controller-quotas
  apiGroup: rbac.authorization.k8s.io
