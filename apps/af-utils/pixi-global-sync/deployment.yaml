# Reconciler for /work/pixi/global; see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixi-global-sync
  labels:
    app: pixi-global-sync
spec:
  replicas: 1
  strategy:
    type: Recreate # never two builders against the same NFS dir
  selector:
    matchLabels:
      app: pixi-global-sync
  template:
    metadata:
      labels:
        app: pixi-global-sync
    spec:
      containers:
        - name: sync
          # Rewritten with each AF image release by bump-af-version.py.
          image: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/purdue-af:0.13.8
          command: ["python3", "/config/sync-global-env.py"]
          env:
            # pixi/global requires __cuda and this pod has no GPU; match pixi/global/pixi.toml.
            - name: CONDA_OVERRIDE_CUDA
              value: "12.4"
            # Same filesystem as the env, so installs are mostly hardlink swaps.
            - name: PIXI_CACHE_DIR
              value: /work/pixi/.cache/pixi
            # Starts empty; sync-global-env.py creates it (pixi needs it for PyPI locks).
            - name: TMPDIR
              value: /cache/tmp
          ports:
            - name: metrics
              containerPort: 9099
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 60
            periodSeconds: 60
            # /healthz fails only after the loop is silent for >5 poll intervals.
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 24Gi
          securityContext:
            # Writes /work/pixi: the share does not squash root.
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /work
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: af-shared-storage
        - name: config
          configMap:
            name: pixi-global-sync
        - name: cache
          emptyDir:
            sizeLimit: 10Gi # tmp scratch only (pixi cache is on /work)
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: "hub.jupyter.org/dedicated"
          operator: "Equal"
          value: "cms-af"
          effect: "NoSchedule"
---
# af-pod-monitor drops this Service; the pixi-global-sync static job scrapes it.
apiVersion: v1
kind: Service
metadata:
  name: pixi-global-sync
  labels:
    scrape-metrics: "true"
spec:
  selector:
    app: pixi-global-sync
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
