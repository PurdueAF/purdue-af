apiVersion: batch/v1
kind: CronJob
metadata:
  name: af-users-graph-updater
spec:
  schedule: "30 0,12 * * *" # after each hub database backup
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          nodeSelector: { "cms-af-prod": "true" }
          tolerations:
            - key: "hub.jupyter.org/dedicated"
              operator: "Equal"
              value: "cms-af"
              effect: "NoSchedule"
          initContainers:
            # The backups are readable by their owner alone.
            - name: copy-latest-backup
              image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/alpine:3.24
              securityContext:
                runAsUser: 616617
              command: ["/bin/sh", "-ec"]
              args:
                - cp "$(ls -t /depot/cms/purdue-af/backups/jupyterhub-*.sqlite | head -n 1)" /backups/
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: backup
                  mountPath: /backups
                - name: depot
                  mountPath: /depot/cms
                  mountPropagation: HostToContainer
          containers:
            - name: updater
              image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/python:3.12.16-slim
              command: ["/bin/bash", "-c"]
              args:
                - |
                  pip install --no-cache-dir matplotlib==3.11.2
                  python /scripts/plot-af-users.py
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1
                  memory: 2Gi
              volumeMounts:
                - name: img-vol
                  mountPath: /data
                - name: script
                  mountPath: /scripts
                - name: backup
                  mountPath: /backups
          volumes:
            - name: img-vol
              persistentVolumeClaim:
                claimName: af-users-graph-pvc
            - name: script
              configMap:
                name: af-users-graph-script
            - name: backup
              emptyDir: {}
            - name: depot
              nfs:
                server: datadepot.rcac.purdue.edu
                path: /depot/cms
