apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: supersonic
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      # chart: helm/supersonic
      # sourceRef:
      #   kind: GitRepository
      #   name: supersonic
      chart: supersonic
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: fastml
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: supersonic-config
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ScaledObject
              name: "supersonic-keda-so"
            patch: |
              - op: add
                path: /spec/triggers/0/metadata/timeout
                value: "60000"
          # SuperSONIC chart validation forbids :9090 on the Grafana datasource
          # URL when using prometheus.external, but the Service only listens on
          # 9090. Rewrite the provisioned ConfigMap after render.
          - target:
              kind: ConfigMap
              name: "supersonic-grafana"
            patch: |
              - op: replace
                path: /data/datasources.yaml
                value: |
                  apiVersion: 1
                  datasources:
                  - access: proxy
                    isDefault: true
                    jsonData:
                      timeInterval: 5s
                      tlsSkipVerify: true
                    name: prometheus
                    uid: prometheus
                    type: prometheus
                    url: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
