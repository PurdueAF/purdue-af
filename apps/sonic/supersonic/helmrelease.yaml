apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supersonic
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      chart: helm/supersonic
      sourceRef:
        kind: GitRepository
        # Shared with supersonic-pr for the scaling-metric A/B.
        name: supersonic-pr
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: supersonic-config
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ScaledObject
              name: "supersonic-keda-so"
            patch: |
              - op: add
                path: /spec/triggers/0/metadata/timeout
                value: "60000"
          # Chart validation forbids a port on the datasource URL; prometheus-server listens on 9090.
          - target:
              kind: ConfigMap
              name: "supersonic-grafana"
            patch: |
              - op: replace
                path: /data/datasources.yaml
                value: |
                  apiVersion: 1
                  datasources:
                  - access: proxy
                    isDefault: true
                    jsonData:
                      timeInterval: 5s
                      tlsSkipVerify: true
                    name: prometheus
                    uid: prometheus
                    type: prometheus
                    url: http://prometheus-server.cms.svc.cluster.local:9090
          # Surge first and cut over on Envoy /ready: the entrypoint runs apt-get before envoy starts.
          - target:
              kind: Deployment
              name: "supersonic-envoy"
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxUnavailable: 0
                    maxSurge: 1
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  httpGet:
                    path: /ready
                    port: 9901
                  initialDelaySeconds: 3
                  periodSeconds: 2
                  timeoutSeconds: 1
                  failureThreshold: 60
