# Default SuperSONIC: the CMS Run 3 MiniAOD model set, served straight off
# CVMFS. Moved here from PurdueAF/sonic, where it ran in the `sonic`
# namespace as release `cms-run3-miniaod`. Three things changed in the move:
# it uses the cms Prometheus instead of bundling its own, its Grafana host
# follows the release name, and it scales from zero.

serverLoadThreshold: 100

scaleFromZero:
  enabled: true
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

triton:
  # Geometric build: ParticleNet and the unified particle transformer need the
  # torch-geometric ops, which the stock tritonserver image does not carry.
  image: fastml/triton-torchgeo:26.04-py3-geometric
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoBTag/Combined/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoEgamma/EgammaPhotonProducers/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoTauTag/TrainingFiles/data/DeepTauIdSONIC/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoMET/METPUSubtraction/data/models/ \
      --model-control-mode=explicit \
      --load-model=deepmet \
      --load-model=deeptau_2018v2p5 \
      --load-model=particleNetFromMiniAODAK4CHSCentral \
      --load-model=particleNetFromMiniAODAK4PuppiCentral \
      --load-model=particleNetFromMiniAODAK4PuppiForward \
      --load-model=particleNetFromMiniAODAK8 \
      --load-model=particlenet_AK8_MD-2prong_PT \
      --load-model=particlenet_AK8_MassRegression_PT \
      --load-model=particlenet_PT \
      --load-model=unifiedparticletransformer_AK4_V01 \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --strict-model-config=false \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      # nvidia.com/mig-1g.5gb: 1
      cpu: 4
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      # nvidia.com/mig-1g.5gb: 1
      cpu: 4
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  modelRepository:
    enabled: true
    storageType: cvmfs-pvc
    mountPath: /cvmfs
  readinessProbe:
    timeoutSeconds: 15
    periodSeconds: 10
    failureThreshold: 10
    successThreshold: 1
  startupProbe:
    periodSeconds: 10
    failureThreshold: 24
    timeoutSeconds: 15
    httpGet:
      path: /v2/health/ready
      port: http

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # Clients reach Envoy through the LoadBalancer service on the private pool,
  # or in-cluster at supersonic.cms.svc.cluster.local:8001. No public
  # inference ingress on any SuperSONIC release here.
  ingress:
    enabled: false
  rate_limiter:
    prometheus_based:
      enabled: false
    listener_level:
      enabled: false

keda:
  enabled: true
  # No GPU held while idle: RepositoryIndex raises this to 1 through the
  # Envoy admission sidecar, which holds it there for holdMinReplicasSeconds.
  minReplicaCount: 0
  maxReplicaCount: 10
  # Poll often enough that the wake is not sitting behind a 30s KEDA tick.
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # In PurdueAF/sonic this release bundled its own Prometheus (LoadBalancer
  # service, hand-made SA and ConfigMap override in the `sonic` namespace).
  # In cms the shared AF Prometheus already scrapes Triton via af-pod-monitor
  # with the app/release labels the dashboard expects, so use it.
  # FQDN required: KEDA operator runs in the keda namespace and cannot
  # resolve the short name prometheus-server.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

# Nothing to disable for tracing: the Tempo and OpenTelemetry Collector
# dependencies were removed from the chart after 0.3.1, so this branch has no
# way to reach either.

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # Chart validation requires scheme://host with no port (must match
          # prometheus.external.scheme + .url). Port 9090 is injected by the
          # HelmRelease postRenderer in helmrelease.yaml.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-grafana.geddes.rcac.purdue.edu
