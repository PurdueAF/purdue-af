# Default SuperSONIC: the MiniAOD model set (miniaod/values.yaml) on the AF GPUs.

# Queue time per execution is intensive, so metricType Value.
serverLoadMetric: |-
  sum by (release) (
      rate(nv_inference_queue_duration_us{release=~"supersonic"}[30s])
  )
    /
  sum by (release) (
      (rate(nv_inference_exec_count{release=~"supersonic"}[30s]) * 1000) + 0.001
  )

serverLoadThreshold: 100

scaleFromZero:
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

inferenceServer:
  nodeSelector: &placement { "cms-af-prod": "true" }
  tolerations: &tolerations
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule

envoy:
  rate_limiter:
    prometheus_based:
      enabled: false
    listener_level:
      enabled: false

keda:
  maxReplicaCount: 5
  # Poll often enough that the wake is not sitting behind a KEDA tick.
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45

grafana:
  enabled: true
  nodeSelector: *placement
  tolerations: *tolerations
  dashboardsConfigMaps:
    default: supersonic-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # No port, per chart validation; the HelmRelease postRenderer adds :9090.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    # The chart default is Admin, and the ingress is public.
    auth.anonymous:
      enabled: true
      org_role: Viewer
    server:
      root_url: https://supersonic-grafana.geddes.rcac.purdue.edu
