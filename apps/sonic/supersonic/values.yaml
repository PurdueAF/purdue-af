serverLoadThreshold: 100

triton:
  image: nvcr.io/nvidia/tritonserver:26.04-py3
  # image: nvcr.io/nvidia/tritonserver:24.11-py3
  # image: fastml/triton-torchgeo:22.07-py3-geometric
  # image: fastml/triton-torchgeo:25.08-py3-geometric
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/models \
      --model-control-mode=explicit \
      --load-model=* \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --disable-auto-complete-config \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  # Dedicated model repository claim, created and written by the model manager
  # (apps/sonic/model-manager). Models previously served from
  # /work/triton_models on af-shared-storage need copying across.
  modelRepository:
    enabled: true
    storageType: pvc
    pvc:
      claimName: supersonic-model-repository
    mountPath: /models
  readinessProbe:
    successThreshold: 3
  #   reset: true

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # Not exposed publicly; clients reach Envoy through the LoadBalancer service
  # on the private pool, or in-cluster at supersonic.cms.svc.cluster.local:8001.
  ingress:
    enabled: false
    hostName: supersonic.geddes.rcac.purdue.edu
    ingressClassName: public
  rate_limiter:
    prometheus_based:
      enabled: false
    listener_level:
      enabled: false
  dynamic_routing:
    enabled: true
  lua_filter:
    enabled: true
    lua_config: "cfg/envoy-filter-dynamic.lua"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  scaleUp:
    stabilizationWindowSeconds: 30
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 45
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # Use the AF Prometheus already running in cms (HelmRelease `prometheus`).
  # It scrapes Triton via af-pod-monitor and attaches app/release labels the
  # SuperSONIC dashboard expects — rancher-monitoring does not.
  external:
    enabled: true
    url: prometheus-server
    port: 9090
    scheme: http

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # Chart validation requires scheme://host with no port (must match
          # prometheus.external.scheme + .url). Port 9090 is injected by the
          # HelmRelease postRenderer in helmrelease.yaml.
          url: http://prometheus-server
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-grafana.geddes.rcac.purdue.edu
