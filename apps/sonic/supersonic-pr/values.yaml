# Same MiniAOD model set and Triton image as the default `supersonic`, and
# scale-from-zero like it, so the two can be compared side by side. The
# difference is the chart branch: `occupancy-ratio-metric` sits five commits
# ahead of main and replaces the scaling metric with a release-scoped
# "occupancy ratio", so serverLoadMetric stays unset here rather than being
# hand-written per release, and serverLoadThreshold is the chart default (2)
# — on that metric, "requests wait about as long as they are served".

scaleFromZero:
  enabled: true
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

triton:
  image: docker.io/docexoty/tritonserver:light
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoBTag/Combined/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoEgamma/EgammaPhotonProducers/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoTauTag/TrainingFiles/data/DeepTauIdSONIC/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoMET/METPUSubtraction/data/models/ \
      --model-control-mode=explicit \
      --load-model=deepmet \
      --load-model=deeptau_2018v2p5 \
      --load-model=particleNetFromMiniAODAK4CHSCentral \
      --load-model=particleNetFromMiniAODAK4PuppiCentral \
      --load-model=particleNetFromMiniAODAK4PuppiForward \
      --load-model=particleNetFromMiniAODAK8 \
      --load-model=particlenet_AK8_MD-2prong_PT \
      --load-model=particlenet_AK8_MassRegression_PT \
      --load-model=particlenet_PT \
      --load-model=unifiedparticletransformer_AK4_V01 \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --strict-model-config=false \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 4
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 4
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  modelRepository:
    enabled: true
    storageType: cvmfs-pvc
    mountPath: /cvmfs
  readinessProbe:
    timeoutSeconds: 15
    periodSeconds: 10
    failureThreshold: 10
    successThreshold: 1
  startupProbe:
    periodSeconds: 10
    failureThreshold: 24
    timeoutSeconds: 15
    httpGet:
      path: /v2/health/ready
      port: http

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # Clients reach Envoy through the LoadBalancer service on the private pool,
  # or in-cluster at supersonic-pr.cms.svc.cluster.local:8001. No public
  # inference ingress on any SuperSONIC release here.
  ingress:
    enabled: false
  rate_limiter:
    # Off, as on `supersonic`. The Lua filter is still mounted — scaleFromZero
    # needs it to wake Triton on RepositoryIndex.
    prometheus_based:
      enabled: false
    listener_level:
      enabled: false

keda:
  enabled: true
  # 0 is the point of this release: no GPU held while idle. RepositoryIndex
  # raises it to 1 through the Envoy admission sidecar.
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # Shared AF Prometheus in cms, as for every SuperSONIC release here.
  # FQDN required: KEDA operator runs in the keda namespace and cannot
  # resolve the short name prometheus-server.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

# This branch's chart has no tempo or opentelemetry-collector dependency at
# all, so there is nothing to disable — no tracing is reachable from here.

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-pr-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # Chart validation requires scheme://host with no port (must match
          # prometheus.external.scheme + .url). Port 9090 is injected by the
          # HelmRelease postRenderer in helmrelease.yaml.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-pr-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-pr-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-pr-grafana.geddes.rcac.purdue.edu
