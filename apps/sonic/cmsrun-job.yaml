# Not Flux-managed; apply by hand with kubectl -n cms apply -f.
apiVersion: batch/v1
kind: Job
metadata:
  name: cmsrun-job
  namespace: cms
spec:
  parallelism: 15
  completions: 15
  template:
    spec:
      containers:
        - name: cmsrun-job
          image: geddes-registry.rcac.purdue.edu/docker-hub-cache/kondratyevd/sonic-client-cms-miniaod:cmssw_17
          args:
            # Any SuperSONIC release in cms serves gRPC on 8001.
            - "--address=supersonic.cms.svc.cluster.local"
            - "--port=8001"
            - "--redir=root://eos.cms.rcac.purdue.edu/"
            - "--verboseDiscovery"
            - "--maxEvents=1000"
          env:
            - name: X509_USER_PROXY
              value: /etc/grid-security-ro/x509up
          volumeMounts:
            - name: cvmfs
              mountPath: /cvmfs
              mountPropagation: HostToContainer
            - name: x509-proxy
              mountPath: /etc/grid-security-ro
              readOnly: true
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
            limits:
              memory: "16Gi"
              cpu: "4"
      restartPolicy: Never
      volumes:
        - name: cvmfs
          persistentVolumeClaim:
            claimName: cvmfs
        - name: x509-proxy
          secret:
            secretName: x509-proxy
            defaultMode: 384
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
  backoffLimit: 0
