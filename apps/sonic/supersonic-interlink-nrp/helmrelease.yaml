apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supersonic-interlink-nrp
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      chart: supersonic
      version: "0.4.0"
      sourceRef:
        kind: HelmRepository
        name: supersonic
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: supersonic-interlink-nrp-config
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ScaledObject
              name: "supersonic-interlink-nrp-keda-so"
            patch: |
              - op: add
                path: /spec/triggers/0/metadata/timeout
                value: "60000"
