# The virtual kubelet marks exited Slurm-backed pods Failed and nothing else sweeps them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: supersonic-interlink-pod-pruner
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          enableServiceLinks: false
          serviceAccountName: supersonic-interlink-pod-pruner
          restartPolicy: Never
          nodeSelector: { "cms-af-prod": "true" }
          tolerations:
            - key: "hub.jupyter.org/dedicated"
              operator: "Equal"
              value: "cms-af"
              effect: "NoSchedule"
          containers:
            - name: pruner
              image: alpine/kubectl:1.34.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  kubectl get pods \
                    -l app.kubernetes.io/instance=supersonic-interlink,app.kubernetes.io/component=triton \
                    --field-selector status.phase=Failed \
                    -o name \
                  | xargs -r kubectl delete --wait=false
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "10m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
