apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: supersonic-interlink
spec:
  suspend: false
  interval: 1m
  # Helm waits for Triton to become Ready and gives up after 5m by default.
  # A cold pull of the Triton image alone has taken ~10m on these nodes, so the
  # upgrade timed out mid-pull, rolled back, timed out again, and churned —
  # deleting the Envoy ServiceAccount out from under the running pod.
  timeout: 20m
  chart:
    spec:
      chart: helm/supersonic
      sourceRef:
        kind: GitRepository
        name: supersonic
      # Track git commits on main, not Chart.yaml version (still 0.3.1).
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: supersonic-interlink-config
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ScaledObject
              name: "supersonic-interlink-keda-so"
            patch: |
              - op: add
                path: /spec/triggers/0/metadata/timeout
                value: "60000"
