# Triton offloaded to Slurm on Hammer through interLink; Envoy stays on AF nodes.

serverLoadThreshold: 20

# Waking queues a Slurm job; raise this together with idle_timeout in envoy-config.yaml.
scaleFromZero:
  enabled: true
  readyTimeoutSeconds: 900
  holdMinReplicasSeconds: 900

serverLoadMetric: 'sum (rate(nv_inference_queue_duration_us{app=~"supersonic", release=~"supersonic-interlink", namespace=~"cms"}[30s])) / sum ((rate(nv_inference_exec_count{app=~"supersonic", release=~"supersonic-interlink", namespace=~"cms"}[30s]) * 1000))'

triton:
  # The tag must exist under /cvmfs/unpacked.cern.ch/nvcr.io/nvidia/, or the job fails at startup.
  image: /cvmfs/unpacked.cern.ch/nvcr.io/nvidia/tritonserver:24.11-py3
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_16_0_0_pre4/external/el9_amd64_gcc13/data/RecoBTag/Combined/data/models/ \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --strict-model-config=false \
      --exit-timeout-secs=60

  resources:
    limits: { cpu: 2, memory: 8G }
    requests: { cpu: 2, memory: 8G }
  nodeSelector:
    kubernetes.io/hostname: interlink-hammer
  tolerations:
    - key: virtual-node.interlink/no-schedule
      operator: Exists
  annotations:
    slurm-job.vk.io/singularity-options: "--unsquash --bind /cvmfs --no-home --compat"
    slurm-job.vk.io/flags: "--uid=616617 -A cms --gres=gpu:1 --time=0-04:00:00"
    interlink.virtual-kubelet.io/wstunnel-timeout: "5m"
    interlink.eu/wstunnel-extra-ports: "8000:http:TCP,8001:grpc:TCP,8002:metrics:TCP"
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  modelRepository:
    enabled: true
    storageType: cvmfs-pvc
    mountPath: /cvmfs
  readinessProbe:
    exec: null
    grpc:
      port: 8001
    successThreshold: 3
  startupProbe:
    periodSeconds: 5
    failureThreshold: 60
    httpGet:
      path: /v2/health/ready
      port: http

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # No public inference ingress; clients use the private-pool LoadBalancer or the in-cluster Service.
  ingress:
    enabled: false
  # Hand-written Envoy config: retries, outlier ejection and a 32 MB buffer the chart cannot express.
  external_config:
    load_from_configmap: true
    configmap_name: "supersonic-interlink-envoy-config-custom"
    configmap_key: "envoy.yaml"

keda:
  enabled: true
  # RepositoryIndex raises this to 1; the wake path lives in envoy-config.yaml.
  minReplicaCount: 0
  maxReplicaCount: 10
  scaleUp:
    stabilizationWindowSeconds: 120
    periodSeconds: 120
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 120
    periodSeconds: 30
    stepsize: 1

prometheus:
  # The AF Prometheus scrapes this Triton via the scrape_metrics service label.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

# Read through the shared SuperSONIC dashboard in the AF Grafana.
grafana:
  enabled: false
