# SuperSONIC triton-cpu values for HelmRelease `supersonic-dev`.
# Based on values/values-geddes-cms-cpu.yaml from
# https://github.com/fastmachinelearning/SuperSONIC/blob/triton-cpu/values/values-geddes-cms-cpu.yaml
# Hostnames and dashboardsConfigMaps are rewritten so this release does not
# collide with production `supersonic`. GPU Triton loads CMSSW 17 models from CVMFS.

serverLoadThreshold: 100

triton:
  replicas: 0
  image: fastml/triton-torchgeo:26.04-py3-geometric
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoBTag/Combined/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoEgamma/EgammaPhotonProducers/data/models/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoTauTag/TrainingFiles/data/DeepTauIdSONIC/ \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoMET/METPUSubtraction/data/models/ \
      --model-control-mode=explicit \
      --load-model=deepmet \
      --load-model=deeptau_2018v2p5 \
      --load-model=particleNetFromMiniAODAK4CHSCentral \
      --load-model=particleNetFromMiniAODAK4PuppiCentral \
      --load-model=particleNetFromMiniAODAK4PuppiForward \
      --load-model=particleNetFromMiniAODAK8 \
      --load-model=particlenet_AK8_MD-2prong_PT \
      --load-model=particlenet_AK8_MassRegression_PT \
      --load-model=particlenet_PT \
      --load-model=unifiedparticletransformer_AK4_V01 \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --strict-model-config=false \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  modelRepository:
    enabled: true
    storageType: cvmfs-pvc
    mountPath: /cvmfs
  readinessProbe:
    successThreshold: 3

  cpuServer:
    enabled: true
    replicas: 1
    # Same CVMFS repositories, explicit mode, no model load (index/metadata only).
    args:
      - |
        /opt/tritonserver/bin/tritonserver \
        --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoBTag/Combined/data/models/ \
        --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoEgamma/EgammaPhotonProducers/data/models/ \
        --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoTauTag/TrainingFiles/data/DeepTauIdSONIC/ \
        --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc13/cms/cmssw/CMSSW_17_0_0_pre2/external/el9_amd64_gcc13/data/RecoMET/METPUSubtraction/data/models/ \
        --model-control-mode=explicit \
        --allow-gpu-metrics=false \
        --log-verbose=0 \
        --strict-model-config=false \
        --exit-timeout-secs=60
    resources:
      requests:
        cpu: 2
        memory: 4G
      limits:
        cpu: 4
        memory: 8G
    scheduleTimeoutSeconds: 30
    demandTTLSeconds: 180
    indexTimeout: 45s
    modelConfigTimeout: 180s

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  ingress:
    enabled: false
    hostName: supersonic-dev.geddes.rcac.purdue.edu
    ingressClassName: public
  rate_limiter:
    prometheus_based:
      enabled: true
    listener_level:
      enabled: false

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 1
  cooldownPeriod: 180
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    # Cover GPU warmup + first infers so KEDA does not scale back to 0
    # before Prometheus has a load metric.
    stabilizationWindowSeconds: 180
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # Use the AF Prometheus already running in cms (HelmRelease `prometheus`).
  # FQDN required: KEDA operator runs in the keda namespace and cannot
  # resolve the short name prometheus-server.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-dev-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-dev-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-dev-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-dev-grafana.geddes.rcac.purdue.edu
