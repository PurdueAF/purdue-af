# PVC model repository curated by the model manager; waking reloads every model within readyTimeoutSeconds.

serverLoadThreshold: 100

scaleFromZero:
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

inferenceServer:
  image: nvcr.io/nvidia/tritonserver:26.04-py3
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/models \
      --model-control-mode=explicit \
      --load-model=* \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --disable-auto-complete-config \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  nodeSelector: &placement { "cms-af-prod": "true" }
  tolerations: &tolerations
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  # Created and written by the model manager (apps/sonic/model-manager).
  modelRepository:
    storageType: pvc
    pvc:
      claimName: supersonic-model-repository
    mountPath: /models
  readinessProbe:
    successThreshold: 3

envoy:
  rate_limiter:
    # Rejects RepositoryIndex while the scaling metric per healthy replica exceeds serverAdmissionThreshold.
    prometheus_based:
      enabled: true
    listener_level:
      enabled: false

keda:
  maxReplicaCount: 10
  # Poll often enough that the wake is not sitting behind a KEDA tick.
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45

grafana:
  enabled: true
  nodeSelector: *placement
  tolerations: *tolerations
  dashboardsConfigMaps:
    default: supersonic-af-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # No port, per chart validation; the HelmRelease postRenderer adds :9090.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-af-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-af-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    # The chart default is Admin, and the ingress is public.
    auth.anonymous:
      enabled: true
      org_role: Viewer
    server:
      root_url: https://supersonic-af-grafana.geddes.rcac.purdue.edu
