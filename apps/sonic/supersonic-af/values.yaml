# PVC model repository curated by the model manager; waking reloads every model within readyTimeoutSeconds.

serverLoadThreshold: 100

scaleFromZero:
  enabled: true
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

triton:
  image: nvcr.io/nvidia/tritonserver:26.04-py3
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/models \
      --model-control-mode=explicit \
      --load-model=* \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --disable-auto-complete-config \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  # Created and written by the model manager (apps/sonic/model-manager).
  modelRepository:
    enabled: true
    storageType: pvc
    pvc:
      claimName: supersonic-model-repository
    mountPath: /models
  readinessProbe:
    successThreshold: 3

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # No public inference ingress; clients use the private-pool LoadBalancer or the in-cluster Service.
  ingress:
    enabled: false
  rate_limiter:
    # Rejects RepositoryIndex while serverLoadMetric exceeds serverLoadThreshold.
    prometheus_based:
      enabled: true
    listener_level:
      enabled: false

keda:
  enabled: true
  # RepositoryIndex raises this to 1 through the Envoy admission sidecar.
  minReplicaCount: 0
  maxReplicaCount: 10
  # Poll often enough that the wake is not sitting behind a 30s KEDA tick.
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # The AF Prometheus attaches the app/release labels the dashboard expects; FQDN for KEDA.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

grafana:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  dashboardsConfigMaps:
    default: supersonic-af-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # No port, per chart validation; the HelmRelease postRenderer adds :9090.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-af-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-af-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-af-grafana.geddes.rcac.purdue.edu
