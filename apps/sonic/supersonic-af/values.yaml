# AF-facing SuperSONIC: PVC model repository curated through the model
# manager (apps/sonic/model-manager). The `supersonic` release next to it
# serves the CMS Run 3 MiniAOD models straight off CVMFS.
#
# Scales from zero, so an idle model repository costs no GPU. Waking reloads
# every model in the claim (--load-model=*), which has to finish inside
# scaleFromZero.readyTimeoutSeconds.

serverLoadThreshold: 100

scaleFromZero:
  enabled: true
  readyTimeoutSeconds: 300
  holdMinReplicasSeconds: 300

triton:
  image: nvcr.io/nvidia/tritonserver:26.04-py3
  # image: nvcr.io/nvidia/tritonserver:24.11-py3
  # image: fastml/triton-torchgeo:22.07-py3-geometric
  # image: fastml/triton-torchgeo:25.08-py3-geometric
  command: ["/bin/sh", "-c"]
  args:
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/models \
      --model-control-mode=explicit \
      --load-model=* \
      --allow-gpu-metrics=true \
      --log-verbose=0 \
      --disable-auto-complete-config \
      --exit-timeout-secs=60

  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
    requests:
      nvidia.com/gpu: 1
      cpu: 16
      memory: 16G
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  service:
    labels:
      scrape_metrics: "true"
    annotations:
      metallb.universe.tf/address-pool: geddes-private-pool
  # Dedicated model repository claim, created and written by the model manager
  # (apps/sonic/model-manager). Models previously served from
  # /work/triton_models on af-shared-storage need copying across.
  modelRepository:
    enabled: true
    storageType: pvc
    pvc:
      claimName: supersonic-model-repository
    mountPath: /models
  readinessProbe:
    successThreshold: 3
  #   reset: true

envoy:
  enabled: true
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  loadBalancerPolicy: "ROUND_ROBIN"
  service:
    type: LoadBalancer
  # Clients reach Envoy through the LoadBalancer service on the private pool,
  # or in-cluster at supersonic-af.cms.svc.cluster.local:8001. No public
  # inference ingress on any SuperSONIC release here.
  ingress:
    enabled: false
  rate_limiter:
    # Rejects RepositoryIndex (and thus new client sessions) when
    # serverLoadMetric exceeds serverLoadThreshold, via Lua → Prometheus.
    prometheus_based:
      enabled: true
    listener_level:
      enabled: false

keda:
  enabled: true
  # No GPU held while idle: RepositoryIndex raises this to 1 through the
  # Envoy admission sidecar, which holds it there for holdMinReplicasSeconds.
  minReplicaCount: 0
  maxReplicaCount: 10
  # Poll often enough that the wake is not sitting behind a 30s KEDA tick.
  pollingInterval: 1
  cooldownPeriod: 300
  scaleUp:
    stabilizationWindowSeconds: 0
    periodSeconds: 15
    stepsize: 1
  scaleDown:
    stabilizationWindowSeconds: 300
    periodSeconds: 45
    stepsize: 1

ingress:
  enabled: false

prometheus:
  # Use the AF Prometheus already running in cms (HelmRelease `prometheus`).
  # It scrapes Triton via af-pod-monitor and attaches app/release labels the
  # SuperSONIC dashboard expects — rancher-monitoring does not.
  # FQDN required: KEDA operator runs in the keda namespace and cannot
  # resolve the short name prometheus-server.
  external:
    enabled: true
    url: prometheus-server.cms.svc.cluster.local
    port: 9090
    scheme: http

# Nothing to disable for tracing: the Tempo and OpenTelemetry Collector
# dependencies were removed from the chart after 0.3.1, so this branch has no
# way to reach either.

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-af-grafana-default-dashboard
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          # Must match the chart dashboard's hardcoded datasource uid.
          uid: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          # Chart validation requires scheme://host with no port (must match
          # prometheus.external.scheme + .url). Port 9090 is injected by the
          # HelmRelease postRenderer in helmrelease.yaml.
          url: http://prometheus-server.cms.svc.cluster.local
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
  ingress:
    enabled: true
    hosts:
      - supersonic-af-grafana.geddes.rcac.purdue.edu
    tls:
      - hosts:
          - supersonic-af-grafana.geddes.rcac.purdue.edu
    ingressClassName: public
  grafana.ini:
    server:
      root_url: https://supersonic-af-grafana.geddes.rcac.purdue.edu
