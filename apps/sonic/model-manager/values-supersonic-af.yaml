# Values of the supersonic-af model manager, deployed by Flux; see README.md.

supersonicRelease: supersonic-af

image:
  repository: geddes2-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/supersonic-model-manager
  tag: "latest"
  # The code is in the image, so a restart must fetch the moved tag.
  pullPolicy: Always

modelRepository:
  # RWX: the manager writes while the Triton pods read.
  claimName: supersonic-model-repository
  accessModes:
    - ReadWriteMany
  storageClassName: geddes-standard-multinode

# The Envoy LoadBalancer clients dial; discovery would report the in-cluster Service.
inferenceEndpoint: supersonic-af.cms.geddes.rcac.purdue.edu:8001

prometheus:
  url: http://prometheus-server.cms.svc.cluster.local:9090

auth:
  # Secret created out of band (README.md); the HelmRelease retries until it exists.
  existingSecret: supersonic-model-manager-auth

ingress:
  enabled: true
  hostName: supersonic-models.geddes.rcac.purdue.edu
  ingressClassName: public
  tls: true

nodeSelector: { "cms-af-prod": "true" }

tolerations:
  - key: hub.jupyter.org/dedicated
    operator: Equal
    value: cms-af
    effect: NoSchedule
