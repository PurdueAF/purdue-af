# Default configuration values for the SuperSONIC Model Manager

# -- Unique identifier of this instance (equal to release name by default)
nameOverride: ""

# -- Name of the SuperSONIC release this manager is attached to.
# Used to build the default Triton pod selector and Prometheus label matchers.
supersonicRelease: ""

image:
  repository: ghcr.io/fastmachinelearning/supersonic-model-manager
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

# -- Model repository PVC.
# The PVC is annotated with helm.sh/resource-policy=keep, so uninstalling this
# chart never deletes the models.
modelRepository:
  # -- Claim name. Reused as-is if the PVC already exists.
  claimName: supersonic-model-repository
  # -- Create the PVC if it is not already present in the namespace.
  create: true
  size: 1Gi
  # -- ReadWriteMany is required when Triton pods mount the same claim while
  # this app writes to it. ReadWriteOnce works only for single-node setups.
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  # -- Where the PVC is mounted inside the manager pod
  mountPath: /models
  # -- Subdirectory of the claim holding the model repository. Set this when
  # the models live inside a larger shared claim (e.g. "triton_models" on
  # af-shared-storage); the app still sees the repository root at mountPath.
  subPath: ""
  # -- Refuse all writes (uploads, deletes, load/unload) when true
  readOnly: false
  # -- Largest single upload accepted, in bytes (default 8 GiB)
  maxUploadBytes: 8589934592

# -- How to find the Triton servers to control.
triton:
  # "kubernetes" discovers Triton pods by label; "static" uses the endpoints list.
  discovery: kubernetes
  # -- Namespace holding the Triton pods (defaults to the release namespace)
  namespace: ""
  # -- Label selector for Triton pods. When empty, it is derived from
  # supersonicRelease as: app.kubernetes.io/component=triton,app.kubernetes.io/instance=<release>
  labelSelector: ""
  # -- Triton HTTP port (the KServe v2 REST API)
  httpPort: 8000
  # -- Explicit "host:port" endpoints; setting this forces static discovery
  endpoints: []
  timeoutSeconds: 10

prometheus:
  # -- Base URL of the Prometheus that scrapes Triton, e.g. http://sonic-prometheus-server:9090
  url: ""
  # -- Extra PromQL label matchers applied to every nv_* query,
  # e.g. 'release="sonic-interlink",namespace="sonic"'.
  # When empty, it is derived from supersonicRelease.
  selector: ""
  # -- Rate window for throughput and latency
  window: 5m
  timeoutSeconds: 8

auth:
  # -- HTTP Basic auth guarding the whole dashboard
  enabled: true
  username: admin
  # -- Password in plain text. Prefer existingSecret in real deployments.
  password: ""
  # -- Secret with keys "username" and "password" (takes precedence over the above)
  existingSecret: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}
  labels: {}

ingress:
  enabled: false
  ingressClassName: ""
  hostName: ""
  annotations: {}
  # -- Set to true to emit a tls block for hostName
  tls: false
  tlsSecretName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # -- Role allowing the app to read Triton pods and the PVC in this namespace
  create: true

# -- Inference endpoint shown at the top of the dashboard. Leave empty to
# discover it from the release's Envoy Ingress, falling back to the Envoy
# Service's in-cluster address.
inferenceEndpoint: ""

# -- Dashboard auto-refresh interval, seconds
refreshSeconds: 15

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  # Makes the mounted PVC writable by the unprivileged app user.
  # On a large shared claim, set fsGroup: null instead (and rely on the
  # directory's own permissions) so the kubelet does not walk the whole tree.
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
