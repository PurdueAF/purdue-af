{{/* Refuse to take over a hostname already served by another ingress here. */}}
{{- if and .Values.ingress.enabled .Values.ingress.hostName -}}
  {{- $hostName := .Values.ingress.hostName -}}
  {{- $currentName := include "modelManager.name" . -}}
  {{- range $ingress := (lookup "networking.k8s.io/v1" "Ingress" .Release.Namespace "").items -}}
    {{- if not (hasPrefix $currentName $ingress.metadata.name) -}}
      {{- range $ingress.spec.rules -}}
        {{- if eq .host $hostName -}}
          {{- fail (printf "Error: Ingress host %q is already in use by ingress %q" $hostName $ingress.metadata.name) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end }}

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "modelManager.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "modelManager.labels" . | nindent 4 }}
  annotations:
    # Model files are large; do not let the proxy cap the upload body.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostName }}
      {{- if .Values.ingress.tlsSecretName }}
      secretName: {{ .Values.ingress.tlsSecretName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hostName }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "modelManager.name" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
