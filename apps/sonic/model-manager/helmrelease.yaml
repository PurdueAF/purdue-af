apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supersonic-model-manager
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      # In-repo chart, from the experimental GitRepository.
      chart: ./apps/sonic/model-manager/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: purdue-af-experimental
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: supersonic-model-manager-config
      valuesKey: values.yaml
