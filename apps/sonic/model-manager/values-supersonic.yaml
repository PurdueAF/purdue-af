# Values for the `supersonic` SuperSONIC release (apps/sonic/supersonic),
# which runs in the cms namespace on Geddes.
#
#   helm install model-manager ./chart -n cms -f values-supersonic.yaml \
#     --set auth.password='...'
#
# Checked against the live release:
#   - Triton pods carry app.kubernetes.io/instance=supersonic in namespace cms
#   - metrics are scraped by cms prometheus-server (af-pod-monitor job), which
#     sets app/release labels from the Service's app.kubernetes.io/* labels
#
# The release mounts the same claim at /models and runs with
# --model-control-mode=explicit (apps/sonic/supersonic/values.yaml), so
# uploads here are servable and the load/unload switches work.

supersonicRelease: supersonic

image:
  # Aux images are published by ci.yml as :latest (and :sha-<commit>); semver
  # tags only come from release-image.yml, so :latest is the channel to track.
  repository: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/supersonic-model-manager
  tag: "latest"

modelRepository:
  # Dedicated claim, created here and mounted read-only by the Triton pods.
  # RWX because the manager writes while Triton reads, from different pods.
  claimName: supersonic-model-repository
  create: true
  size: 1Gi
  accessModes:
    - ReadWriteMany
  storageClassName: geddes-standard-multinode
  mountPath: /models

triton:
  discovery: labels
  # Derived from supersonicRelease as:
  #   app.kubernetes.io/component=triton,app.kubernetes.io/instance=supersonic
  labelSelector: ""
  httpPort: 8000

# Envoy's LoadBalancer address, which is what clients actually dial. Set
# explicitly because discovery would otherwise report the in-cluster Service
# name — the gRPC Ingress is disabled for this release.
inferenceEndpoint: supersonic.cms.geddes.rcac.purdue.edu:8001

prometheus:
  url: http://prometheus-server.cms.svc.cluster.local:9090
  # Default selector release="supersonic" (from supersonicRelease) matches the
  # labels af-pod-monitor attaches on cms prometheus-server.
  window: 5m

auth:
  enabled: true
  # No password in git: the Secret is created out of band with
  #   kubectl -n cms create secret generic supersonic-model-manager-auth \
  #     --from-literal=username=admin --from-literal=password='...'
  # The HelmRelease stays in a retrying state until it exists.
  existingSecret: supersonic-model-manager-auth

ingress:
  enabled: true
  hostName: supersonic-models.geddes.rcac.purdue.edu
  ingressClassName: public
  tls: true

nodeSelector: { "cms-af-prod": "true" }

tolerations:
  - key: hub.jupyter.org/dedicated
    operator: Equal
    value: cms-af
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
