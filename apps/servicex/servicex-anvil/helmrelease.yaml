apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: servicex-anvil
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      chart: servicex
      version: "1.8.6"
      sourceRef:
        kind: HelmRepository
        name: ssl-hep
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: servicex-anvil-config
      valuesKey: values.yaml
