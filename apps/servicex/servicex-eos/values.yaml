app:
  image: geddes2-registry.rcac.purdue.edu/cms/servicex_app
  tag: local
  checksImage: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/ncsa/checks:main@sha256:0b738bbc8d70d2dd93fce63fb2a8a1a41440b50f19af16578f68469103bddbae
  allowedImagePrefixes:
    - "geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/"
    - "geddes2-registry.rcac.purdue.edu/cms/"
    - "docker.io/sslhep"
    - "sslhep/"
    - "gitlab-registry.cern.ch/"
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: 4
      memory: 4Gi
  nodeSelector: &af-nodes
    cms-af-prod: "true"
  tolerations: &af-tolerations
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
noCerts: false
postgres:
  enabled: true
postgresql:
  image:
    registry: geddes2-registry.rcac.purdue.edu
    repository: dockerhub-proxy-cache/bitnamilegacy/postgresql
    tag: 14.5.0-debian-11-r35
  global:
    postgresql:
      auth:
        existingSecret: servicex-secrets-eos
        secretKeys:
          adminPasswordKey: postgresql-password
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
    persistence:
      enabled: false
    nodeSelector: *af-nodes
    tolerations: *af-tolerations

# Transformers write root://<host>/<pathPrefix>/<request id>/ with the x509 proxy.
objectStore:
  enabled: true
  internal: false
  type: eos
  eos:
    host: eos.cms.rcac.purdue.edu
    protocol: root
    pathPrefix: /store/user/dkondrat
    useBucketDirectory: "true"

codeGen:
  uproot-raw:
    enabled: true
    image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/sslhep/servicex_code_gen_raw_uproot
    tag: "v1.8.6"
    defaultScienceContainerImage: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/sslhep/servicex_science_image_combined_root
    defaultScienceContainerTag: 5.7.2-6.38.04
    compressionAlgorithm: ZSTD
    compressionLevel: 5
    nodeSelector: *af-nodes
    tolerations: *af-tolerations
  rdataframe:
    enabled: false
  uproot:
    enabled: false
  python:
    enabled: true
    image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/sslhep/servicex_code_gen_python
    tag: "v1.8.6"
    defaultScienceContainerImage: docker.io/sslhep/servicex_science_image_combined_root
    defaultScienceContainerTag: 5.7.4-6.38.04-coffea
    compressionAlgorithm: ZLIB
    # A string: the chart reads a numeric 0 as unset and falls back to 5.
    compressionLevel: "0"
    nodeSelector: *af-nodes
    tolerations: *af-tolerations
  atlasr21:
    enabled: false
  atlasr22:
    enabled: false
  atlasr25:
    enabled: false
  topcp:
    enabled: false

transformer:
  sidecarImage: geddes2-registry.rcac.purdue.edu/cms/servicex-transformer-sidecar
  sidecarTag: dmitry
  # The tag is pushed over in place.
  sidecarPullPolicy: Always
  autoscaler:
    maxReplicas: 100
  cpuRequest: 500m
  memoryRequest: 2Gi
  cpuLimit: 1
  memoryLimit: 4Gi
  nodeSelector: *af-nodes
  tolerations: *af-tolerations

rabbitmq:
  image:
    registry: geddes2-registry.rcac.purdue.edu
    repository: dockerhub-proxy-cache/bitnamilegacy/rabbitmq
    tag: 3.11.18-debian-11-r0
  auth:
    existingPasswordSecret: servicex-secrets-eos
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  nodeSelector: *af-nodes
  tolerations: *af-tolerations
# The chart's default ships the logs of the app and the DID finders to a Logstash outside the facility.
logging:
  logstash:
    enabled: false

didFinder:
  rucio:
    enabled: false
  xrootd:
    enabled: true
    tag: "v1.8.6"
    nodeSelector: *af-nodes
    tolerations: *af-tolerations
  CERNOpenData:
    enabled: false
  atlasopenmagic:
    enabled: false
x509Secrets:
  image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/sslhep/x509-secrets
  tag: "v1.8.6"
  initImage: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/alpine:3.24
  pullPolicy: Always
  vomsOrg: cms
  nodeSelector: *af-nodes
  tolerations: *af-tolerations

scheduledTasks:
  image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/python
  tag: "3.12.16"
  nodeSelector: *af-nodes
  tolerations: *af-tolerations

secrets: servicex-secrets-eos
