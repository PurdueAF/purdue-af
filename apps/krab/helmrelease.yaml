apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krab
spec:
  suspend: false
  interval: 1m
  chart:
    spec:
      chart: helm
      sourceRef:
        kind: GitRepository
        name: krab
      reconcileStrategy: Revision
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: krab-config
      valuesKey: values.yaml
