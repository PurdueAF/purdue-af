# Its intended clients; the namespace's own np-default, outside this repository, admits every other pod in cms too.
# Kubelet probes come from the node host IP, which NetworkPolicy does not block under Calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-interface
  labels:
    app: agentic-interface
spec:
  podSelector:
    matchLabels:
      app: agentic-interface
  policyTypes:
    - Ingress
  ingress:
    - from:
        # (a) JupyterHub proxy: external traffic via /services/agentic-interface.
        - podSelector:
            matchLabels:
              app: jupyterhub
              component: proxy
        # (b) AF user sessions: config-agents.sh registers the in-cluster URL.
        - podSelector:
            matchLabels:
              app: jupyterhub
              component: singleuser-server
        # (c) Rancher Prometheus, via the scrape-metrics ServiceMonitor.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-monitoring-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        # (d) PurdueAF Agent, on Mattermost (apps/mattermost-agent).
        - podSelector:
            matchLabels:
              app: mattermost-agent
      ports:
        - protocol: TCP
          port: 8888
