apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-interface
  labels:
    app: agentic-interface
spec:
  replicas: 1
  # Recreate, not RollingUpdate: MCP sessions are stateful and pinned
  # in-process to the single replica (MCP_STATELESS_HTTP=false). During a
  # rolling update two replicas coexist and clients mid-session hit the
  # wrong pod; a brief downtime during deploys is more honest than
  # split-brain sessions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-interface
  template:
    metadata:
      labels:
        app: agentic-interface
    spec:
      # Matches the fixed UID baked into the image (docker/agentic-interface/
      # Dockerfile: useradd --uid 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-interface
          # Auto-versioned: when a green pipeline on main changes this image,
          # ci.yml's publish stage patch-bumps this tag (bump-agentic-version.py)
          # in an auto-release commit, and Flux rolls the pod onto it once that
          # commit's own CI is green. `latest` only until the first auto-release.
          image: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/agentic-interface:0.0.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8888
          env:
            - name: JUPYTERHUB_SERVICE_PREFIX
              value: "/services/agentic-interface"
            # Stateful streamable-HTTP sessions (single replica) so tools can use
            # MCP elicitation for interactive prompts (e.g. create_dask_cluster).
            - name: MCP_STATELESS_HTTP
              value: "false"
            - name: JUPYTERHUB_API_URL
              value: "http://hub:8081/hub/api"
            - name: LOKI_URL
              value: "http://loki.cms.svc.cluster.local:3100"
            - name: PROMETHEUS_URL
              value: "http://prometheus-server:9090"
            - name: CLUSTER_PROMETHEUS_URL
              value: "http://rancher-monitoring-prometheus.cattle-monitoring-system.svc.cluster.local:9090"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DASK_GATEWAY_K8S_URL
              value: "http://api-dask-gateway-k8s.cms.svc.cluster.local:8000"
            - name: DASK_GATEWAY_SLURM_URL
              value: "http://api-dask-gateway-k8s-slurm.cms.svc.cluster.local:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Nothing writes to disk in normal operation (the uv venv is baked
            # at build time; httpx/prometheus_client are in-memory), but with
            # readOnlyRootFilesystem a writable /tmp is a cheap safety valve
            # for tempfile/TLS/etc. HOME also points here (see Dockerfile).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      serviceAccountName: agentic-interface
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: "hub.jupyter.org/dedicated"
          operator: "Equal"
          value: "cms-af"
          effect: "NoSchedule"
