apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-interface
  labels:
    app: agentic-interface
spec:
  # One replica: a question's answer is only read by the process that asked it.
  replicas: 1
  selector:
    matchLabels:
      app: agentic-interface
  template:
    metadata:
      labels:
        app: agentic-interface
    spec:
      # The fixed UID of the image (docker/agentic-interface/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-interface
          image: geddes2-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/agentic-interface:0.9.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8888
          env:
            - name: AF_PUBLIC_URL
              value: "https://${jupyterhub_host:=cms.geddes.rcac.purdue.edu}"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Writable /tmp under readOnlyRootFilesystem; HOME points here too.
            - name: tmp
              mountPath: /tmp
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
            - name: docs
              mountPath: /docs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # From the core root; get_facility_metrics reads it on each call.
        - name: dashboards
          configMap:
            name: grafana-public-dashboards
            optional: true
            items:
              - key: default.json
                path: default.json
        # docs/docs, from flux/experimental; read_af_doc reads it on each call.
        - name: docs
          configMap:
            name: user-docs
            optional: true
      serviceAccountName: agentic-interface
      nodeSelector:
        ${af_node_label:=cms-af-prod}: ${af_node_label_value:="true"}
      tolerations:
        - key: "hub.jupyter.org/dedicated"
          operator: "Equal"
          value: "cms-af"
          effect: "NoSchedule"
