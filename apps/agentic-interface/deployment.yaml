apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-interface
  labels:
    app: agentic-interface
spec:
  replicas: 1
  # Recreate: MCP sessions are stateful and pinned to the single replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-interface
  template:
    metadata:
      labels:
        app: agentic-interface
    spec:
      # The fixed UID of the image (docker/agentic-interface/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentic-interface
          image: geddes2-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/agentic-interface:0.7.9
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8888
          env:
            # Stateful sessions (single replica), so tools can use MCP elicitation.
            - name: MCP_STATELESS_HTTP
              value: "false"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            # Writable /tmp under readOnlyRootFilesystem; HOME points here too.
            - name: tmp
              mountPath: /tmp
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # From the core root; get_facility_metrics reads it on each call.
        - name: dashboards
          configMap:
            name: grafana-public-dashboards
            optional: true
            items:
              - key: default.json
                path: default.json
      serviceAccountName: agentic-interface
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: "hub.jupyter.org/dedicated"
          operator: "Equal"
          value: "cms-af"
          effect: "NoSchedule"
