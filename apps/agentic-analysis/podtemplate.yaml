# Pod spec of every agentic-analysis task; replaces the flyte-task default.
apiVersion: v1
kind: PodTemplate
metadata:
  name: agentic-analysis
template:
  metadata:
    labels:
      app.kubernetes.io/part-of: agentic-analysis
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      cms-af-prod: "true"
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: cms-af
        effect: NoSchedule
    # The image's `app` user (docker/agentic-analysis/Dockerfile).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    containers:
      - name: default
        image: overridden-by-flyte
        env:
          # Where and as what the analysis's scripts send their profiles.
          - name: PYROSCOPE_SERVER
            value: http://pyroscope.cms.svc.cluster.local:4040
          - name: PYROSCOPE_APP
            value: agentic-analysis
          # The LLM proxy the agents' models are behind, and the token it takes (llm-proxy.yaml).
          - name: AF_LLM_PROXY
            value: http://agentic-analysis-llm-proxy:8080
          - name: AF_LLM_TOKEN
            valueFrom:
              secretKeyRef:
                name: agentic-analysis-llm-proxy
                key: client-token
          # The account's token, which af_dask and af_ray send (../dask-gateway/README.md#workload-accounts).
          - name: AF_ACCOUNT_TOKEN_FILE
            value: /etc/af-account/token
          # The sessions' Dask Gateway, by its in-cluster address: it takes an account's token only from a pod.
          - name: DASK_GATEWAY__ADDRESS
            value: http://api-dask-gateway:8000
          # Dashboard links: the gateway's Traefik serves dashboards, its API does not.
          - name: DASK_GATEWAY__PUBLIC_ADDRESS
            value: http://dask-gateway.geddes.rcac.purdue.edu
          # Its Traefik's route to schedulers, by its in-cluster address too, which networkpolicy.yaml admits.
          - name: DASK_GATEWAY__PROXY_ADDRESS
            value: traefik-dask-gateway:8786
          - name: DASK_GATEWAY__AUTH__TYPE
            value: af_dask.AccountAuth
          # The facility's grid proxy, which af-x509-secrets renews, for AAA and DAS.
          - name: X509_USER_PROXY
            value: /etc/grid-security-ro/x509up
          - name: X509_CERT_DIR
            value: /cvmfs/cms.cern.ch/grid/etc/grid-security/certificates
          # CVMFS's dasgoclient picks its build by this on an image that is not EL.
          - name: SCRAM_ARCH
            value: el9_amd64_gcc12
        volumeMounts:
          # The workload account's volume, where its Dask and Ray clusters mount it.
          - name: volume
            mountPath: /agentic-analysis
          - name: account
            mountPath: /etc/af-account
            readOnly: true
          - name: cvmfs
            mountPath: /cvmfs
            mountPropagation: HostToContainer
            readOnly: true
          - name: x509-proxy
            mountPath: /etc/grid-security-ro
            readOnly: true
    volumes:
      - name: volume
        persistentVolumeClaim:
          claimName: agentic-analysis
      - name: account
        secret:
          secretName: agentic-analysis-account
          # 0444, as the proxy's below.
          defaultMode: 292
      - name: cvmfs
        persistentVolumeClaim:
          claimName: cvmfs
      - name: x509-proxy
        secret:
          secretName: ${x509_secret_name}
          # 0444: the task user is not the Secret's owner.
          defaultMode: 292
          optional: true
