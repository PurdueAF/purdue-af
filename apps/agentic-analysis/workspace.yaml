# The task pods' directory on /work and the root of the agentic-analysis
# volume. A subPath that kubelet creates and a new CephFS volume's root are
# root's, and CephFS ignores fsGroup: hand both to the task image's user.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-analysis-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      containers:
        - name: mkdir
          image: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/agentic-analysis:latest
          command:
            - sh
            - -c
            - >-
              mkdir -p /projects/agentic-analysis &&
              chown 1000:1000 /projects/agentic-analysis /volume
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /projects
              subPath: projects
            - name: volume
              mountPath: /volume
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: af-shared-storage
        - name: volume
          persistentVolumeClaim:
            claimName: agentic-analysis
