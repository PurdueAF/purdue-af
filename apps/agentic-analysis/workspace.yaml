# The root of the agentic-analysis volume. A new CephFS volume's root is
# root's, and CephFS ignores fsGroup: hand it to the task image's user.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-analysis-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      containers:
        - name: chown
          image: geddes2-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/agentic-analysis:latest
          command:
            - sh
            - -c
            - chown 1000:1000 /volume
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: volume
              mountPath: /volume
      volumes:
        - name: volume
          persistentVolumeClaim:
            claimName: agentic-analysis
