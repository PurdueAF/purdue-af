# CephFS ignores fsGroup, so this hands the agentic-analysis volume's root to the task image's user.
apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-analysis-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      containers:
        - name: chown
          image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/busybox:1.38
          command:
            - chown
            - "1000:1000"
            - /volume
          volumeMounts:
            - name: volume
              mountPath: /volume
      volumes:
        - name: volume
          persistentVolumeClaim:
            claimName: agentic-analysis
