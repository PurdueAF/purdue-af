# Pod spec of every jfc task; replaces the flyte-task default.
apiVersion: v1
kind: PodTemplate
metadata:
  name: jfc
template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      cms-af-prod: "true"
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: cms-af
        effect: NoSchedule
    # The image's `app` user (docker/self-repair/Dockerfile).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    containers:
      - name: default
        image: overridden-by-flyte
        env:
          # Claude Code's key for Purdue GenAI Studio: the one self-repair uses.
          - name: ANTHROPIC_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: self-repair-genai
                key: api-key
        volumeMounts:
          # Of /work, the agent sees this directory only.
          - name: work
            mountPath: /work/projects/jfc
            subPath: projects/jfc
    volumes:
      - name: work
        persistentVolumeClaim:
          claimName: af-shared-storage
