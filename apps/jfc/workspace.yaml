# The directory the task pods mount. A subPath that kubelet creates is root's,
# and CephFS ignores fsGroup: create it for the task image's user.
apiVersion: batch/v1
kind: Job
metadata:
  name: jfc-workspace
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cms-af-prod: "true"
      tolerations:
        - key: hub.jupyter.org/dedicated
          operator: Equal
          value: cms-af
          effect: NoSchedule
      containers:
        - name: mkdir
          image: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/self-repair:latest
          command:
            - sh
            - -c
            - mkdir -p /projects/jfc && chown 1000:1000 /projects/jfc
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: work
              mountPath: /projects
              subPath: projects
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: af-shared-storage
