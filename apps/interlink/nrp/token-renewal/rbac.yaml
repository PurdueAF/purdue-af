apiVersion: v1
kind: ServiceAccount
metadata:
  name: interlink-nrp-token-renewal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interlink-nrp-token-renewal
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kubeconfig-nrp-interlink]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interlink-nrp-token-renewal
subjects:
  - kind: ServiceAccount
    name: interlink-nrp-token-renewal
roleRef:
  kind: Role
  name: interlink-nrp-token-renewal
  apiGroup: rbac.authorization.k8s.io
