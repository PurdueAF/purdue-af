# interLink virtual node offloading pods to NRP Nautilus; see ../README.md.
nodeName: interlink-nrp

interlink:
  image: ghcr.io/interlink-hq/interlink/interlink:0.7.0-pre1
  enabled: true
  socket: unix:///var/run/interlink.sock
  logging:
    verboseLogging: false
    errorsOnlyLogging: true

plugin:
  enabled: true
  # Site build (docker/interlink-kubernetes-plugin): upstream 1.2.0 plus the site patches.
  image: "geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/interlink-kubernetes-plugin:1.2.0"
  address: "http://0.0.0.0"
  port: 4000
  privileged: false
  envs:
    # The chart mounts plugin.config at plugin.yaml; the plugin reads INI
    # whatever the file is called.
    - name: CONFIG_FILE_PATH
      value: /etc/interlink/plugin.yaml
  extraVolumeMounts:
    - name: kubeconfig
      mountPath: /interlink-kubernetes-plugin/private/k8s
      readOnly: true
  resources:
    # null drops the chart's CPU request and limit.
    CPU: null
    memory:
      request: 512Mi
      limit: 1Gi
  config: |
    [app]
    name=interlink-kubernetes-plugin
    # FastAPI asserts a non-empty version at import time; omit these and the plugin crash-loops.
    description=InterLink Kubernetes Plugin - offload pods to a remote Kubernetes cluster
    version=1.2.0
    api_versions=v1
    api_docs_path=/docs
    socket_address=http://0.0.0.0
    socket_port=4000

    [log]
    level=INFO
    rich_enabled=True
    requests_enabled=False

    [k8s]
    # Relative to the plugin image's workdir (/interlink-kubernetes-plugin),
    # where the kubeconfig secret is mounted.
    kubeconfig_path=private/k8s/kubeconfig.yaml

    [offloading]
    namespace_prefix=interlink
    # NRP grants namespaced RBAC only; the offloading namespace is created out
    # of band, and the plugin skips its cluster-scope namespace list.
    ensure_namespace=False
    # The virtual kubelet cannot follow an in-place restart: the local pod
    # goes Failed while the remote one restarts, holding its GPU.
    restart_policy=Never

    [mesh]
    init_container=True
    startup_probe=True
    slurm_setup_script=False

    [tcp_tunnel]
    enabled=False

    [wstunnel]
    # Runs the virtual kubelet's tunnel command beside each offloaded pod with
    # exposed ports; keep in step with virtualNode.network.tunnelImage.
    client_image=ghcr.io/erebe/wstunnel:v11.1.0

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.7.0-pre1
  # The local scheduler's gate only; NRP places the real pod. One pod per GPU,
  # each the default Ray Train worker of apps/ray-train/raycluster.yaml.
  resources:
    CPUs: 160
    memGiB: 640
    pods: 20
    accelerators:
      - resourceType: nvidia.com/gpu
        available: "20"

  disableCSR: true

  # A pod with exposed ports gets a shadow pod here and a tunnel client on NRP
  # (the plugin's wstunnel-client sidecar), so Geddes reaches its ports.
  network:
    enableTunnel: true
    tunnelImage: "ghcr.io/erebe/wstunnel:v11.1.0"
    wildcardDNS: "geddes.rcac.purdue.edu"
    # No wildcard DNS: the client dials the ingress by a name that resolves and
    # sends the shadow's hostname as Host. Runs in the foreground as the sidecar.
    wstunnelCommand: 'exec /home/app/wstunnel client --log-lvl WARN --http-upgrade-path-prefix %[1]s %[2]s -H "Host: %[3]s" ws://cms.geddes.rcac.purdue.edu:80'
    # The chart's nginx template with the Geddes ingress class and a pinned image.
    customTemplate: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: {{.Name}}
        template:
          metadata:
            labels:
              app.kubernetes.io/component: {{.Name}}
          spec:
            nodeSelector:
              cms-af-prod: "true"
            tolerations:
              - key: hub.jupyter.org/dedicated
                operator: Equal
                value: cms-af
                effect: NoSchedule
            containers:
            - name: wstunnel
              image: ghcr.io/erebe/wstunnel:v11.1.0
              command: ["/bin/sh", "-c"]
              args:
              - exec /home/app/wstunnel server --log-lvl WARN --restrict-http-upgrade-path-prefix {{.RandomPassword}} ws://0.0.0.0:28080
              ports:
              - containerPort: 28080
                name: ws
                protocol: TCP
              {{- range .ExposedPorts}}
              - containerPort: {{.Port}}
                name: {{.Name}}
                protocol: {{.Protocol}}
              {{- end}}
              resources:
                requests:
                  cpu: 100m
                  memory: 90Mi
                limits:
                  memory: 256Mi
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/component: {{.Name}}
        ports:
          - port: 28080
            targetPort: 28080
            name: ws
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      spec:
        ingressClassName: public
        rules:
        - host: {{.Name}}-{{.Namespace}}.{{.WildcardDNS}}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: {{.Name}}
                  port:
                    number: 28080

extraVolumes:
  - name: kubeconfig
    secret:
      secretName: kubeconfig-nrp-interlink
      defaultMode: 0400

podScheduling:
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
