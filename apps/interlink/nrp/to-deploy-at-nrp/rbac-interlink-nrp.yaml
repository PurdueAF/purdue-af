# These resources are to be deployed to NRP Nautilus, not Geddes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: interlink-plugin
  namespace: interlink-cms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: interlink-plugin
  namespace: interlink-cms
rules:
  # offloaded pods: create, status polling, delete
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  # the plugin reads the status subresource on every poll; `get` on pods
  # does not cover it
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get]
  # GET /getLogs
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # volumes offloaded per pod and deleted with it (suffixed by pod UID)
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, create, update, delete]
  # only needed with the interlink.io/remote-pvc annotation
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  # surfacing scheduling and pull errors in pod status
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
  # its own next token, which the token-renewal CronJob on Geddes mints with
  # the current one (../token-renewal)
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [interlink-plugin]
    verbs: [create]
  # Jobs on NRP of the ray-train gateway (apps/ray-train/nrp_jobs.py), which
  # suspends and resumes them and keeps their progress in their annotations
  - apiGroups: [ray.io]
    resources: [rayjobs]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: interlink-plugin
  namespace: interlink-cms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: interlink-plugin
subjects:
  - kind: ServiceAccount
    name: interlink-plugin
    namespace: interlink-cms
