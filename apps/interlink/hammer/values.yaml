# interLink virtual node for Slurm on Hammer; see ../README.md.
nodeName: interlink-hammer

plugin:
  image: "geddes2-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/interlink-slurm-plugin:0.6.2-pre3"
  extraVolumeMounts:
    - name: plugin-data
      mountPath: /depot/cms/purdue-af/interlink/
    - name: cvmfs
      mountPath: /cvmfs
    - name: munge-key
      mountPath: /etc/secrets/munge
      readOnly: true
  resources:
    memory:
      request: 512Mi
      limit: 4Gi
  envs:
    - name: SLURM_CLUSTER
      value: "hammer"
    - name: SLURMCONFIGPATH
      value: "/etc/interlink/plugin.yaml"
    - name: SHARED_FS
      value: "true"
    - name: HOME
      value: "/depot/cms/purdue-af/interlink/cache"
  config: |
    ImagePrefix: "docker://"
    SidecarPort: 4000
    ErrorsOnlyLogging: true
    EnableProbes: true
    DataRootFolder: "/depot/cms/purdue-af/interlink/"
    ExportPodData: true
    # The image links the cluster's Slurm client here (docker/interlink-slurm-plugin/startup.sh).
    SbatchPath: "/opt/purdue-af/slurm-active/bin/sbatch"
    ScancelPath: "/opt/purdue-af/slurm-active/bin/scancel"
    SqueuePath: "/opt/purdue-af/slurm-active/bin/squeue"
    SinfoPath: "/opt/purdue-af/slurm-active/bin/sinfo"
    ContainerRuntime: "singularity"
    SingularityDefaultOptions:
      - "--nv"
      - "--no-eval"
    Namespace: "${namespace}"
    BashPath: /bin/bash

virtualNode:
  resources:
    CPUs: 1000
    memGiB: 4000
    pods: 300
  network:
    # Bare $VAR: Flux postBuild substitutes only the braced form. ln publishes
    # the cached binary because, unlike mv, it never replaces one a job is running.
    wstunnelCommand: |
      WSTUNNEL_TAG=v11.1.0 && \
      WSTUNNEL_DIR="/depot/cms/purdue-af/interlink/wstunnel-cache" && \
      WSTUNNEL="$WSTUNNEL_DIR/wstunnel-$WSTUNNEL_TAG" && \
      { [ -x "$WSTUNNEL" ] || { \
        mkdir -p "$WSTUNNEL_DIR" && \
        WSTUNNEL_TMP="$(mktemp -d -p "$WSTUNNEL_DIR")" && \
        curl -fsSL --max-time 120 "https://github.com/erebe/wstunnel/releases/download/$WSTUNNEL_TAG/wstunnel_$(echo $WSTUNNEL_TAG | tr -d v)_linux_amd64.tar.gz" -o "$WSTUNNEL_TMP/wstunnel.tar.gz" && \
        tar -xzf "$WSTUNNEL_TMP/wstunnel.tar.gz" -C "$WSTUNNEL_TMP" wstunnel && \
        chmod +x "$WSTUNNEL_TMP/wstunnel" && \
        ln "$WSTUNNEL_TMP/wstunnel" "$WSTUNNEL"; \
        rm -rf "$WSTUNNEL_TMP"; [ -x "$WSTUNNEL" ]; \
      }; } && \
      "$WSTUNNEL" client --log-lvl WARN --http-upgrade-path-prefix %[1]s %[2]s -H "Host: %[3]s" ws://128.211.160.122:80 2>&1 &

extraVolumes:
  - name: plugin-data
    nfs:
      server: datadepot.rcac.purdue.edu
      path: /depot/cms/purdue-af/interlink
  - name: cvmfs
    persistentVolumeClaim:
      claimName: cvmfs
  - name: munge-key
    persistentVolumeClaim:
      claimName: munge-key-hammer
