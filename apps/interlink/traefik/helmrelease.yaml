apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: interlink-traefik
spec:
  interval: 1m
  chart:
    spec:
      chart: traefik
      version: "41.7.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: interlink-traefik-config
      valuesKey: values.yaml
