# What every interLink node release shares; see README.md.
interlink:
  image: ghcr.io/interlink-hq/interlink/interlink:0.7.0-pre1
  enabled: true
  socket: unix:///var/run/interlink.sock
  logging:
    errorsOnlyLogging: true

plugin:
  enabled: true
  address: "http://0.0.0.0"
  port: 4000
  privileged: false
  resources:
    # null drops the chart's CPU request and limit.
    CPU: null

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.7.0-pre1

  containerResources:
    memory:
      request: 512Mi
      limit: 2Gi

  disableCSR: true

  network:
    enableTunnel: true
    wildcardDNS: "geddes.rcac.purdue.edu"
    # The chart's nginx template on apps/interlink/traefik and a pinned image;
    # the server accepts only the client's reverse tunnels to the pod's ports.
    customTemplate: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/component: {{.Name}}
        template:
          metadata:
            labels:
              app.kubernetes.io/component: {{.Name}}
          spec:
            nodeSelector:
              cms-af-prod: "true"
            tolerations:
              - key: hub.jupyter.org/dedicated
                operator: Equal
                value: cms-af
                effect: NoSchedule
            terminationGracePeriodSeconds: 45
            containers:
            - name: wstunnel
              image: ghcr.io/erebe/wstunnel:v11.1.0
              command: ["/bin/sh", "-c"]
              args:
              - |
                cat >/tmp/restrictions.yaml <<'EOF'
                restrictions:
                - name: reverse tunnels to the exposed ports
                  match:
                  - !PathPrefix ^{{.RandomPassword}}$
                  allow:
                  {{- range .ExposedPorts}}
                  - !ReverseTunnel {protocol: [Tcp], port: ["{{.Port}}"]}
                  {{- end}}
                EOF
                exec /home/app/wstunnel server --log-lvl WARN --restrict-config /tmp/restrictions.yaml ws://0.0.0.0:28080
              ports:
              - containerPort: 28080
                name: ws
                protocol: TCP
              {{- range .ExposedPorts}}
              - containerPort: {{.Port}}
                name: {{.Name}}
                protocol: {{.Protocol}}
              {{- end}}
              # Keeps the tunnel up for requests in flight when the offloaded pod is deleted.
              lifecycle:
                preStop:
                  exec:
                    command: ["sleep", "30"]
              resources:
                requests:
                  cpu: 100m
                  memory: 90Mi
                limits:
                  memory: 256Mi
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/component: {{.Name}}
        ports:
          - port: 28080
            targetPort: 28080
            name: ws
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: {{.Name}}
        namespace: {{.Namespace}}
        annotations:
          kubernetes.io/ingress.class: interlink-tunnel
      spec:
        rules:
        - host: {{.Name}}-{{.Namespace}}.{{.WildcardDNS}}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: {{.Name}}
                  port:
                    number: 28080

podScheduling:
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
