apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: interlink-gautschi
spec:
  interval: 1m
  chart:
    spec:
      chart: interlink
      version: "0.6.1"
      sourceRef:
        kind: HelmRepository
        name: interlink
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: interlink-gautschi-config
      valuesKey: values.yaml
  # The chart has no hook for the munge key or for sizing the node container,
  # so both are patched in. munge-key-gautschi is the same PVC the Gautschi
  # dask-gateway mounts — created out of band, never in git. The target name
  # follows nodeName: every chart resource is <nodeName>-*, so renaming the
  # node renames this target too.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: "interlink-gautschi-node"
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: munge-key
                  persistentVolumeClaim:
                    claimName: munge-key-gautschi
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: munge-key
                  mountPath: /etc/secrets/munge
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    memory: 16Gi
                  requests:
                    memory: 16Gi
