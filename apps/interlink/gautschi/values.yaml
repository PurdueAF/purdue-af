# interLink virtual node offloading AF pods to Slurm on Gautschi.
# Every chart resource is named after nodeName, including the Deployment the
# HelmRelease postRenderer patches (<nodeName>-node).
nodeName: interlink-gautschi

interlink:
  image: ghcr.io/interlink-hq/interlink/interlink:0.7.0-pre1
  enabled: true
  socket: unix:///var/run/interlink.sock
  address: http://0.0.0.0
  port: 3000
  logging:
    verboseLogging: false
    errorsOnlyLogging: true

plugin:
  enabled: true
  image: "geddes-registry.rcac.purdue.edu/cms/interlink-slurm-plugin:0.6.2-pre3"
  address: "http://0.0.0.0"
  port: 4000
  privileged: false
  extraVolumeMounts:
    - name: plugin-data
      mountPath: /depot/cms/purdue-af/interlink/
    - name: cvmfs
      mountPath: /cvmfs
  envs:
    - name: SLURMCONFIGPATH
      value: "/etc/interlink/plugin.yaml"
    - name: SHARED_FS
      value: "true"
    - name: HOME
      value: "/depot/cms/purdue-af/interlink/gautschi/cache"
  config: |
    ImagePrefix: "docker://"
    SidecarPort: 4000
    VerboseLogging: false
    ErrorsOnlyLogging: true
    EnableProbes: true
    DataRootFolder: "/depot/cms/purdue-af/interlink/gautschi/"
    ExportPodData: true
    SbatchPath: "/usr/bin/sbatch"
    ScancelPath: "/usr/bin/scancel"
    SqueuePath: "/usr/bin/squeue"
    CommandPrefix: ""
    ContainerRuntime: "singularity"
    SingularityPrefix: ""
    SingularityDefaultOptions:
      - "--nv"
      - "--no-eval"
    Namespace: "${namespace}"
    Tsocks: false
    TsocksPath: "$WORK/tsocks-1.8beta5+ds1/libtsocks.so"
    TsocksLoginNode: "login01"
    BashPath: /bin/bash

virtualNode:
  image: ghcr.io/interlink-hq/interlink/virtual-kubelet-inttw:0.6.2-pre1
  resources:
    CPUs: 1000
    memGiB: 4000
    pods: 300

  disableCSR: true

  network:
    # creates the wstunnel template ConfigMap
    enableTunnel: true
    tunnelImage: "ghcr.io/erebe/wstunnel:latest"
    # each pod gets its own tunnel at "<podname>.<wildcardDNS>"
    wildcardDNS: "geddes.rcac.purdue.edu"
    wstunnelTemplatePath: "/etc/templates/wstunnel.yaml"
    # empty = the chart's built-in nginx-ingress template
    customTemplate: ""
    # $DOWNLOAD_DIR survives Flux postBuild substitution: only the braced
    # form is substituted, bare $VAR is passed through untouched
    wstunnelCommand: |
      export DOWNLOAD_DIR="/depot/cms/purdue-af/interlink/gautschi" && \
      curl -L https://github.com/erebe/wstunnel/releases/download/v10.4.4/wstunnel_10.4.4_linux_amd64.tar.gz -o "$DOWNLOAD_DIR/wstunnel.tar.gz" && \
      tar -xzvf "$DOWNLOAD_DIR/wstunnel.tar.gz" -C "$DOWNLOAD_DIR" && \
      chmod +x "$DOWNLOAD_DIR/wstunnel" && \
      "$DOWNLOAD_DIR/wstunnel" client --log-lvl WARN --http-upgrade-path-prefix %s %s ws://%s:80 2>&1 | tee -a "$DOWNLOAD_DIR/wstunnel_client.log" &

extraVolumes:
  - name: plugin-data
    nfs:
      server: datadepot.rcac.purdue.edu
      path: /depot/cms/purdue-af/interlink
  - name: cvmfs
    persistentVolumeClaim:
      claimName: cvmfs

podScheduling:
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

serviceAccount:
  create: true
