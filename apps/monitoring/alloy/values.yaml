# Chart: grafana/alloy

controller:
  type: daemonset
  replicas: 1
  # Roll up to 3 nodes at a time; default maxUnavailable=1 is too slow for 12 nodes.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 3
  volumes:
    extra:
      - name: alloy-storage
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  nodeSelector:
    cms-af-dev: "true"

# Top level, not controller.service — the chart does not read that key, so the
# "enabled: false" that used to sit there disabled nothing. Session pods reach
# the OTLP receiver below at alloy.cms.svc.cluster.local.
service:
  enabled: true
  type: ClusterIP

serviceAccount:
  create: true

rbac:
  create: true

alloy:
  initialDelaySeconds: 30
  timeoutSeconds: 5
  # OTLP/HTTP intake for the agents; the chart puts extraPorts on both the
  # container and the Service.
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  mounts:
    extra:
      - name: alloy-storage
        mountPath: /tmp/alloy
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  configMap:
    create: true
    # River configuration: collect Kubernetes pod logs and send to Loki
    content: |
      logging {
        level = "warn"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["cms"]
        }
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        // dask scheduler/worker pods carry username in the 'user' label
        rule {
          source_labels = ["__meta_kubernetes_pod_label_user"]
          regex         = "(.+)"
          target_label  = "username"
        }
        // purdue-af (jupyterhub singleuser) pods carry username in 'username_unescaped'
        rule {
          source_labels = ["__meta_kubernetes_pod_label_username_unescaped"]
          regex         = "(.+)"
          target_label  = "username"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // Keep in sync with Loki limits_config.reject_old_samples_max_age (replay after Alloy restart).
        stage.drop {
          older_than          = "168h"
          drop_counter_reason = "older_than_loki_reject_window"
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.cms.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ── agent telemetry ───────────────────────────────────────────────
      //
      // Claude Code and codex export OTel themselves; config-agents.sh points
      // them here. Both signals could reach their backends directly, but they
      // come through Alloy so that the redaction below is a hop the data
      // cannot skip.

      otelcol.receiver.otlp "agents" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        // No gRPC listener: nothing uses one.
        output {
          metrics = [otelcol.processor.transform.agents.input]
          logs    = [otelcol.processor.filter.agents.input]
        }
      }

      // Raw request/response bodies, if a user turns OTEL_LOG_RAW_API_BODIES
      // on for themselves. Whole conversations — dropped as a class.
      otelcol.processor.filter "agents" {
        error_mode = "ignore"
        logs {
          // Matched by suffix: the docs give the event id as
          // claude_code.api_request_body but the attribute as
          // "api_request_body", and this drops both.
          log_record = [
            `IsMatch(attributes["event.name"], "api_(request|response)_body$")`,
          ]
        }
        output {
          logs = [otelcol.processor.transform.agents.input]
        }
      }

      // What may be kept. The managed settings bind only Claude Code launched
      // with them; this binds anything that can reach the port.
      otelcol.processor.transform "agents" {
        error_mode = "ignore"

        // The user's model-provider account. OTEL_RESOURCE_ATTRIBUTES already
        // carries the AF username, which is what everything else joins on —
        // and resource_to_telemetry_conversion below would make labels of
        // whatever survives.
        metric_statements {
          context = "resource"
          statements = [
            `delete_key(attributes, "user.email")`,
            `delete_key(attributes, "user.account_uuid")`,
            `delete_key(attributes, "user.account_id")`,
          ]
        }
        metric_statements {
          context = "datapoint"
          statements = [
            `delete_key(attributes, "user.email")`,
            `delete_key(attributes, "user.account_uuid")`,
            `delete_key(attributes, "user.account_id")`,
          ]
        }
        log_statements {
          context = "resource"
          statements = [
            `delete_key(attributes, "user.email")`,
            `delete_key(attributes, "user.account_uuid")`,
            `delete_key(attributes, "user.account_id")`,
          ]
        }
        log_statements {
          context = "log"
          statements = [
            `delete_key(attributes, "prompt")`,
            `delete_key(attributes, "response")`,
            // tool_parameters survives only for MCP tools, where it carries
            // mcp_server_name/mcp_tool_name — the reason OTEL_LOG_TOOL_DETAILS
            // is on. Elsewhere it is the command line and the file content.
            `delete_key(attributes, "tool_input")`,
            `delete_key(attributes, "tool_parameters") where attributes["tool_name"] == nil`,
            `delete_key(attributes, "tool_parameters") where not IsMatch(attributes["tool_name"], "^mcp__")`,
            `delete_key(attributes, "error") where not IsMatch(attributes["tool_name"], "^mcp__")`,
          ]
        }

        output {
          metrics = [otelcol.processor.batch.agents.input]
          logs    = [otelcol.processor.batch.agents.input]
        }
      }

      otelcol.processor.batch "agents" {
        output {
          metrics = [otelcol.exporter.prometheus.agents.input]
          logs    = [otelcol.exporter.otlphttp.agents.input]
        }
      }

      otelcol.exporter.prometheus "agents" {
        // claude_code_token_usage, not claude_code_token_usage_tokens_total.
        add_metric_suffixes = false
        // Without this the AF username, which arrives as a resource
        // attribute, never becomes a label. Safe only because the transform
        // above already dropped the attributes that must not become one.
        resource_to_telemetry_conversion = true
        include_target_info = false
        include_scope_info  = false
        forward_to = [prometheus.remote_write.agents.receiver]
      }

      prometheus.remote_write "agents" {
        endpoint {
          // Already runs with --web.enable-remote-write-receiver.
          url = "http://prometheus-server.cms.svc.cluster.local:9090/api/v1/write"
        }
      }

      otelcol.exporter.otlphttp "agents" {
        client {
          // Loki 3 ingests OTLP natively; the exporter appends /v1/logs.
          endpoint = "http://loki.cms.svc.cluster.local:3100/otlp"
        }
      }

      // eBPF profiling removed due to cluster policy; Alloy is used only for logs
