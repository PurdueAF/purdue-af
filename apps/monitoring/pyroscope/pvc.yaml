apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyroscope-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: pyroscope
spec:
  storageClassName: ${singlenode_storage_class}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi
