pyroscope:
  extraArgs:
    log.level: warn

  podAnnotations:
    profiles.grafana.com/memory.scrape: "false"
    profiles.grafana.com/cpu.scrape: "false"
    profiles.grafana.com/goroutine.scrape: "false"

  resources:
    limits:
      cpu: 2
      memory: 16Gi
    requests:
      cpu: 1
      memory: 8Gi

  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

  config: |
    limits:
      max_query_length: 30d

alloy:
  enabled: false

# Every Pyroscope route is unauthenticated, so Pyroscope has no ingress; clients use the Service.
ingress:
  enabled: false
