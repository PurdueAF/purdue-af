pyroscope:
  extraArgs:
    log.level: warn

  podAnnotations:
    profiles.grafana.com/memory.scrape: "false"
    profiles.grafana.com/cpu.scrape: "false"
    profiles.grafana.com/goroutine.scrape: "false"

  resources:
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 4
      memory: 8Gi

  persistence:
    enabled: true
    existingClaim: pyroscope-data

  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

  config: |
    server:
      http_server_write_timeout: 5m
    query_backend:
      client_timeout: 5m
    limits:
      max_query_length: 30d
      retention_period: 7d

alloy:
  enabled: false

# Every Pyroscope route is unauthenticated, so Pyroscope has no ingress; clients use the Service.
ingress:
  enabled: false
