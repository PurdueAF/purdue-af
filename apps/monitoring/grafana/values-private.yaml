# Admin-only instance: anonymous access is disabled.

ingress:
  path: /grafana-private
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

grafana.ini:
  server:
    root_url: https://cms.geddes.rcac.purdue.edu/grafana-private/
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/private/users-overview.json
  auth.anonymous:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "private"
        folder: "Private Dashboards"
        type: file
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/private

dashboardsConfigMaps:
  private: grafana-private-dashboards

# Shared datasources are in datasources.yaml; these are on this instance only (values.yaml says why).
datasources:
  private-datasources.yaml:
    apiVersion: 1
    datasources:
      - name: prometheus-hammer
        uid: prometheus-hammer
        type: prometheus
        url: http://grafana.cms.rcac.purdue.edu:9090
        access: proxy
      # uid pinned: pyroscope.json references it by uid.
      - name: pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        url: http://pyroscope.cms.svc.cluster.local:4040
        jsonData:
          minStep: 15s
          # Seconds; the ingress read timeout and Pyroscope's query timeouts must not be shorter.
          timeout: 300
      - name: loki
        uid: loki
        type: loki
        url: http://loki.cms.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000
