# Admin-only instance: anonymous access is disabled.

# RWO block storage: SQLite needs file locks CephFS cannot provide.
persistence:
  enabled: true
  type: pvc
  size: 20Gi
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: ${enable_ingresses}
  ingressClassName: public
  path: /grafana-private
  pathType: Prefix
  hosts:
    - cms.geddes.rcac.purdue.edu

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
  fsGroupChangePolicy: OnRootMismatch

# Disable init chown; rely on fsGroup on RBD
initChownData:
  enabled: false

extraVolumes:
  - name: grafana-png-tmp
    emptyDir: {}
  - name: grafana-pdf-tmp
    emptyDir: {}
  - name: grafana-csv-tmp
    emptyDir: {}

extraVolumeMounts:
  - name: grafana-png-tmp
    mountPath: /var/lib/grafana/png
  - name: grafana-pdf-tmp
    mountPath: /var/lib/grafana/pdf
  - name: grafana-csv-tmp
    mountPath: /var/lib/grafana/csv

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# RWO + SQLite: never run two pods against the same DB.
deploymentStrategy:
  type: Recreate

grafana.ini:
  server:
    root_url: https://cms.geddes.rcac.purdue.edu/grafana-private/
    serve_from_sub_path: true
  database:
    wal: true
    query_retries: 10
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/private/users-overview.json
  auth.anonymous:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "private"
        orgId: 1
        folder: "Private Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/private

dashboardsConfigMaps:
  private: grafana-private-dashboards

# Datasources come from the shared datasources.yaml; no plugins on this instance.

nodeSelector:
  cms-af-prod: "true"
tolerations:
  - key: "hub.jupyter.org/dedicated"
    operator: "Equal"
    value: "cms-af"
    effect: "NoSchedule"
