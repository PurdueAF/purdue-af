# Admin-only instance: anonymous access is disabled.

# RWO block storage: SQLite needs file locks CephFS cannot provide.
persistence:
  enabled: true
  type: pvc
  size: 20Gi
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: ${enable_ingresses}
  ingressClassName: public
  path: /grafana-private
  pathType: Prefix
  hosts:
    - cms.geddes.rcac.purdue.edu

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
  fsGroupChangePolicy: OnRootMismatch

# Disable init chown; rely on fsGroup on RBD
initChownData:
  enabled: false

extraVolumes:
  - name: grafana-png-tmp
    emptyDir: {}
  - name: grafana-pdf-tmp
    emptyDir: {}
  - name: grafana-csv-tmp
    emptyDir: {}

extraVolumeMounts:
  - name: grafana-png-tmp
    mountPath: /var/lib/grafana/png
  - name: grafana-pdf-tmp
    mountPath: /var/lib/grafana/pdf
  - name: grafana-csv-tmp
    mountPath: /var/lib/grafana/csv

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# RWO + SQLite: never run two pods against the same DB.
deploymentStrategy:
  type: Recreate

grafana.ini:
  server:
    root_url: https://cms.geddes.rcac.purdue.edu/grafana-private/
    serve_from_sub_path: true
  database:
    wal: true
    query_retries: 10
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/private/users-overview.json
  auth.anonymous:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "private"
        orgId: 1
        folder: "Private Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/private

dashboardsConfigMaps:
  private: grafana-private-dashboards

# No plugins on this instance.

# Shared datasources are in datasources.yaml; these are on this instance only (values.yaml says why).
datasources:
  private-datasources.yaml:
    apiVersion: 1
    # Delete-then-re-add is how a uid changes: .claude/rules/dashboards.md.
    deleteDatasources:
      - name: pyroscope
        orgId: 1
    datasources:
      - name: prometheus-hammer
        uid: prometheus-hammer
        type: prometheus
        url: http://grafana.cms.rcac.purdue.edu:9090
        access: proxy
        isDefault: false
      - name: tempo
        uid: tempo
        type: tempo
        url: http://tempo.cms.svc.cluster.local:3100
        access: proxy
        isDefault: false
        basicAuth: false
        jsonData:
          httpMethod: GET
          timeInterval: 5s
          tlsSkipVerify: true
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus
          tracesToMetrics:
            datasourceUid: prometheus
          tracesToLogs:
            datasourceUid: loki
      # uid pinned: pyroscope.json references it by uid.
      - name: pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        url: http://pyroscope.cms.svc.cluster.local:4040
        jsonData:
          minStep: 15s
      - name: loki
        uid: loki
        type: loki
        url: http://loki.cms.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000

nodeSelector:
  cms-af-prod: "true"
tolerations:
  - key: "hub.jupyter.org/dedicated"
    operator: "Equal"
    value: "cms-af"
    effect: "NoSchedule"
