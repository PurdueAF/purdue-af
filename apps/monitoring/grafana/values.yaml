# Anonymous-viewer instance; admin-only dashboards live in values-private.yaml.

# RWO block storage: SQLite needs file locks CephFS cannot provide.
persistence:
  enabled: true
  type: pvc
  size: 20Gi
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce

ingress:
  enabled: ${enable_ingresses}
  ingressClassName: public
  path: /grafana
  pathType: Prefix
  hosts:
    - cms.geddes.rcac.purdue.edu

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
  fsGroupChangePolicy: OnRootMismatch

# Disable init chown; rely on fsGroup on RBD
initChownData:
  enabled: false

# Plugins live on the PVC so they are not reinstalled into SQLite on every restart.
extraVolumes:
  - name: grafana-png-tmp
    emptyDir: {}
  - name: grafana-pdf-tmp
    emptyDir: {}
  - name: grafana-csv-tmp
    emptyDir: {}
  # TRANSITIONAL: backs the private-dashboards cleanup provider.
  - name: private-dashboards-cleanup
    emptyDir: {}
  - name: work
    existingClaim: af-shared-storage
  - name: announcements-nginx-conf
    configMap:
      name: announcements-nginx-conf
      items:
        - key: default.conf
          path: default.conf

extraVolumeMounts:
  - name: grafana-png-tmp
    mountPath: /var/lib/grafana/png
  - name: grafana-pdf-tmp
    mountPath: /var/lib/grafana/pdf
  - name: grafana-csv-tmp
    mountPath: /var/lib/grafana/csv
  - name: private-dashboards-cleanup
    mountPath: /var/lib/grafana/dashboards/private
  - name: work
    mountPath: /work/
    mountPropagation: HostToContainer
    readOnly: true

# TRANSITIONAL: removes plugins dropped from the list, which stay installed on the PVC.
extraInitContainers:
  - name: remove-unused-plugins
    image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/busybox:1.36
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - >-
        rm -rf /var/lib/grafana/plugins/grafana-llm-app
        /var/lib/grafana/plugins/grafana-pyroscope-app
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
      - name: storage
        mountPath: /var/lib/grafana

extraContainers: |
  - name: announcements-server
    image: geddes-registry.rcac.purdue.edu/docker-hub-cache/nginxinc/nginx-unprivileged:alpine
    ports:
      - containerPort: 8080
    volumeMounts:
      - name: work
        mountPath: /work/
        mountPropagation: HostToContainer
        readOnly: true
      - name: announcements-nginx-conf
        mountPath: /etc/nginx/conf.d
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

resources:
  requests:
    cpu: 4000m
    memory: 8Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# RWO + SQLite: never run two pods against the same DB.
deploymentStrategy:
  type: Recreate

grafana.ini:
  server:
    root_url: https://cms.geddes.rcac.purdue.edu/grafana/
    serve_from_sub_path: true
  database:
    wal: true
    query_retries: 10
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/public/default.json
  auth.anonymous:
    enabled: true
    org_name: "Main Org."
    org_role: Viewer
    hide_version: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "public"
        orgId: 1
        folder: "Public Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/public
      # TRANSITIONAL: an empty dir makes Grafana delete the private dashboards it provisioned here.
      - name: "private"
        orgId: 1
        folder: "Private Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/private

dashboardsConfigMaps:
  public: grafana-public-dashboards

# Shared datasources are in datasources.yaml; this distinct filename survives the values merge.
datasources:
  infinity-datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        uid: infinity
        access: proxy
        editable: false
        jsonData:
          allowedHosts:
            - "http://localhost:8080"

plugins:
  - marcusolsson-dynamictext-panel
  - yesoreyeram-infinity-datasource

nodeSelector:
  cms-af-prod: "true"
tolerations:
  - key: "hub.jupyter.org/dedicated"
    operator: "Equal"
    value: "cms-af"
    effect: "NoSchedule"
