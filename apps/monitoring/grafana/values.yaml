# Grafana Helm Chart Values — public instance (grafana)
# https://github.com/grafana/helm-charts/tree/main/charts/grafana
#
# Anonymous-viewer instance serving the public dashboards; private
# dashboards live in the admin-only grafana-private instance
# (values-private.yaml).

# Persistence: RWO block storage for SQLite. CephFS/RWX cannot reliably
# provide the file locks SQLite needs and caused recurring CrashLoopBackOff
# (database is locked / hung /api/health probes).
persistence:
  enabled: true
  type: pvc
  size: 20Gi
  storageClassName: ${singlenode_storage_class}
  accessModes:
    - ReadWriteOnce

# Ingress configuration
ingress:
  enabled: ${enable_ingresses}
  ingressClassName: public
  path: /grafana
  pathType: Prefix
  hosts:
    - cms.geddes.rcac.purdue.edu
  # tls:
  #   - secretName: grafana-tls
  #     hosts:
  #       - cms.geddes.rcac.purdue.edu

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
  fsGroupChangePolicy: OnRootMismatch

# Disable init chown; rely on fsGroup on RBD
initChownData:
  enabled: false

# Temp dirs stay on emptyDir. Plugins live on the RWO PVC so they are not
# reinstalled (and rewritten into SQLite) on every restart.
extraVolumes:
  - name: grafana-png-tmp
    emptyDir: {}
  - name: grafana-pdf-tmp
    emptyDir: {}
  - name: grafana-csv-tmp
    emptyDir: {}
  # TRANSITIONAL — empty dir backing the private-dashboards cleanup
  # provider (see dashboardProviders); remove together with it.
  - name: private-dashboards-cleanup
    emptyDir: {}
  - name: work
    existingClaim: af-shared-storage
  - name: announcements-nginx-conf
    configMap:
      name: announcements-nginx-conf
      items:
        - key: default.conf
          path: default.conf

extraVolumeMounts:
  - name: grafana-png-tmp
    mountPath: /var/lib/grafana/png
  - name: grafana-pdf-tmp
    mountPath: /var/lib/grafana/pdf
  - name: grafana-csv-tmp
    mountPath: /var/lib/grafana/csv
  - name: private-dashboards-cleanup
    mountPath: /var/lib/grafana/dashboards/private
  - name: work
    mountPath: /work/
    mountPropagation: HostToContainer
    readOnly: true

# Add an init container that sets permissive mode on the PVC root without chown
# extraInitContainers:
#   - name: init-chmod-data
#     image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/busybox:1.36
#     imagePullPolicy: IfNotPresent
#     command:
#       - sh
#       - -c
#       - >-
#         mkdir -p /var/lib/grafana &&
#         chmod -R 0777 /var/lib/grafana || true &&
#         ls -ld /var/lib/grafana || true
#     securityContext:
#       runAsUser: 0
#       runAsNonRoot: false
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#       seccompProfile:
#         type: RuntimeDefault
#     resources:
#       requests:
#         cpu: 50m
#         memory: 64Mi
#       limits:
#         cpu: 200m
#         memory: 128Mi
#     volumeMounts:
#       - name: storage
#         mountPath: /var/lib/grafana

extraContainers: |
  - name: announcements-server
    image: geddes-registry.rcac.purdue.edu/docker-hub-cache/nginxinc/nginx-unprivileged:alpine
    ports:
      - containerPort: 8080
    volumeMounts:
      - name: work
        mountPath: /work/
        mountPropagation: HostToContainer
        readOnly: true
      - name: announcements-nginx-conf
        mountPath: /etc/nginx/conf.d
        readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

# Resources
resources:
  requests:
    cpu: 4000m
    memory: 8Gi
  limits:
    cpu: 4000m
    memory: 8Gi

# RWO + SQLite: never run two pods against the same DB.
deploymentStrategy:
  type: Recreate

# Grafana configuration
grafana.ini:
  server:
    root_url: https://cms.geddes.rcac.purdue.edu/grafana/
    serve_from_sub_path: true
  database:
    wal: true
    query_retries: 10
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/public/default.json
  auth.anonymous:
    enabled: true
    org_name: "Main Org."
    org_role: Viewer
    hide_version: true

# Dashboard and datasource provisioning
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "public"
        orgId: 1
        folder: "Public Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/public
      # TRANSITIONAL — remove after this has deployed once. The private
      # dashboards moved to the grafana-private instance, but dashboards
      # already provisioned into this instance's database are not removed
      # by simply dropping their provider. Keeping the provider pointed at
      # an empty directory (emptyDir below) makes Grafana's sync delete
      # them (disableDeletion: false). Afterwards this provider and the
      # private-dashboards-cleanup volume can be deleted; the leftover
      # empty "Private Dashboards" folder can be removed in the UI.
      - name: "private"
        orgId: 1
        folder: "Private Dashboards"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/private

# Use ConfigMap for dashboards
dashboardsConfigMaps:
  public: grafana-public-dashboards

# Shared datasources come from datasources.yaml (second valuesFrom entry
# on the HelmRelease); only public-instance-specific ones live here, under
# a distinct provisioning filename so the values merge keeps both.
datasources:
  infinity-datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Infinity
        type: yesoreyeram-infinity-datasource
        uid: infinity
        access: proxy
        editable: false
        jsonData:
          allowedHosts:
            - "http://localhost:8080"

plugins:
  - marcusolsson-dynamictext-panel
  - yesoreyeram-infinity-datasource
