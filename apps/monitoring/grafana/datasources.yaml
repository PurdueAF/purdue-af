# Merged into both instances by a second valuesFrom entry on each HelmRelease.
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      # thanos is not deployed; remove its provisioned row.
      - name: thanos
        orgId: 1
    datasources:
      - name: prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server:9090
        access: proxy
        isDefault: true
      - name: prometheus-rancher
        uid: prometheus-rancher
        type: prometheus
        url: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
        access: proxy
        isDefault: false
