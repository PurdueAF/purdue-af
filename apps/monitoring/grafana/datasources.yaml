# The last valuesFrom entry on each HelmRelease.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server:9090
        access: proxy
        isDefault: true
      - name: prometheus-rancher
        uid: prometheus-rancher
        type: prometheus
        url: http://rancher-monitoring-prometheus.cattle-monitoring-system:9090
        access: proxy
      # NRP Nautilus's public Prometheus, for Ray jobs that run there (../../ray-train/README.md).
      - name: prometheus-nrp
        uid: prometheus-nrp
        type: prometheus
        url: https://prometheus.nrp-nautilus.io
        access: proxy
