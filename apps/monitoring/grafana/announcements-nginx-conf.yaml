apiVersion: v1
kind: ConfigMap
metadata:
  name: announcements-nginx-conf
  namespace: cms
data:
  default.conf: |
    server {
      listen 8080;
      # Anonymous viewers can point the Infinity datasource at any path here.
      location = /announcements.json {
        root /work/projects/purdue-af;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }
      location / {
        return 404;
      }
    }
