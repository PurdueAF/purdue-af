apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: af-node-monitor-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
# Finds each probe pod's IP to pull its result, and tells "no probe running"
# from "mount never answered".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: af-node-monitor-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-node-monitor
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: af-node-monitor-rb
subjects:
  - kind: ServiceAccount
    name: af-node-monitor
    namespace: cms
roleRef:
  kind: ClusterRole
  name: af-node-monitor-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: af-node-monitor-pods
subjects:
  - kind: ServiceAccount
    name: af-node-monitor
roleRef:
  kind: Role
  name: af-node-monitor-pods
  apiGroup: rbac.authorization.k8s.io
