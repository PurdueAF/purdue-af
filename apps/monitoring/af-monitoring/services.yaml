# Scraped by AF Prometheus via the dedicated `af-node-monitor` static job
# (apps/monitoring/prometheus/values.yaml). scrape-metrics keeps Rancher
# Prometheus in the loop; AF's af-pod-monitor job drops this Service so mount
# metrics are not tagged with the Deployment host (pod_node).
apiVersion: v1
kind: Service
metadata:
  name: af-node-monitor-service
  labels:
    scrape-metrics: "true"
spec:
  selector:
    name: af-node-monitor
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
