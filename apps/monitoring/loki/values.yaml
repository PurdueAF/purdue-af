deploymentMode: SingleBinary

singleBinary:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    port: 3100
    annotations: {}
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
  persistence:
    enabled: true
    accessModes: ["ReadWriteOnce"]
    # DRIFT: the live PVC is 100Gi; raise this only with enableStatefulSetRecreationForSizeChange: true.
    size: 50Gi
    # The chart key is storageClass; unset keeps the default class the live PVC is on.
    # The chart defaults both PVC retention policies to Delete; this is the only copy of the logs.
    enableStatefulSetAutoDeletePVC: false
    annotations: {}
    mountPath: /var/loki
  # Free bytes of the Loki PVC, which node-exporter and kubelet stats do not expose here.
  extraContainers:
    - name: fs-exporter
      image: geddes-registry.rcac.purdue.edu/docker-hub-cache/prom/node-exporter:v1.8.2
      args:
        - --collector.disable-defaults
        - --collector.filesystem
        # No mount-points-include flag exists; excluding the node bind mounts leaves /var/loki.
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|etc|run|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --web.listen-address=:9101
      ports:
        - name: fs-metrics
          containerPort: 9101
          protocol: TCP
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        # Same PVC as the loki container; statfs only, never written to.
        - name: storage
          mountPath: /var/loki
          readOnly: true

# IMPORTANT: keep config as empty string so the legacy templated path is inert
loki:
  config: ""
  auth_enabled: false
  commonConfig: null

  # Required by the chart validator even for filesystem storage.
  storage:
    bucketNames:
      chunks: loki-chunks-placeholder
      ruler: loki-ruler-placeholder
      admin: loki-admin-placeholder
    type: filesystem
    filesystem: {}

  pattern_ingester:
    enabled: false
  ui:
    enabled: true

  structuredConfig:
    auth_enabled: false

    ui:
      enabled: true

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      ring:
        kvstore:
          store: memberlist

    memberlist:
      abort_if_cluster_join_fails: false
      join_members: []

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
        cache_ttl: 24h
        query_ready_num_days: 0
      filesystem:
        directory: /var/loki/chunks

    ingester:
      wal:
        dir: /var/loki/wal
      lifecycler:
        ring:
          replication_factor: 1

    limits_config:
      allow_structured_metadata: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_length: 0h
      max_query_parallelism: 32
      max_streams_per_user: 0
      max_line_size: 256KB
      max_line_size_truncate: false
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB
      volume_enabled: true

      # Required: retention_period defaults to 0s (keep forever), so retention_enabled alone deletes nothing.
      retention_period: 720h

    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: filesystem
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

gateway:
  enabled: false

# Every Loki route is unauthenticated (auth_enabled: false), so Loki has no ingress; clients use the Service.
ingress:
  enabled: false

# Turn off the ruler so those placeholder buckets are never used
ruler:
  enabled: false

read:
  enabled: false
  replicas: 0
write:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0

lokiCanary:
  enabled: false

# The rules sidecar fsnotify watchers add to node inotify exhaustion.
sidecar:
  rules:
    enabled: false

chunksCache:
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

resultsCache:
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

memcachedExporter:
  image:
    repository: geddes-registry.rcac.purdue.edu/docker-hub-cache/prom/memcached-exporter
    tag: v0.15.3

test:
  enabled: false
