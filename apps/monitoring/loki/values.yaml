deploymentMode: Monolithic

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  persistence:
    enabled: true
    accessModes: ["ReadWriteOnce"]
    # DRIFT: the live PVC is 100Gi; raise this only with singleBinary.statefulSetRecreateJob.enabled: true.
    size: 50Gi
    # The chart key is storageClass; unset keeps the default class the live PVC is on.
    # The chart defaults both PVC retention policies to Delete; this is the only copy of the logs.
    enableStatefulSetAutoDeletePVC: false
  # Free bytes of the Loki PVC, which node-exporter and kubelet stats do not expose here.
  extraContainers:
    - name: fs-exporter
      image: geddes-registry.rcac.purdue.edu/docker-hub-cache/prom/node-exporter:v1.12.1
      args:
        - --collector.disable-defaults
        - --collector.filesystem
        # No mount-points-include flag exists; excluding the node bind mounts leaves /var/loki.
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|etc|run|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
        - --web.listen-address=:9101
      ports:
        - name: fs-metrics
          containerPort: 9101
          protocol: TCP
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        # Same PVC as the loki container; statfs only, never written to.
        - name: storage
          mountPath: /var/loki
          readOnly: true

loki:
  # Empty: structuredConfig below is the whole Loki configuration.
  config: ""
  storage:
    type: filesystem
  ui:
    enabled: true

  structuredConfig:
    auth_enabled: false

    ui:
      enabled: true

    server:
      log_level: warn

    common:
      ring:
        kvstore:
          store: memberlist

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache
      filesystem:
        directory: /var/loki/chunks

    ingester:
      wal:
        dir: /var/loki/wal
      lifecycler:
        ring:
          replication_factor: 1

    limits_config:
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_length: 0h

      # Required: retention_period defaults to 0s (keep forever), so retention_enabled alone deletes nothing.
      retention_period: 720h

    # Cached in-process: the embedded cache is the default results_cache backend.
    query_range:
      cache_results: true

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

gateway:
  enabled: false

# Every Loki route is unauthenticated (auth_enabled: false), so Loki has no ingress; clients use the Service.
ingress:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

lokiCanary:
  enabled: false

# The rules sidecar fsnotify watchers add to node inotify exhaustion.
sidecar:
  rules:
    enabled: false

# Loki reads its configuration from structuredConfig alone, which names no memcached.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

test:
  enabled: false
