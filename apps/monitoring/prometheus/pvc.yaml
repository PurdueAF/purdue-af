apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  labels:
    app: prometheus
spec:
  # RWO block (RBD): CephFS stalls during WAL/compaction freeze the process.
  storageClassName: ${singlenode_storage_class}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 40Gi
