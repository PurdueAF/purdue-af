rbac:
  create: false

serviceAccounts:
  server:
    create: false
    name: prometheus-sa
    automountServiceAccountToken: true

configmapReload:
  prometheus:
    enabled: false

server:
  automountServiceAccountToken: true
  image:
    repository: geddes-registry.rcac.purdue.edu/docker-hub-cache/prom/prometheus
  useExistingClusterRoleName: prometheus-sa-role
  releaseNamespace: true
  configPath: /etc/config/prometheus.yml
  storagePath: /prometheus

  global:
    # Must stay below scrape_interval, or scrapes pile up and starve the health probes.
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s

  # WAL replay and compaction can outlast the chart default probes (~75 s).
  startupProbe:
    enabled: true
    periodSeconds: 10
    failureThreshold: 60 # 10 min for Ceph WAL / mmap replay
    timeoutSeconds: 10
  livenessProbeInitialDelay: 60
  livenessProbePeriodSeconds: 30
  livenessProbeTimeout: 30
  livenessProbeFailureThreshold: 6 # ~3 min unresponsive before kill
  readinessProbeInitialDelay: 30
  readinessProbePeriodSeconds: 10
  readinessProbeTimeout: 10
  readinessProbeFailureThreshold: 6

  extraFlags:
    - web.enable-remote-write-receiver
    - query.timeout=2m
    - query.max-concurrency=20
    - storage.tsdb.wal-compression
    # serverFiles changes do not roll the pod; the server polls its config files for them.
    - config.auto-reload
  # Non-recursive: chmod -R walks every TSDB inode and can hang Init for minutes.
  extraInitContainers:
    - name: prometheus-data-permission-fix
      image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/busybox:1.36
      command: ["/bin/sh", "-c", "chmod 777 /prometheus"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage-volume
          mountPath: /prometheus

  ingress:
    enabled: false
    hosts: [prometheus-af.geddes.rcac.purdue.edu]
    tls:
      - hosts: [prometheus-af.geddes.rcac.purdue.edu]
    ingressClassName: public

  # Recreate: the RWO PVC and TSDB lock rule out a second pod.
  strategy:
    type: Recreate

  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

  nodeSelector:
    cms-af-prod: "true"

  persistentVolume:
    enabled: true
    existingClaim: prometheus-data-pvc
    mountPath: /prometheus

  resources:
    requests:
      cpu: 4
      memory: 8Gi
    limits:
      cpu: 4
      memory: 8Gi

  service:
    enabled: true
    type: LoadBalancer
    servicePort: 9090
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

  alertmanagers:
    - static_configs:
        - targets:
            - prometheus-alertmanager.cms.svc.cluster.local:9093

  retention: 30d
  retentionSize: 30GB

# The chart default k8s jobs need cluster-scoped RBAC prometheus-sa lacks; keep only self-scrape.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false

serverFiles:
  prometheus.yml:
    scrape_configs:
      # The scrape-metrics ServiceMonitor feeds Rancher Prometheus, not this server.
      - job_name: "pixi-global-sync"
        static_configs:
          - targets:
              - "pixi-global-sync:9099"
      # honor_labels keeps the job label the workflow pushed.
      - job_name: "self-repair"
        honor_labels: true
        static_configs:
          - targets:
              - "prometheus-prometheus-pushgateway:9091"
      - job_name: "jupyterhub"
        metrics_path: "/hub/metrics"
        static_configs:
          - targets:
              - "cms.geddes.rcac.purdue.edu"
      - job_name: "kube-state-metrics"
        honor_timestamps: false
        static_configs:
          - targets:
              - "rancher-monitoring-kube-state-metrics.cattle-monitoring-system.svc.cluster.local:8080"
        # Rancher KSM is cluster-scoped; keep cms and namespace-less series only.
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: "(|cms)"
            action: keep
      - job_name: "slurm-metrics"
        static_configs:
          - targets:
              - "hammer-osg.rcac.purdue.edu:9100"
      # Rancher's node-exporter on every node tainted hub.jupyter.org/dedicated=cms-af.
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - "a337.gautschi.rcac.purdue.edu:9796"
              - "geddes-b004.rcac.purdue.edu:9796"
              - "geddes-b011.rcac.purdue.edu:9796"
              - "geddes-b013.rcac.purdue.edu:9796"
              - "geddes-b014.rcac.purdue.edu:9796"
              - "geddes-b015.rcac.purdue.edu:9796"
              - "geddes-g000.rcac.purdue.edu:9796"
              - "geddes-g001.rcac.purdue.edu:9796"
              - "geddes-g002.rcac.purdue.edu:9796"
              - "paf-a00.cms.rcac.purdue.edu:9796"
              - "paf-a01.cms.rcac.purdue.edu:9796"
              - "paf-a02.cms.rcac.purdue.edu:9796"
              - "paf-b00.cms.rcac.purdue.edu:9796"
              - "paf-b01.cms.rcac.purdue.edu:9796"
              - "paf-d00.cms.rcac.purdue.edu:9796"
              - "paf-d01.cms.rcac.purdue.edu:9796"
              - "paf-e00.cms.rcac.purdue.edu:9796"
              - "paf-e01.cms.rcac.purdue.edu:9796"
      # Scraped directly: via af-pod-monitor, pod_node would carry the Deployment host.
      - job_name: "af-node-monitor"
        static_configs:
          - targets:
              - "af-node-monitor-service:8000"
      - job_name: "af-pod-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_endpoint_address_target_ip]
            target_label: "ip"
          - source_labels: [__meta_kubernetes_pod_label_username_unescaped]
            target_label: "username"
          - source_labels: [__meta_kubernetes_pod_label_docker_image_tag]
            target_label: "docker_image_tag"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          # Not "node": af-node-monitor owns that label.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels: [__meta_kubernetes_service_label_scrape_metrics]
            action: keep
            regex: "true"
          # Dedicated static jobs own these Services.
          - source_labels: [__meta_kubernetes_service_name]
            regex: "pixi-global-sync|af-node-monitor-service"
            action: drop
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: "^chp$"
            action: drop
          - source_labels: [__address__]
            regex: ".*:(8888|8889)$"
            action: drop
      # Pod SD, not the Service: a full disk makes Loki unready and drops it from Endpoints.
      - job_name: "loki"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          # Excludes the memcached cache pods, which share app.kubernetes.io/name=loki.
          - source_labels:
              [
                __meta_kubernetes_pod_label_app_kubernetes_io_component,
                __meta_kubernetes_pod_container_port_number,
              ]
            action: keep
            regex: "single-binary;(3100|9101)"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
      - job_name: "envoy-monitor"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: "app"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_username_unescaped]
            target_label: "username"
          - source_labels: [__meta_kubernetes_pod_label_docker_image_tag]
            target_label: "docker_image_tag"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels: [__meta_kubernetes_service_label_envoy]
            action: keep
            regex: "true"
      - job_name: "dask-gateway-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: "app"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_user]
            target_label: "user"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: dask-gateway
          - source_labels: [__address__]
            regex: ".*:(80|8000|8786|8788)$"
            action: drop
      - job_name: "supersonic-monitor-envoy"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: supersonic
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: envoy
      - job_name: "seldon-monitor-envoy"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: seldon-envoy
  # Figures of merit for the supersonic / supersonic-pr scaling-metric A/B.
  recording_rules.yml:
    groups:
      - name: sonic-scaling-fom
        interval: 15s
        rules:
          - record: sonic:replicas_desired
            expr: |-
              max by (release) (
                label_replace(
                  kube_deployment_spec_replicas{namespace="cms", deployment=~"supersonic.*-triton"},
                  "release", "$1", "deployment", "(.*)-triton"
                )
              )
          - record: sonic:replicas_ready
            expr: |-
              max by (release) (
                label_replace(
                  kube_deployment_status_replicas_ready{namespace="cms", deployment=~"supersonic.*-triton"},
                  "release", "$1", "deployment", "(.*)-triton"
                )
              )
          # Above zero means the run is measuring GPU supply, not the metric.
          - record: sonic:capacity_shortfall
            expr: sonic:replicas_desired - sonic:replicas_ready
          - record: sonic:scale_actions:changes10m
            expr: |-
              max by (release) (
                label_replace(
                  changes(kube_deployment_spec_replicas{namespace="cms", deployment=~"supersonic.*-triton"}[10m]),
                  "release", "$1", "deployment", "(.*)-triton"
                )
              )
          - record: sonic:throughput_inferences:rate30s
            expr: sum by (release) (rate(nv_inference_count[30s]))
          - record: sonic:throughput_requests:rate30s
            expr: |-
              sum by (release) (
                rate(envoy_cluster_upstream_rq_total{envoy_cluster_name="triton_grpc_service"}[30s])
              )
          - record: sonic:latency_envoy_mean_ms
            expr: |-
              sum by (release) (rate(envoy_cluster_upstream_rq_time_sum{envoy_cluster_name="triton_grpc_service"}[30s]))
              / clamp_min(
                  sum by (release) (rate(envoy_cluster_upstream_rq_time_count{envoy_cluster_name="triton_grpc_service"}[30s])),
                  1
                )
          - record: sonic:latency_envoy_p95_ms
            expr: |-
              histogram_quantile(0.95,
                sum by (release, le) (
                  rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name="triton_grpc_service"}[30s])
                )
              )
          - record: sonic:queue_fraction
            expr: |-
              sum by (release) (rate(nv_inference_queue_duration_us[30s]))
              / clamp_min(sum by (release) (rate(nv_inference_request_duration_us[30s])), 1)
          - record: sonic:gpu_util_mean
            expr: avg by (release) (nv_gpu_utilization)
          - record: sonic:gpu_util_max
            expr: max by (release) (nv_gpu_utilization)

  alerting_rules.yml:
    groups:
      - name: af-pod-monitor
        rules:
          - alert: AFHomeDirUtilHigh
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.90
            for: 1m
            labels:
              severity: warning
              component: storage
            annotations:
              summary: High /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                Now is the time to contact the user and make sure they are aware of this.
          - alert: AFHomeDirUtilVeryHigh
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.95
            for: 1m
            labels:
              severity: error
              component: storage
            annotations:
              summary: Very high /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                User {{ $labels.username }} must delete files, or move to /work/ or /depot/ immediately.
          - alert: AFHomeDirUtilCritical
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.99
            for: 1m
            labels:
              severity: critical
              component: storage
            annotations:
              summary: Critical /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                By now they might not be able to use AF at all.
                The immediate solution is to increase quota for this user (PVC size) by 1 GB,
                and then ask them to clean up files immediately.
          - alert: AFGlobalEnvOutOfSync
            expr: pixi_global_sync_in_sync == 0
            for: 3h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: Global pixi env is not in sync with the repository
              description: |
                /work/pixi/global has not matched pixi/global/pixi.lock on main
                for 3 hours. Builds or validation are failing — users still have
                the previous (working) env, but it is going stale.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvUnhealthy
            expr: pixi_global_sync_env_healthy == 0
            for: 30m
            labels:
              severity: critical
              component: environment
            annotations:
              summary: Live global pixi env failed import verification
              description: |
                The deep verify of /work/pixi/global found packages that no
                longer import, and the self-heal rebuild has not recovered it.
                User sessions relying on the global env are likely broken.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvSyncDown
            expr: absent(pixi_global_sync_in_sync)
            for: 1h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync metrics are absent
              description: |
                No pixi_global_sync_* metrics for 1h — the reconciler pod is
                down or its Service/scrape wiring is broken. The global env is
                not being kept in sync while this persists.
          - alert: AFGlobalEnvDaemonStale
            # Metrics can still scrape while the loop is wedged.
            expr: time() - pixi_global_sync_loop_heartbeat_timestamp_seconds > 900
            for: 10m
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync heartbeat is stale
              description: |
                The reconciler loop has not refreshed its heartbeat for 15+
                minutes. Builds may be hung or the process wedged — the global
                env is not being reconciled.
                Check: kubectl logs deploy/pixi-global-sync

      # Can users get in? ---------------------------------------------------
      - name: af-access
        rules:
          # Scoped to this hub: the jupyterhub job is a static list shared with other hubs.
          - alert: AFHubDown
            expr: up{job="jupyterhub", instance="${jupyterhub_host}"} == 0
            for: 5m
            labels:
              severity: critical
              component: access
            annotations:
              summary: JupyterHub is not responding to scrapes
              description: >
                The hub has been unreachable for 5 minutes. Nobody can start,
                stop or reach a session while this is true.
                Check: kubectl -n cms get pods -l component=hub
          # Only `failure` is a fault; the GPU gate files its refusals there too, so subtract them.
          - alert: AFSpawnFailures
            expr: >
              clamp_min(
                sum(increase(jupyterhub_server_spawn_duration_seconds_count{status="failure"}[30m]))
                - sum(increase(purdue_af_hub_gpu_spawn_refused_total[30m])) or
                sum(increase(jupyterhub_server_spawn_duration_seconds_count{status="failure"}[30m])),
                0) > 3
            for: 5m
            labels:
              severity: error
              component: access
            annotations:
              summary: Multiple session spawns failed in the last 30 minutes
              description: >
                {{ printf "%.0f" $value }} spawn failures in 30 minutes — users are
                being turned away at login. Check the hub logs, and whether the
                singleuser image still pulls.
          # Sustained reason="reserved" means a reservation outlived its pod and blocks an idle GPU.
          - alert: AFGpuSpawnRefusedWithGpuFree
            expr: sum(increase(purdue_af_hub_gpu_spawn_refused_total{reason="reserved"}[30m])) > 3
            for: 10m
            labels:
              severity: warning
              component: compute
            annotations:
              summary: GPU spawns refused while GPUs were free
              description: >
                {{ printf "%.0f" $value }} GPU spawns refused in 30 minutes despite
                free GPUs — a spawn reservation is outliving its pod. Check the hub
                logs for "[gpu-availability] refused".
          - alert: AFSessionStuckPending
            expr: kube_pod_status_phase{namespace="cms",pod=~"purdue-af-.*",phase="Pending"} == 1
            for: 15m
            labels:
              severity: warning
              component: access
            annotations:
              summary: Session pod {{ $labels.pod }} has been Pending for 15m
              description: >
                A session pod cannot be scheduled — usually no node with the
                requested CPU/RAM/GPU, or a volume that will not bind.
                Check: kubectl -n cms describe pod {{ $labels.pod }}

      # Do users have worker capacity? -------------------------------------
      - name: af-compute
        rules:
          # Mount metrics are null on NotReady nodes, so a drain would otherwise look healthy.
          - alert: AFProdNodesNotReady
            expr: >
              (kube_node_status_condition{condition="Ready", status="true"} == 0)
              * on(node) group_left()
              kube_node_spec_taint{key="hub.jupyter.org/dedicated", value="cms-af"}
            for: 10m
            labels:
              severity: error
              component: compute
            annotations:
              summary: "AF worker node {{ $labels.node }} is NotReady"
              description: >
                Node {{ $labels.node }} has been NotReady for 10 minutes.
                Sessions and Dask workers cannot land there. If many nodes fire
                together, treat it as a site / power / network outage rather
                than a single machine fault.
                Check: kubectl get node {{ $labels.node }}

      # Can users read data? ------------------------------------------------
      - name: af-data
        rules:
          # fresh separates a failed check from one that never ran; mount blips stay warnings.
          - alert: AFMountInvalid
            expr: af_node_mount_valid{node_pool="prod"} == 0 and af_node_mount_result_fresh{node_pool="prod"} == 1
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is failing on node {{ $labels.node }}"
              description: >
                Data access check for {{ $labels.mount_name }} completed and
                failed for 10 minutes (includes timeouts). Sessions and Dask
                workers on this node may be unable to use that path. Storage
                outages are often transient; treat a widespread firing as a
                storage-system or network problem rather than a node problem.
                Check: kubectl -n cms logs -l app=af-node-monitor
          - alert: AFMountHealthUnknown
            expr: af_node_mount_result_fresh{node_pool="prod"} == 0
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "Data access unknown for {{ $labels.mount_name }} on node {{ $labels.node }}"
              description: >
                The node is Ready but no usable check result for 10 minutes
                (never reported, or last success went stale). Offline /
                NotReady nodes publish no series — they will not appear here.
                af_node_mount_probe_up says which side is broken: 0 means the
                probe pod is missing or not Ready, 1 means it runs and the
                mount is what is not answering.
                Check: kubectl -n cms get pods -l app=af-node-monitor,component=probe -o wide
          # The upper bound leaves timeouts to AFMountInvalid; avg_over_time spans about two checks.
          - alert: AFMountSlow
            expr: avg_over_time(af_node_mount_metadata_latency_ms{node_pool="prod"}[20m]) > 2000 and avg_over_time(af_node_mount_metadata_latency_ms{node_pool="prod"}[20m]) < 10000
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is slow on node {{ $labels.node }}"
              description: >
                20-minute average metadata latency is {{ printf "%.0f" $value }} ms
                against a healthy ceiling near 900 ms. Reads still work, but
                analyses on this node will crawl.
          - alert: AFNodeMonitorStale
            expr: >
              absent(af_node_monitor_last_iteration_timestamp_seconds)
              or time() - af_node_monitor_last_iteration_timestamp_seconds > 900
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: af-node-monitor has not completed a pass in 15 minutes
              description: >
                Mount health is unknown, which is not the same as good: every
                af_node_mount_* series is stale, so AFMountInvalid cannot fire.
                absent() covers the exporter being gone entirely — without it
                the comparison has no series to match and the alert that exists
                to catch a dead exporter goes quiet when one dies.
                Check: kubectl -n cms logs -l name=af-node-monitor
          # An unreadable results PVC nulls every af_node_mount_* series, which no mount alert matches.
          - alert: AFNodeMonitorResultsUnavailable
            expr: af_node_monitor_results_available == 0
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: af-node-monitor cannot read the probe results volume
              description: >
                The af-node-monitor-storage PVC is unreadable or wedged, so no
                mount health is being published at all and every mount alert is
                blind rather than green. The mounts themselves may be fine.
                Check: kubectl -n cms logs -l name=af-node-monitor

          # Dev nodes stay warnings, off the facility health verdict.
          - alert: AFMountInvalidDev
            expr: af_node_mount_valid{node_pool="dev"} == 0 and af_node_mount_result_fresh{node_pool="dev"} == 1
            for: 30m
            labels:
              severity: warning
              component: dev
            annotations:
              summary: "{{ $labels.mount_name }} is failing on dev node {{ $labels.node }}"
              description: >
                A mount check completed and failed on a cms-af-dev node. No user
                sessions run there, so this does not affect the facility.

      # Can users scale out? ------------------------------------------------
      - name: af-scale-out
        rules:
          - alert: AFDaskGatewayDown
            expr: kube_deployment_status_replicas_available{namespace="cms",deployment=~"api-dask-gateway.*"} == 0
            for: 10m
            labels:
              severity: error
              component: scale-out
            annotations:
              summary: Dask Gateway {{ $labels.deployment }} has no available replicas
              description: >
                Users cannot create or reach clusters on this gateway; already
                running clusters may survive.
                Check: kubectl -n cms get deploy {{ $labels.deployment }}

      # Can we still see what the facility is doing? -------------------------
      # node_filesystem_*{job="loki"} comes from the fs-exporter sidecar in loki/values.yaml.
      - name: af-observability
        rules:
          - alert: AFLokiStorageWillFill
            # Fires when the trend says the PVC fills within a week.
            expr: |
              predict_linear(
                node_filesystem_avail_bytes{job="loki",mountpoint="/var/loki"}[6h],
                7 * 24 * 3600
              ) < 0
            for: 1h
            labels:
              severity: warning
              component: observability
            annotations:
              summary: Loki PVC is on track to fill within 7 days
              description: >
                storage-loki-0 free space is trending to 0 inside a week. Expect
                the retention
                window (loki.structuredConfig.limits_config.retention_period) to
                no longer fit the current log volume — shorten it, or grow the
                PVC. Loki stops ingesting AND stops answering every query the
                moment this volume is full.
          - alert: AFLokiStorageAlmostFull
            expr: |
              1 - (
                node_filesystem_avail_bytes{job="loki",mountpoint="/var/loki"}
                / node_filesystem_size_bytes{job="loki",mountpoint="/var/loki"}
              ) > 0.90
            for: 10m
            labels:
              severity: error
              component: observability
            annotations:
              summary: Loki PVC is {{ $value | humanizePercentage }} full
              description: >
                Act now — at 100% Loki loses both ingest and query. The compactor
                needs free space to apply retention, so recovering from a full
                volume means growing the PVC first:
                kubectl -n cms patch pvc storage-loki-0 -p
                '{"spec":{"resources":{"requests":{"storage":"<bigger>Gi"}}}}'
          - alert: AFLokiStorageFull
            # Backstop for when the sidecar or its scrape is what broke.
            expr: increase(loki_ingester_wal_disk_full_failures_total{job="loki"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              component: observability
            annotations:
              summary: Loki is out of disk and dropping logs
              description: >
                storage-loki-0 is full: chunk flushes fail with "no space left on
                device" and every query 500s. Logs arriving now are lost — Alloy
                buffers only briefly and Loki rejects samples older than 168h.
          - alert: AFLokiDown
            expr: up{job="loki"} == 0
            for: 15m
            labels:
              severity: error
              component: observability
            annotations:
              summary: Loki is not scrapeable
              description: >
                No log search for the facility, and the AFLokiStorage* alerts above
                are blind while this fires. Check: kubectl -n cms get pod loki-0
          - alert: AFPrometheusConfigReloadFailed
            expr: prometheus_config_last_reload_successful{job="prometheus"} == 0
            for: 10m
            labels:
              severity: warning
              component: observability
            annotations:
              summary: Prometheus failed to load its latest configuration
              description: >
                This server still runs its previous scrape jobs and rules, not
                the ones serverFiles declares; a broken rule file alone applies
                the new scrape jobs and keeps the old rules. The pod cannot
                start on this config, so fix it before the next restart.
                Check: kubectl -n cms logs deploy/prometheus-server | grep "Error reloading config"
alertmanager:
  enabled: true
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  config:
    global: {}
  ingress:
    enabled: false
    className: public
    hosts:
      - host: prometheus-af-alerts.geddes.rcac.purdue.edu
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - prometheus-af-alerts.geddes.rcac.purdue.edu
pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
# The self-repair workflow pushes per-tick metrics here; the self-repair scrape job reads them.
prometheus-pushgateway:
  enabled: true
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
