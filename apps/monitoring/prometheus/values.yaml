rbac:
  create: false

serviceAccounts:
  server:
    create: false
    name: prometheus-sa
    automountServiceAccountToken: true

configmapReload:
  prometheus:
    enabled: false

server:
  automountServiceAccountToken: true
  image:
    repository: geddes-registry.rcac.purdue.edu/docker-hub-cache/prom/prometheus
  # securityContext:
  #   runAsUser: 0
  #   runAsNonRoot: false
  #   fsGroup: 0
  useExistingClusterRoleName: prometheus-sa-role
  releaseNamespace: true
  configPath: /etc/config/prometheus.yml
  storagePath: /prometheus

  global:
    # scrape_timeout must be < scrape_interval or scrapes pile up and starve
    # the HTTP server (health probes) on Ceph-backed TSDB stalls.
    scrape_interval: 30s
    evaluation_interval: 30s
    scrape_timeout: 10s

  # WAL on Ceph RWX routinely takes minutes to replay; without a startupProbe
  # the default liveness window (~75s) kills the container mid-replay. At
  # runtime the same Ceph latency freezes /-/healthy long enough for the
  # default probe to SIGKILL (exit 137, reason=Error — not OOMKilled). Soften
  # probes and cap query runtime so a stuck Grafana query cannot pin the
  # process until the kubelet shoots it.
  startupProbe:
    enabled: true
    periodSeconds: 10
    failureThreshold: 60 # 10 min for Ceph WAL / mmap replay
    timeoutSeconds: 10
  livenessProbeInitialDelay: 60
  livenessProbePeriodSeconds: 30
  livenessProbeTimeout: 30
  livenessProbeFailureThreshold: 6 # ~3 min unresponsive before kill
  readinessProbeInitialDelay: 30
  readinessProbePeriodSeconds: 10
  readinessProbeTimeout: 10
  readinessProbeFailureThreshold: 6

  extraFlags:
    - web.enable-remote-write-receiver
    - query.timeout=2m
    - query.max-concurrency=20
    - storage.tsdb.wal-compression
  extraInitContainers:
    - name: prometheus-data-permission-fix
      image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/busybox:1.36
      command: ["/bin/chmod", "-R", "777", "/prometheus"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage-volume
          mountPath: /prometheus

  ingress:
    enabled: false
    hosts: [prometheus-af.geddes.rcac.purdue.edu]
    tls:
      - hosts: [prometheus-af.geddes.rcac.purdue.edu]
    ingressClassName: public

  # Keep Recreate: Prometheus TSDB cannot be opened by two processes (file lock /
  # corruption risk) even though the PVC is RWX. RollingUpdate would briefly run
  # two pods on the same data. True zero-downtime needs HA Prometheus or
  # remote-write-only + Thanos receive.
  strategy:
    type: Recreate

  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

  nodeSelector:
    cms-af-prod: "true"

  persistentVolume:
    enabled: true
    existingClaim: prometheus-data-pvc
    mountPath: /prometheus

  resources:
    requests:
      cpu: 4
      memory: 8Gi
    limits:
      cpu: 4
      memory: 8Gi

  service:
    enabled: true
    type: LoadBalancer
    servicePort: 9090
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9090"

  alertmanagers:
    - static_configs:
        - targets:
            - prometheus-alertmanager.cms.svc.cluster.local:9093

  retention: 30d
  retentionSize: 30GB

# The chart's scrapeConfigs is a MAP, so it merges with (rather than being
# replaced by) the scrape_configs list below. Its k8s defaults need cluster-scoped
# node/pod/service/endpointslice list+watch, but prometheus-sa only has a
# namespaced Role — they discover nothing and spam RBAC errors. Keep only the
# self-scrape.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false

serverFiles:
  prometheus.yml:
    # No remote_write: thanos-receive-router was never deployed, and writing to a
    # nonexistent endpoint pins the queue at capacity retrying forever.
    scrape_configs:
      # The scrape-metrics ServiceMonitor label feeds RANCHER's Prometheus,
      # not this server — scrape the sync Service directly so the
      # AFGlobalEnv* alerts below can actually evaluate here.
      - job_name: "pixi-global-sync"
        static_configs:
          - targets:
              - "pixi-global-sync:9099"
      - job_name: "jupyterhub"
        metrics_path: "/hub/metrics"
        static_configs:
          - targets:
              - "cms.geddes.rcac.purdue.edu"
      - job_name: "kube-state-metrics"
        honor_timestamps: false
        static_configs:
          - targets:
              - "rancher-monitoring-kube-state-metrics.cattle-monitoring-system.svc.cluster.local:8080"
        # Rancher's KSM is cluster-scoped (~244k of ~314k head series here).
        # AF alerts/dashboards only need cms namespaced series plus
        # cluster-scoped ones with no namespace label (nodes, PVs, …). Dropping
        # rook-ceph/kube-system/… cuts TSDB size and Ceph compaction I/O that
        # has been freezing this server long enough to fail liveness probes.
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: "(|cms)"
            action: keep
      - job_name: "slurm-metrics"
        static_configs:
          - targets:
              - "hammer-osg.rcac.purdue.edu:9100"
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - "geddes-b013.rcac.purdue.edu:9796"
              - "geddes-b014.rcac.purdue.edu:9796"
              - "geddes-b015.rcac.purdue.edu:9796"
              - "geddes-g000.rcac.purdue.edu:9796"
              - "geddes-g001.rcac.purdue.edu:9796"
              - "geddes-g002.rcac.purdue.edu:9796"
              - "paf-a00.cms.rcac.purdue.edu:9796"
              - "paf-a01.cms.rcac.purdue.edu:9796"
              - "paf-a02.cms.rcac.purdue.edu:9796"
              - "paf-b00.cms.rcac.purdue.edu:9796"
              - "cms-fe01.rcac.purdue.edu:9796"
              - "cms-fe00.rcac.purdue.edu:9796"
              - "vm-hammer-g000.rcac.purdue.edu:9796"
              - "vm-hammer-g001.rcac.purdue.edu:9796"
              - "vm-hammer-g002.rcac.purdue.edu:9796"
              - "vm-hammer-g003.rcac.purdue.edu:9796"
              - "vm-hammer-g004.rcac.purdue.edu:9796"
              - "vm-hammer-g005.rcac.purdue.edu:9796"
              - "vm-hammer-f000.rcac.purdue.edu:9796"
              - "vm-hammer-f001.rcac.purdue.edu:9796"
              - "vm-hammer-f002.rcac.purdue.edu:9796"
              - "vm-hammer-f003.rcac.purdue.edu:9796"
              - "vm-hammer-f004.rcac.purdue.edu:9796"
              - "vm-hammer-f005.rcac.purdue.edu:9796"
      # Mount metrics export node=<AF worker>. Scraping them through
      # af-pod-monitor also attaches pod_node=<Deployment host> (e.g.
      # geddes-b001), which is not cms-af-prod/dev and confuses every panel.
      # Scrape the Service directly, like pixi-global-sync.
      - job_name: "af-node-monitor"
        static_configs:
          - targets:
              - "af-node-monitor-service:8000"
      - job_name: "af-pod-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          # - source_labels: [__meta_kubernetes_service_label_app]
          #   target_label: 'app'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_endpoint_address_target_ip]
            target_label: "ip"
          - source_labels: [__meta_kubernetes_pod_label_username_unescaped]
            target_label: "username"
          - source_labels: [__meta_kubernetes_pod_label_docker_image_tag]
            target_label: "docker_image_tag"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          # Session / aux pod host. Must not be "node" — that label is reserved
          # for af-node-monitor's AF-worker label (see dedicated job above).
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels: [__meta_kubernetes_service_label_scrape_metrics]
            action: keep
            regex: "true"
          # Dedicated static jobs own these Services (see above / pixi job).
          - source_labels: [__meta_kubernetes_service_name]
            regex: "pixi-global-sync|af-node-monitor-service"
            action: drop
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: "^chp$"
            action: drop
          - source_labels: [__address__]
            regex: ".*:(8888|8889)$"
            action: drop
      - job_name: "envoy-monitor"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: "app"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_username_unescaped]
            target_label: "username"
          - source_labels: [__meta_kubernetes_pod_label_docker_image_tag]
            target_label: "docker_image_tag"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels: [__meta_kubernetes_service_label_envoy]
            action: keep
            regex: "true"
      - job_name: "dask-gateway-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: "app"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_user]
            target_label: "user"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: dask-gateway
          - source_labels: [__address__]
            regex: ".*:(80|8000|8786|8788)$"
            action: drop
      # - job_name: 'supersonic-monitor-triton'
      #   metrics_path: '/metrics'
      #   kubernetes_sd_configs:
      #     - role: endpoints
      #       namespaces:
      #         names:
      #           - ${namespace}
      #   relabel_configs:
      #     - source_labels: [__meta_kubernetes_pod_name]
      #       target_label: 'pod'
      #     - source_labels: [__meta_kubernetes_namespace]
      #       target_label: 'namespace'
      #       replacement: '$1'
      #     - source_labels: [__meta_kubernetes_pod_node_name]
      #       target_label: 'node'
      #     - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
      #       target_label: 'app'
      #     - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
      #       target_label: 'instance'
      #     - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
      #       target_label: 'component'
      #     - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
      #       action: keep
      #       regex: supersonic
      #     - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
      #       action: keep
      #       regex: triton
      - job_name: "supersonic-monitor-envoy"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: supersonic
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: envoy
      - job_name: "seldon-monitor-envoy"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
            replacement: "$1"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: seldon-envoy
  alerting_rules.yml:
    groups:
      - name: af-pod-monitor
        rules:
          - alert: AFHomeDirUtilHigh
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.90
            for: 1m
            labels:
              severity: warning
              component: storage
            annotations:
              summary: High /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                Now is the time to contact the user and make sure they are aware of this.
          - alert: AFHomeDirUtilVeryHigh
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.95
            for: 1m
            labels:
              severity: error
              component: storage
            annotations:
              summary: Very high /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                User {{ $labels.username }} must delete files, or move to /work/ or /depot/ immediately.
          - alert: AFHomeDirUtilCritical
            expr: af_home_dir_util{namespace=~"cms",job="af-pod-monitor",username!=""} > 0.99
            for: 1m
            labels:
              severity: critical
              component: storage
            annotations:
              summary: Critical /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                By now they might not be able to use AF at all.
                The immediate solution is to increase quota for this user (PVC size) by 1 GB,
                and then ask them to clean up files immediately.
          - alert: AFGlobalEnvOutOfSync
            # build ~20-40 min + retry cooldowns; 3h of drift means builds
            # keep failing (see pixi-global-sync pod logs / check-env output)
            expr: pixi_global_sync_in_sync == 0
            for: 3h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: Global pixi env is not in sync with the repository
              description: |
                /work/pixi/global has not matched pixi/global/pixi.lock on main
                for 3 hours. Builds or validation are failing — users still have
                the previous (working) env, but it is going stale.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvUnhealthy
            expr: pixi_global_sync_env_healthy == 0
            for: 30m
            labels:
              severity: critical
              component: environment
            annotations:
              summary: Live global pixi env failed import verification
              description: |
                The deep verify of /work/pixi/global found packages that no
                longer import, and the self-heal rebuild has not recovered it.
                User sessions relying on the global env are likely broken.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvSyncDown
            # also fires if scraping of the sync service is broken — silence
            # is never mistaken for health
            expr: absent(pixi_global_sync_in_sync)
            for: 1h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync metrics are absent
              description: |
                No pixi_global_sync_* metrics for 1h — the reconciler pod is
                down or its Service/scrape wiring is broken. The global env is
                not being kept in sync while this persists.
          - alert: AFGlobalEnvDaemonStale
            # Metrics can still scrape while the loop is wedged; heartbeat age
            # catches that case (absent metrics are AFGlobalEnvSyncDown).
            expr: time() - pixi_global_sync_loop_heartbeat_timestamp_seconds > 900
            for: 10m
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync heartbeat is stale
              description: |
                The reconciler loop has not refreshed its heartbeat for 15+
                minutes. Builds may be hung or the process wedged — the global
                env is not being reconciled.
                Check: kubectl logs deploy/pixi-global-sync

      # Can users get in? ---------------------------------------------------
      - name: af-access
        rules:
          # Scoped to this environment's own hub on purpose. The jupyterhub
          # job is a static target list, so an unscoped `up == 0` would fire
          # for any other hub added to it and drown the health signal.
          - alert: AFHubDown
            expr: up{job="jupyterhub", instance="${jupyterhub_host}"} == 0
            for: 5m
            labels:
              severity: critical
              component: access
            annotations:
              summary: JupyterHub is not responding to scrapes
              description: >
                The hub has been unreachable for 5 minutes. Nobody can start,
                stop or reach a session while this is true.
                Check: kubectl -n cms get pods -l component=hub
          # Observed spawn statuses: success, failure, already-pending,
          # throttled, too-many-users. Only `failure` is a real fault — the
          # others are the hub deliberately refusing, and alerting on them
          # would fire every time the facility is simply busy.
          - alert: AFSpawnFailures
            expr: sum(increase(jupyterhub_server_spawn_duration_seconds_count{status="failure"}[30m])) > 3
            for: 5m
            labels:
              severity: error
              component: access
            annotations:
              summary: Multiple session spawns failed in the last 30 minutes
              description: >
                {{ printf "%.0f" $value }} spawn failures in 30 minutes — users are
                being turned away at login. Check the hub logs, and whether the
                singleuser image still pulls.
          - alert: AFSessionStuckPending
            expr: kube_pod_status_phase{namespace="cms",pod=~"purdue-af-.*",phase="Pending"} == 1
            for: 15m
            labels:
              severity: warning
              component: access
            annotations:
              summary: Session pod {{ $labels.pod }} has been Pending for 15m
              description: >
                A session pod cannot be scheduled — usually no node with the
                requested CPU/RAM/GPU, or a volume that will not bind.
                Check: kubectl -n cms describe pod {{ $labels.pod }}

      # Do users have worker capacity? -------------------------------------
      - name: af-compute
        rules:
          # AF session/Dask nodes carry hub.jupyter.org/dedicated=cms-af.
          # Mount metrics are deliberately null on NotReady nodes, so without
          # this alert a power loss / drain looks like "storage is fine".
          - alert: AFProdNodesNotReady
            expr: >
              (kube_node_status_condition{condition="Ready", status="true"} == 0)
              * on(node) group_left()
              kube_node_spec_taint{key="hub.jupyter.org/dedicated", value="cms-af"}
            for: 10m
            labels:
              severity: error
              component: compute
            annotations:
              summary: "AF worker node {{ $labels.node }} is NotReady"
              description: >
                Node {{ $labels.node }} has been NotReady for 10 minutes.
                Sessions and Dask workers cannot land there. If many nodes fire
                together, treat it as a site / power / network outage rather
                than a single machine fault.
                Check: kubectl get node {{ $labels.node }}

      # Can users read data? ------------------------------------------------
      - name: af-data
        rules:
          # `valid == 0` alone is ambiguous: it also means the check never ran.
          # af_node_mount_result_fresh separates the two so a scheduling gap in
          # the monitor is never reported as a storage outage.
          #
          # NotReady / drained nodes publish no mount gauges at all (null) —
          # they must not appear here (see AFProdNodesNotReady). A completed
          # failing check on a Ready node (valid=0, fresh=1) is a warning —
          # EOS/NFS/CVMFS blips are common and must not flip facility health
          # to Degraded the way hub-down or NotReady workers do.
          - alert: AFMountInvalid
            expr: af_node_mount_valid{node_pool="prod"} == 0 and af_node_mount_result_fresh{node_pool="prod"} == 1
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is failing on node {{ $labels.node }}"
              description: >
                Data access check for {{ $labels.mount_name }} completed and
                failed for 10 minutes (includes timeouts). Sessions and Dask
                workers on this node may be unable to use that path. Storage
                outages are often transient; treat a widespread firing as a
                storage-system or network problem rather than a node problem.
                Check: kubectl -n cms logs -l app=af-node-monitor
          - alert: AFMountHealthUnknown
            expr: af_node_mount_result_fresh{node_pool="prod"} == 0
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "Data access unknown for {{ $labels.mount_name }} on node {{ $labels.node }}"
              description: >
                The node is Ready but no usable check result for 10 minutes
                (never reported, or last success went stale). Offline /
                NotReady nodes publish no series — they will not appear here.
                Check: kubectl -n cms get jobs -l app=af-node-monitor
          # Healthy metadata latency across all 17 nodes sits at p50 ~60 ms,
          # p90 ~350 ms, worst ~906 ms. The probe reports its timeout value
          # (10000 ms) when it gives up, and AFMountInvalid already covers that,
          # so the upper bound keeps this alert to real degradation.
          #
          # Checks only refresh every ~10 minutes (JOB_INTERVAL_S), and
          # individual samples often dip below 2s even while the mount is
          # chronically slow — so an instant `> 2000` with `for:` never holds.
          # avg_over_time across ~2 check cycles detects sustained elevation.
          - alert: AFMountSlow
            expr: avg_over_time(af_node_mount_metadata_latency_ms{node_pool="prod"}[20m]) > 2000 and avg_over_time(af_node_mount_metadata_latency_ms{node_pool="prod"}[20m]) < 10000
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is slow on node {{ $labels.node }}"
              description: >
                20-minute average metadata latency is {{ printf "%.0f" $value }} ms
                against a healthy ceiling near 900 ms. Reads still work, but
                analyses on this node will crawl.
          - alert: AFNodeMonitorStale
            expr: time() - af_node_monitor_last_iteration_timestamp_seconds > 900
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: af-node-monitor has not completed a pass in 15 minutes
              description: >
                Mount health is unknown, which is not the same as good: every
                af_node_mount_* series is stale, so AFMountInvalid cannot fire.
                Check: kubectl -n cms logs -l app=af-node-monitor

          # Dev nodes are monitored too, but they are not part of the facility
          # users see — a warning keeps them off the facility health verdict
          # while still showing up for operators.
          - alert: AFMountInvalidDev
            expr: af_node_mount_valid{node_pool="dev"} == 0 and af_node_mount_result_fresh{node_pool="dev"} == 1
            for: 30m
            labels:
              severity: warning
              component: dev
            annotations:
              summary: "{{ $labels.mount_name }} is failing on dev node {{ $labels.node }}"
              description: >
                A mount check completed and failed on a cms-af-dev node. No user
                sessions run there, so this does not affect the facility.

      # Can users scale out? ------------------------------------------------
      - name: af-scale-out
        rules:
          - alert: AFDaskGatewayDown
            expr: kube_deployment_status_replicas_available{namespace="cms",deployment=~"api-dask-gateway.*"} == 0
            for: 10m
            labels:
              severity: error
              component: scale-out
            annotations:
              summary: Dask Gateway {{ $labels.deployment }} has no available replicas
              description: >
                Users cannot create or reach clusters on this gateway; already
                running clusters may survive.
                Check: kubectl -n cms get deploy {{ $labels.deployment }}
alertmanager:
  enabled: true
  config:
    global: {}
  ingress:
    enabled: false
    className: public
    hosts:
      - host: prometheus-af-alerts.geddes.rcac.purdue.edu
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - prometheus-af-alerts.geddes.rcac.purdue.edu
pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
