rbac:
  create: false

serviceAccounts:
  server:
    create: false
    name: prometheus-sa

configmapReload:
  prometheus:
    enabled: false

server:
  automountServiceAccountToken: true
  image:
    repository: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/prom/prometheus

  global:
    # Must stay below scrape_interval, or scrapes pile up and starve the health probes.
    scrape_interval: 15s
    evaluation_interval: 15s
    scrape_timeout: 10s

  # WAL replay and compaction can outlast the chart default probes (~75 s).
  startupProbe:
    enabled: true
    periodSeconds: 10
    failureThreshold: 60 # 10 min for Ceph WAL / mmap replay
    timeoutSeconds: 10
  livenessProbeInitialDelay: 60
  livenessProbePeriodSeconds: 30
  livenessProbeTimeout: 30
  livenessProbeFailureThreshold: 6 # ~3 min unresponsive before kill
  readinessProbeInitialDelay: 30
  readinessProbePeriodSeconds: 10
  readinessProbeTimeout: 10
  readinessProbeFailureThreshold: 6

  extraFlags:
    - query.timeout=2m
    # serverFiles changes do not roll the pod; the server polls its config files for them.
    - config.auto-reload
  # Non-recursive: chmod -R walks every TSDB inode and can hang Init for minutes.
  extraInitContainers:
    - name: prometheus-data-permission-fix
      image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/busybox:1.38
      command: ["/bin/sh", "-c", "chmod 777 /prometheus"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: storage-volume
          mountPath: /prometheus

  # One key of the z2jh `hub` Secret; optional so this pod never waits on the hub.
  extraVolumes:
    - name: hub-metrics-token
      secret:
        secretName: hub
        optional: true
        items:
          - key: hub.services.prometheus.apiToken
            path: token
  extraVolumeMounts:
    - name: hub-metrics-token
      mountPath: /etc/hub-metrics
      readOnly: true

  # Recreate: the RWO PVC and TSDB lock rule out a second pod.
  strategy:
    type: Recreate

  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

  nodeSelector:
    cms-af-prod: "true"

  persistentVolume:
    enabled: true
    existingClaim: prometheus-data-pvc
    mountPath: /prometheus

  resources:
    requests:
      cpu: 1
      memory: 4Gi
    limits:
      cpu: 4
      memory: 8Gi

  service:
    type: LoadBalancer
    servicePort: 9090

  # Retention lives in the config file; the chart turns `retention` into a deprecated flag.
  retention: ""
  tsdb:
    retention:
      time: 30d
      size: 30GB

# The chart default k8s jobs need cluster-scoped RBAC prometheus-sa lacks; keep only self-scrape.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-nodes-cadvisor:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false

serverFiles:
  prometheus.yml:
    scrape_configs:
      # The scrape-metrics ServiceMonitor feeds Rancher Prometheus, not this server.
      - job_name: "pixi-global-sync"
        static_configs:
          - targets:
              - "pixi-global-sync:9099"
      - job_name: "jupyterhub"
        metrics_path: "/hub/metrics"
        scheme: https
        authorization:
          credentials_file: /etc/hub-metrics/token
        static_configs:
          - targets:
              - "cms.geddes.rcac.purdue.edu"
      - job_name: "kube-state-metrics"
        honor_timestamps: false
        static_configs:
          - targets:
              - "rancher-monitoring-kube-state-metrics.cattle-monitoring-system.svc.cluster.local:8080"
        # Rancher KSM is cluster-scoped; keep cms and namespace-less series only.
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: "(|cms)"
            action: keep
      # Rancher's Prometheus holds the kubelet's volume stats this server cannot scrape; user homes stay out.
      - job_name: "rancher-federate"
        metrics_path: /federate
        honor_labels: true
        scrape_interval: 60s
        params:
          match[]:
            - 'kubelet_volume_stats_available_bytes{namespace="cms",persistentvolumeclaim!~"claim-.*"}'
            - 'kubelet_volume_stats_capacity_bytes{namespace="cms",persistentvolumeclaim!~"claim-.*"}'
        static_configs:
          - targets:
              - rancher-monitoring-prometheus.cattle-monitoring-system.svc.cluster.local:9090
      - job_name: "slurm-metrics"
        static_configs:
          - targets:
              - "hammer-osg.rcac.purdue.edu:9100"
      # Rancher's node-exporter on every node tainted hub.jupyter.org/dedicated=cms-af.
      - job_name: "node-exporter"
        static_configs:
          - targets:
              - "a337.gautschi.rcac.purdue.edu:9796"
              - "geddes-b004.rcac.purdue.edu:9796"
              - "geddes-b011.rcac.purdue.edu:9796"
              - "geddes-b013.rcac.purdue.edu:9796"
              - "geddes-b014.rcac.purdue.edu:9796"
              - "geddes-b015.rcac.purdue.edu:9796"
              - "geddes-g000.rcac.purdue.edu:9796"
              - "geddes-g001.rcac.purdue.edu:9796"
              - "geddes-g002.rcac.purdue.edu:9796"
              - "paf-a00.cms.rcac.purdue.edu:9796"
              - "paf-a01.cms.rcac.purdue.edu:9796"
              - "paf-a02.cms.rcac.purdue.edu:9796"
              - "paf-b00.cms.rcac.purdue.edu:9796"
              - "paf-b01.cms.rcac.purdue.edu:9796"
              - "paf-d00.cms.rcac.purdue.edu:9796"
              - "paf-d01.cms.rcac.purdue.edu:9796"
              - "paf-d02.cms.rcac.purdue.edu:9796"
              - "paf-d03.cms.rcac.purdue.edu:9796"
              - "paf-e00.cms.rcac.purdue.edu:9796"
              - "paf-e01.cms.rcac.purdue.edu:9796"
              - "paf-e02.cms.rcac.purdue.edu:9796"
              - "paf-e03.cms.rcac.purdue.edu:9796"
      # Scraped directly: via af-pod-monitor, pod_node would carry the Deployment host.
      - job_name: "af-node-monitor"
        static_configs:
          - targets:
              - "af-node-monitor-service:8000"
      - job_name: "af-pod-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_username_unescaped]
            target_label: "username"
          - source_labels: [__meta_kubernetes_pod_label_docker_image_tag]
            target_label: "docker_image_tag"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
          # Not "node": af-node-monitor owns that label.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels: [__meta_kubernetes_service_label_scrape_metrics]
            action: keep
            regex: "true"
          # A dedicated static job owns this Service.
          - source_labels: [__meta_kubernetes_service_name]
            regex: "pixi-global-sync"
            action: drop
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: "^chp$"
            action: drop
          - source_labels: [__address__]
            regex: ".*:(8888|8889)$"
            action: drop
      # Pod SD, not the Service: a full disk makes Loki unready and drops it from Endpoints.
      - job_name: "loki"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          # The Loki container and its fs-exporter sidecar.
          - source_labels:
              [
                __meta_kubernetes_pod_label_app_kubernetes_io_component,
                __meta_kubernetes_pod_container_port_number,
              ]
            action: keep
            regex: "single-binary;(3100|9101)"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
      # Log shipping only: what Alloy sent to Loki, retried and dropped.
      - job_name: "alloy"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_pod_label_app_kubernetes_io_name,
                __meta_kubernetes_pod_container_port_name,
              ]
            action: keep
            regex: "alloy;http-metrics"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "pod_node"
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: "loki_write_(sent|dropped)_(entries|bytes)_total|loki_write_batch_retries_total|loki_process_dropped_lines_total"
      - job_name: "dask-gateway-monitor"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: "app"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_pod_label_user]
            target_label: "user"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: dask-gateway
          - source_labels: [__address__]
            regex: ".*:(80|8000|8786|8788)$"
            action: drop
      - job_name: "supersonic-monitor-envoy"
        metrics_path: "/stats/prometheus"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ${namespace}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: "pod"
          - source_labels: [__meta_kubernetes_namespace]
            target_label: "namespace"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: "node"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: "app"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_instance]
            target_label: "release"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            target_label: "component"
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: supersonic
          - source_labels:
              [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: envoy
  recording_rules.yml:
    groups:
      - name: af-cronjobs
        rules:
          # Since its last success, or since it was created if it never succeeded.
          - record: af:cronjob_seconds_since_success
            expr: >
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace="cms"}
                or kube_cronjob_created{namespace="cms"}
              )

  alerting_rules.yml:
    groups:
      - name: af-pod-monitor
        rules:
          - alert: AFHomeDirUtilHigh
            expr: af_home_dir_util{namespace="cms",job="af-pod-monitor",username!=""} > 0.90
            for: 1m
            labels:
              severity: warning
              component: storage
            annotations:
              summary: High /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                Now is the time to contact the user and make sure they are aware of this.
          - alert: AFHomeDirUtilVeryHigh
            expr: af_home_dir_util{namespace="cms",job="af-pod-monitor",username!=""} > 0.95
            for: 1m
            labels:
              severity: error
              component: storage
            annotations:
              summary: Very high /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                If utilization reaches 100%, user's session will stop working!
                User {{ $labels.username }} must delete files, or move to /work/ or /depot/ immediately.
          - alert: AFHomeDirUtilCritical
            expr: af_home_dir_util{namespace="cms",job="af-pod-monitor",username!=""} > 0.99
            for: 1m
            labels:
              severity: critical
              component: storage
            annotations:
              summary: Critical /home/ utilization for {{ $labels.username }}
              description: |
                User {{ $labels.username }} is at {{ printf "%.2f" $value }} /home/ utilization.
                By now they might not be able to use AF at all.
                The immediate solution is to increase quota for this user (PVC size) by 1 GB,
                and then ask them to clean up files immediately.
          - alert: AFGlobalEnvOutOfSync
            expr: pixi_global_sync_in_sync == 0
            for: 3h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: Global pixi env is not in sync with the repository
              description: |
                /work/pixi/global has not matched pixi/global/pixi.lock on main
                for 3 hours. Builds or validation are failing — users still have
                the previous (working) env, but it is going stale.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvUnhealthy
            expr: pixi_global_sync_env_healthy == 0
            for: 30m
            labels:
              severity: critical
              component: environment
            annotations:
              summary: Live global pixi env failed import verification
              description: |
                The deep verify of /work/pixi/global found packages that no
                longer import, and the self-heal rebuild has not recovered it.
                User sessions relying on the global env are likely broken.
                Check: kubectl logs deploy/pixi-global-sync
          - alert: AFGlobalEnvSyncDown
            expr: absent(pixi_global_sync_in_sync)
            for: 1h
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync metrics are absent
              description: |
                No pixi_global_sync_* metrics for 1h — the reconciler pod is
                down or its Service/scrape wiring is broken. The global env is
                not being kept in sync while this persists.
          - alert: AFGlobalEnvDaemonStale
            # Metrics can still scrape while the loop is wedged.
            expr: time() - pixi_global_sync_loop_heartbeat_timestamp_seconds > 900
            for: 10m
            labels:
              severity: warning
              component: environment
            annotations:
              summary: pixi-global-sync heartbeat is stale
              description: |
                The reconciler loop has not refreshed its heartbeat for 15+
                minutes. Builds may be hung or the process wedged — the global
                env is not being reconciled.
                Check: kubectl logs deploy/pixi-global-sync

      # Can users get in? ---------------------------------------------------
      - name: af-access
        rules:
          - alert: AFRegistryDown
            expr: af_registry_up == 0
            for: 10m
            labels:
              severity: warning
              component: access
            annotations:
              summary: The image registry is not answering, so new sessions may fail to start
              description: >
                Pods that need an image they have not cached cannot start. See
                docker/REGISTRY.md for the proxy projects.
          # Scoped to this cluster's hub: the job's one target is production's host on every cluster.
          - alert: AFHubDown
            expr: up{job="jupyterhub", instance="${jupyterhub_host}"} == 0
            for: 5m
            labels:
              severity: critical
              component: access
            annotations:
              summary: JupyterHub is not responding to scrapes
              description: >
                The hub has been unreachable for 5 minutes. Nobody can start,
                stop or reach a session while this is true.
                Check: kubectl -n cms get pods -l component=hub
          # The 15 s /hub/login poller reaches the callback whenever CILogon redirects back an error, so this needs no user traffic.
          - alert: AFLoginCallbackFailing
            expr: >
              sum(increase(jupyterhub_request_duration_seconds_count{job="jupyterhub", instance="${jupyterhub_host}",
                handler="oauthenticator.oauth2.OAuthCallbackHandler", code="400"}[10m])) > 5
              unless
              sum(increase(jupyterhub_request_duration_seconds_count{job="jupyterhub", instance="${jupyterhub_host}",
                handler="oauthenticator.oauth2.OAuthCallbackHandler", code="302"}[10m])) > 0
            for: 5m
            labels:
              severity: critical
              component: access
            annotations:
              summary: JupyterHub logins are failing at the OAuth callback
              description: >
                {{ printf "%.0f" $value }} OAuth callbacks returned 400 in 10 minutes
                and none succeeded: the identity provider is sending users back
                with an error, so nobody can log in although the hub is up.
                Check the hub logs for "OAuth error" and the scopes the
                authenticator requests.
          # Only `failure` is a fault; the GPU gate files its refusals there too, so subtract them.
          - alert: AFSpawnFailures
            expr: >
              clamp_min(
                sum(increase(jupyterhub_server_spawn_duration_seconds_count{status="failure"}[30m]))
                - sum(increase(purdue_af_hub_gpu_spawn_refused_total[30m])) or
                sum(increase(jupyterhub_server_spawn_duration_seconds_count{status="failure"}[30m])),
                0) > 3
            for: 5m
            labels:
              severity: error
              component: access
            annotations:
              summary: Multiple session spawns failed in the last 30 minutes
              description: >
                {{ printf "%.0f" $value }} spawn failures in 30 minutes — users are
                being turned away at login. Check the hub logs, and whether the
                singleuser image still pulls.
          # Sustained reason="reserved" means a reservation outlived its pod and blocks an idle GPU.
          - alert: AFGpuSpawnRefusedWithGpuFree
            expr: sum(increase(purdue_af_hub_gpu_spawn_refused_total{reason="reserved"}[30m])) > 3
            for: 10m
            labels:
              severity: warning
              component: compute
            annotations:
              summary: GPU spawns refused while GPUs were free
              description: >
                {{ printf "%.0f" $value }} GPU spawns refused in 30 minutes despite
                free GPUs — a spawn reservation is outliving its pod. Check the hub
                logs for "[gpu-availability] refused".
          # Above the gpu-culler's --timeout in apps/jupyterhub/jupyterhub/values.yaml; tests/manifests/test_gpu_culler.py holds the two together.
          - alert: AFGpuSessionsPastIdleTimeout
            expr: >
              count(
                time() - af_session_last_activity_seconds{job="jupyterhub", instance="${jupyterhub_host}"} > 25 * 3600
                and on (pod) kube_pod_container_resource_requests{namespace="cms", resource=~"nvidia_com_(mig_.+|gpu)"} > 0
              )
            for: 30m
            labels:
              severity: warning
              component: compute
            annotations:
              summary: Idle sessions are holding GPUs, so fewer are free for new sessions
              description: >
                Sessions holding a GPU and idle past the timeout: {{ printf "%.0f" $value }}.
                The GPU culler is not stopping them.
                Check: kubectl -n cms logs -l component=hub | grep gpu-culler
          - alert: AFSessionStuckPending
            expr: kube_pod_status_phase{namespace="cms",pod=~"purdue-af-.*",phase="Pending"} == 1
            for: 8m
            labels:
              severity: warning
              component: access
            annotations:
              summary: Session pod {{ $labels.pod }} has been Pending for 8m
              description: >
                A session pod is not starting: usually a home volume that will
                not mount, then an image that will not pull, then no node with
                the requested CPU/RAM/GPU. The hub deletes the pod at 10 minutes,
                so look now.
                Check: kubectl -n cms describe pod {{ $labels.pod }}

      # Do users have worker capacity? -------------------------------------
      - name: af-compute
        rules:
          - alert: AFNodeDiskPressure
            expr: >
              (kube_node_status_condition{condition="DiskPressure",status="true"} == 1)
              * on (node) group_left ()
              kube_node_spec_taint{key="hub.jupyter.org/dedicated",value="cms-af"}
            for: 5m
            labels:
              severity: error
              component: compute
            annotations:
              summary: "Node {{ $labels.node }} is out of local disk and may evict sessions"
              description: >
                Kubelet evicts pods at full disk, sessions with running kernels
                included. /tmp in sessions and Dask workers is this disk. Check:
                kubectl -n cms get pods -o wide, for the pods on the node.
          # /var/lib/docker holds every container's writable layer, /tmp included; targets are the cms-af nodes.
          - alert: AFNodeDiskLow
            expr: >
              node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var/lib/docker"}
              / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var/lib/docker"}
              < 0.1
            for: 30m
            labels:
              severity: warning
              component: compute
            annotations:
              summary: "A node's local disk is over 90% full"
              description: >
                {{ $labels.instance }} holds container layers and /tmp, and
                kubelet evicts pods, sessions included, once it fills. Check what
                is large on the node before that.
          # Mount metrics are null on NotReady nodes, so a drain would otherwise look healthy.
          - alert: AFProdNodesNotReady
            expr: >
              (kube_node_status_condition{condition="Ready", status="true"} == 0)
              * on(node) group_left()
              kube_node_spec_taint{key="hub.jupyter.org/dedicated", value="cms-af"}
            for: 10m
            labels:
              severity: error
              component: compute
            annotations:
              summary: "AF worker node {{ $labels.node }} is NotReady"
              description: >
                Node {{ $labels.node }} has been NotReady for 10 minutes.
                Sessions and Dask workers cannot land there. If many nodes fire
                together, treat it as a site / power / network outage rather
                than a single machine fault.
                Check: kubectl get node {{ $labels.node }}

      # Can users read data? ------------------------------------------------
      - name: af-data
        rules:
          # fresh separates a failed check from one that never ran; mount blips stay warnings.
          - alert: AFMountInvalid
            expr: >
              af_node_mount_valid{node_pool="prod",mount_name!="cvmfs"} == 0
              and af_node_mount_result_fresh{node_pool="prod",mount_name!="cvmfs"} == 1
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is failing on node {{ $labels.node }}"
              description: >
                Data access check for {{ $labels.mount_name }} completed and
                failed for 10 minutes (includes timeouts, and a probe pod that
                cannot mount the volume while the node's other probes run).
                Sessions and Dask workers on this node may be unable to use
                that path. Storage
                outages are often transient; treat a widespread firing as a
                storage-system or network problem rather than a node problem.
                Check: kubectl -n cms logs -l app=af-node-monitor
          - alert: AFMountFailingWidely
            expr: >
              count by (mount_name)(af_node_mount_valid{node_pool="prod",mount_name!="cvmfs"} == 0
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)
              / count by (mount_name)(af_node_mount_result_fresh{node_pool="prod",mount_name!="cvmfs"} == 1)
              >= 0.5
            for: 10m
            labels:
              severity: error
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is failing on half the nodes or more"
              description: >
                {{ $value | humanizePercentage }} of the prod nodes failed their
                {{ $labels.mount_name }} check for 10 minutes. This is the
                storage system or the network, not a node: sessions and Dask
                workers anywhere cannot use that path. Report it to RCAC.
                Check: kubectl -n cms logs -l app=af-node-monitor
          - alert: AFMountHealthUnknown
            expr: af_node_mount_result_fresh{node_pool="prod"} == 0
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "Data access unknown for {{ $labels.mount_name }} on node {{ $labels.node }}"
              description: >
                The node is Ready but no usable check result for 10 minutes
                (never reported, or last success went stale). Offline /
                NotReady nodes publish no series — they will not appear here.
                af_node_mount_probe_up says which side is broken: 0 means the
                probe pod is missing, not Ready or not answering af-node-monitor;
                1 means the probe answered but its result timestamp was rejected,
                which is clock skew on that node. A mount that fails or times out
                fires AFMountInvalid instead (AFCvmfsFailing for /cvmfs).
                Check: kubectl -n cms get pods -l app=af-node-monitor,component=probe -o wide
          # One timed-out check's 10000 ms sentinel lifts the 20m average into the band; the upper bound drops only windows of timeouts alone.
          - alert: AFMountSlow
            expr: >
              avg_over_time((af_node_mount_metadata_latency_ms{node_pool="prod",mount_name!~"cvmfs|eos"}
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)[20m:])
              > 2000 < 10000
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "{{ $labels.mount_name }} is slow on node {{ $labels.node }}"
              description: >
                20-minute average metadata latency is {{ printf "%.0f" $value }} ms
                against a healthy ceiling near 900 ms. Reads still work, but
                analyses on this node will crawl.
          # A timed-out check (the 10000 ms sentinel) counts as slow; the second term leaves timeouts alone to AFMountInvalid.
          - alert: AFEosSlow
            expr: >
              avg_over_time((af_node_mount_metadata_latency_ms{node_pool="prod",mount_name="eos"} > bool 2000
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)[1h:])
              >= 0.5
              and on(node, mount_name, node_pool)
              max_over_time((af_node_mount_metadata_latency_ms{node_pool="prod",mount_name="eos"} < 10000 > bool 2000
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)[1h:])
              == 1
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "eos is slow on node {{ $labels.node }}"
              description: >
                {{ $value | humanizePercentage }} of the eos checks on this node
                over the last hour took over 2 s to list a directory or timed
                out, and at least one of the slow ones completed. One slow
                check is a blip; this many means reads of /eos
                crawl or stall for the sessions and Dask workers on this node.
                /eos is the node's own EOS FUSE mount: report the node to RCAC.
                Many nodes at once is EOS itself or the network.
          # /cvmfs is autofs: a check after the repository expired pays a cold automount that can outlast the read timeout.
          - alert: AFCvmfsFailing
            expr: >
              avg_over_time((af_node_mount_valid{node_pool="prod",mount_name="cvmfs"}
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)[2h:])
              < 0.5
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "cvmfs is failing on node {{ $labels.node }}"
              description: >
                Only {{ $value | humanizePercentage }} of the /cvmfs checks on this
                node passed over 2 hours. One failed check is a slow cold
                automount; most of them failing means CVMFS on this node is
                broken, and sessions and Dask workers here stall or fail when
                they read /cvmfs. The CVMFS client and its automounter belong to
                RCAC's CSI driver: report the node to RCAC.
          - alert: AFCvmfsFailingWidely
            expr: >
              count(min_over_time((af_node_mount_valid{node_pool="prod",mount_name="cvmfs"}
              and on(node, mount_name, node_pool) af_node_mount_result_fresh{node_pool="prod"} == 1)[10m:]) == 0)
              / count(af_node_mount_result_fresh{node_pool="prod",mount_name="cvmfs"} == 1)
              >= 0.5
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: /cvmfs is failing on half the nodes or more
              description: >
                {{ $value | humanizePercentage }} of the prod nodes had a failed
                /cvmfs check in the last 10 minutes. Cold automounts fail on
                one node at a time; this many at once is CVMFS itself, its
                proxies or the network, and sessions and Dask workers anywhere
                may fail to read /cvmfs.
          - alert: AFXCacheReadFailing
            expr: af_xcache_read_ok == 0
            for: 15m
            labels:
              severity: error
              component: data
            annotations:
              summary: Reads through XCache are failing
              description: >
                The probe could not read its file through XCache with the
                facility's grid proxy. Jobs reading a root://xcache prefix stall
                or fail; direct EOS and AAA reads do not depend on it. An expired
                proxy fails the read too. Check: kubectl -n cms logs deploy/af-xcache-probe
          - alert: AFNodeMonitorStale
            expr: >
              absent(af_node_monitor_last_iteration_timestamp_seconds)
              or time() - af_node_monitor_last_iteration_timestamp_seconds > 900
            for: 5m
            labels:
              severity: warning
              component: data
            annotations:
              summary: af-node-monitor has not completed a pass in 15 minutes
              description: >
                Mount health is unknown, which is not the same as good: every
                af_node_mount_* series is stale, so AFMountInvalid cannot fire.
                Check: kubectl -n cms logs -l name=af-node-monitor
          # Probes the exporter cannot reach read as unknown, one series at a time, only after their stale window.
          - alert: AFNodeMonitorResultsUnavailable
            expr: af_node_monitor_results_available < 0.5
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: af-node-monitor cannot reach most mount probes
              description: >
                Fewer than half of the Ready probe pods answered af-node-monitor
                for 10 minutes, so most mount checks are not being read and the
                mount alerts are blind rather than green. The mounts themselves
                may be fine: this is the exporter's path to the probes (pod
                network, pod list) or the probes themselves.
                Check: kubectl -n cms logs -l name=af-node-monitor

          # Dev nodes stay warnings, off the facility health verdict.
          - alert: AFMountInvalidDev
            expr: af_node_mount_valid{node_pool="dev"} == 0 and af_node_mount_result_fresh{node_pool="dev"} == 1
            for: 30m
            labels:
              severity: warning
              component: dev
              audience: operators
            annotations:
              summary: "{{ $labels.mount_name }} is failing on dev node {{ $labels.node }}"
              description: >
                A mount check completed and failed on a cms-af-dev node. No user
                sessions run there, so this does not affect the facility.

      # Can users scale out? ------------------------------------------------
      - name: af-scale-out
        rules:
          - alert: AFDaskGatewayDown
            expr: kube_deployment_status_replicas_available{namespace="cms",deployment=~"(api|controller)-dask-gateway"} == 0
            for: 10m
            labels:
              severity: error
              component: scale-out
            annotations:
              summary: "{{ $labels.deployment }} has no available replicas"
              description: >
                The api serves every Dask Gateway request; the controller
                starts, scales and stops the clusters' pods. Without either,
                users get no new Dask workers; already running clusters may
                survive. Check: kubectl -n cms get deploy {{ $labels.deployment }}
          - alert: AFDaskControllerStalled
            expr: count(time() - kube_pod_completion_time{namespace="cms",pod=~"dask-(scheduler|worker)-.*"} > 600) > 0
            for: 5m
            labels:
              severity: error
              component: scale-out
            annotations:
              summary: The Dask Gateway controller has stopped cleaning up finished Dask pods
              description: >
                {{ printf "%.0f" $value }} Dask pods finished more than 10 minutes
                ago and still exist; a working controller deletes them within
                seconds. Clusters it no longer reconciles get no new workers,
                ignore stop requests, and keep their owner at the per-user
                cluster limit. Check: kubectl -n cms logs deploy/controller-dask-gateway;
                deleting its pod restarts it: kubectl -n cms delete pod
                -l app.kubernetes.io/name=dask-gateway,app.kubernetes.io/component=controller
          - alert: AFDaskControllerRestarted
            expr: increase(kube_pod_container_status_restarts_total{namespace="cms",pod=~"controller-dask-gateway-.*",container="controller"}[1h]) > 0
            for: 1m
            labels:
              severity: warning
              component: scale-out
            annotations:
              summary: The Dask Gateway controller restarted in the last hour
              description: >
                Its liveness probe restarts it once its reconcilers stop taking
                work, so Dask scaling stalled until the restart. Check: kubectl
                -n cms logs deploy/controller-dask-gateway --previous
          - alert: AFNrpTokenRenewalFailing
            expr: af:cronjob_seconds_since_success{cronjob="interlink-nrp-token-renewal"} > 3 * 86400
            for: 1h
            labels:
              severity: warning
              component: scale-out
            annotations:
              summary: The NRP token has not been renewed for {{ $value | humanizeDuration }}
              description: >
                The daily interlink-nrp-token-renewal CronJob mints the token,
                valid for LIFETIME_S in apps/interlink/nrp/token-renewal/renew.py,
                with which the interlink-nrp node and the ray-train gateway
                reach NRP. Once it expires, nothing runs on NRP. Check:
                kubectl -n cms get jobs | grep interlink-nrp-token-renewal, and
                the logs of the latest; to renew by hand, see apps/interlink/README.md.

      # Can we still see what the facility is doing? -------------------------
      # node_filesystem_*{job="loki"} comes from the fs-exporter sidecar in loki/values.yaml.
      # audience: operators keeps a rule out of get_facility_health.
      - name: af-observability
        rules:
          - alert: AFLokiStorageWillFill
            # Fires when the trend says the PVC fills within a week.
            expr: |
              predict_linear(
                node_filesystem_avail_bytes{job="loki",mountpoint="/var/loki"}[6h],
                7 * 24 * 3600
              ) < 0
            for: 1h
            labels:
              severity: warning
              component: observability
              audience: operators
            annotations:
              summary: Loki PVC is on track to fill within 7 days
              description: >
                storage-loki-0 free space is trending to 0 inside a week. Expect
                the retention
                window (loki.structuredConfig.limits_config.retention_period) to
                no longer fit the current log volume — shorten it, or grow the
                PVC. Loki stops ingesting AND stops answering every query the
                moment this volume is full.
          - alert: AFLokiStorageAlmostFull
            expr: |
              1 - (
                node_filesystem_avail_bytes{job="loki",mountpoint="/var/loki"}
                / node_filesystem_size_bytes{job="loki",mountpoint="/var/loki"}
              ) > 0.90
            for: 10m
            labels:
              severity: error
              component: observability
            annotations:
              summary: The log store is {{ $value | humanizePercentage }} full
              description: >
                Act now — at 100% Loki loses both ingest and query. The compactor
                needs free space to apply retention, so recovering from a full
                volume means growing the PVC first:
                kubectl -n cms patch pvc storage-loki-0 -p
                '{"spec":{"resources":{"requests":{"storage":"<bigger>Gi"}}}}'
          - alert: AFLokiStorageFull
            # Backstop for when the sidecar or its scrape is what broke.
            expr: increase(loki_ingester_wal_disk_full_failures_total{job="loki"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
              component: observability
            annotations:
              summary: "Logs are being lost: the log store is out of disk"
              description: >
                storage-loki-0 is full: chunk flushes fail with "no space left on
                device" and every query 500s. Logs arriving now are lost: Alloy
                buffers only briefly.
          - alert: AFGridProxyNotRenewed
            expr: af:cronjob_seconds_since_success{cronjob=~"af-x509-secrets|x509-secrets"} > 7 * 3600
            for: 10m
            labels:
              severity: warning
              component: data
            annotations:
              summary: The facility's grid proxy is not being renewed, so ServiceX requests may fail
              description: >
                af-x509-secrets keeps the last proxy until it expires, and
                ServiceX's x509-secrets removes its Secret when a VOMS call
                fails. Check: kubectl -n cms get jobs, and
                apps/jupyterhub/af-x509-secrets/README.md for the certificate
                behind it.
          - alert: AFKubeStateMetricsDown
            expr: up{job="kube-state-metrics"} == 0
            for: 10m
            labels:
              severity: warning
              component: observability
            annotations:
              summary: Facility pod and node state is not being collected
              description: >
                Rules and panels on kube_* series read nothing while this lasts,
                so a quiet alert list says nothing about pods and nodes. The
                target's state is on prometheus-server's targets page.
          - alert: AFNodesWithoutLogShipper
            expr: >
              count(group by (node) (af_node_mount_probe_up == 1))
              - on () kube_daemonset_status_number_ready{namespace="cms",daemonset="alloy"}
              > 0
            for: 15m
            labels:
              severity: warning
              component: observability
            annotations:
              summary: Some nodes are not shipping logs
              description: >
                Logs of a pod that exits on such a node are lost for good, and the
                log tools answer as if the pod were quiet. Compare the nodes in
                kubectl -n cms get pods -o wide with the node label of
                af_node_mount_result_fresh.
          - alert: AFVolumeAlmostFull
            expr: >
              max by (persistentvolumeclaim) (
                1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim!="storage-loki-0"}
                / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!="storage-loki-0"}
              ) > 0.9
            for: 30m
            labels:
              severity: warning
              component: data
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} is over 90% full"
              description: >
                A full volume stops whatever writes to it. Free space or grow the
                claim in its manifest. Loki's volume has its own rules.
          - alert: AFVolumeWillFill
            expr: >
              min by (persistentvolumeclaim) (
                predict_linear(kubelet_volume_stats_available_bytes{persistentvolumeclaim!="storage-loki-0"}[3d], 7 * 86400)
              ) < 0
              and on (persistentvolumeclaim)
              max by (persistentvolumeclaim) (
                1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim!="storage-loki-0"}
                / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!="storage-loki-0"}
              ) > 0.7
            for: 6h
            labels:
              severity: warning
              component: data
            annotations:
              summary: "Volume {{ $labels.persistentvolumeclaim }} is on course to fill within a week"
              description: >
                Three days of growth run out its free space within seven. The
                used-space term keeps a large write to a mostly empty volume from
                firing this.
          - alert: AFVolumeStatsMissing
            expr: absent(kubelet_volume_stats_capacity_bytes{persistentvolumeclaim="af-shared-storage"})
            for: 15m
            labels:
              severity: warning
              component: observability
            annotations:
              summary: Volume fill levels are not being collected
              description: >
                The volume alerts read nothing while this lasts. The
                rancher-federate target's state is on prometheus-server's targets
                page.
          - alert: AFLokiDown
            expr: up{job="loki"} == 0
            for: 15m
            labels:
              severity: error
              component: observability
            annotations:
              summary: "Logs cannot be searched: the log store is not answering"
              description: >
                No log search for the facility, and the AFLokiStorage* alerts above
                are blind while this fires. Check: kubectl -n cms get pod loki-0
          - alert: AFPrometheusConfigReloadFailed
            expr: prometheus_config_last_reload_successful{job="prometheus"} == 0
            for: 10m
            labels:
              severity: warning
              component: observability
              audience: operators
            annotations:
              summary: Prometheus failed to load its latest configuration
              description: >
                This server still runs its previous scrape jobs and rules, not
                the ones serverFiles declares; a broken rule file alone applies
                the new scrape jobs and keeps the old rules. The pod cannot
                start on this config, so fix it before the next restart.
                Check: kubectl -n cms logs deploy/prometheus-server | grep "Error reloading config"
      - name: af-delivery
        rules:
          - alert: AFHubBackupStale
            expr: af:cronjob_seconds_since_success{cronjob="jupyterhub-database-backup"} > 86400
            for: 1h
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: The hub database has had no verified backup for a day
              description: >
                The script fails unless the copy matches the hub pod's checksum,
                so a stale backup is a failed or missing run. Check: kubectl -n
                cms logs job/<newest jupyterhub-database-backup job>
          - alert: AFUserlistNotSyncing
            expr: af:cronjob_seconds_since_success{cronjob=~"af-userlist-sync-(cern|purdue)"} > 6 * 3600
            for: 10m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: New accounts may be refused at login because the list of allowed users has stopped updating
              description: >
                A failed sync keeps the last good list, so listed users are
                unaffected, a new account gets a 403 and a removed one keeps
                access. af-userlist-sync-cern mounts the grid proxy, so a lost
                proxy fires this together with AFGridProxyNotRenewed. A list that
                shrank for real needs MIN_KEPT_PERCENT lowered for one run.
                Check: kubectl -n cms logs job/<newest {{ $labels.cronjob }} job>
          - alert: AFCronJobStale
            expr: >
              af:cronjob_seconds_since_success{cronjob!~"interlink-nrp-token-renewal|af-x509-secrets|x509-secrets|jupyterhub-database-backup|af-userlist-sync-(cern|purdue)"}
              > 2 * 86400
            for: 10m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: "CronJob {{ $labels.cronjob }} has not succeeded for two days"
              description: >
                A bad image or a hung Job, which concurrencyPolicy: Forbid leaves
                blocking every later run. Check: kubectl -n cms get jobs
          - alert: AFImagePullFailing
            expr: >
              max by (pod, container) (
                kube_pod_container_status_waiting_reason{namespace="cms",reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName|RegistryUnavailable"}
                or kube_pod_init_container_status_waiting_reason{namespace="cms",reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName|RegistryUnavailable"}
              ) == 1
            for: 10m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: "Pod {{ $labels.pod }} cannot pull its image"
              description: >
                A manifest applies with no wait, so its root stays Ready, and a
                Recreate Deployment has already removed the old pod. Check:
                kubectl -n cms describe pod {{ $labels.pod }}
          - alert: AFFluxRootNotReady
            expr: af_flux_ready{kind=~"Kustomization|GitRepository"} == 0
            for: 5m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: "Flux {{ $labels.kind }} {{ $labels.name }} is failing or suspended"
              description: >
                No merge reaches any component of this root until it recovers,
                while its running workloads and the README badges look normal.
                Check: kubectl -n cms get gitrepositories,kustomizations,helmreleases
          - alert: AFHelmReleaseNotReady
            # Longer than one Helm wait and rollback, so a retry that recovers stays quiet.
            expr: af_flux_ready{kind="HelmRelease"} == 0
            for: 15m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: "HelmRelease {{ $labels.name }} is failing or suspended"
              description: >
                It runs its last good version and retries forever, and each
                attempt can roll its pods, while its badge still reads released.
                Check: kubectl -n cms describe helmrelease {{ $labels.name }}
          - alert: AFFluxStateUnknown
            expr: absent(af_flux_ready{kind="Kustomization"})
            for: 15m
            labels:
              severity: warning
              component: delivery
            annotations:
              summary: af-node-monitor reports no Flux state
              description: >
                AFFluxRootNotReady and AFHelmReleaseNotReady are blind while
                this fires. Check for "Cannot list" in:
                kubectl -n cms logs deploy/af-node-monitor
alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
