apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-x509-secrets-${namespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: af-x509-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["${x509_secret_name}"]
    verbs: ["patch"]
  # A create request carries no name for resourceNames to match.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: af-x509-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: af-x509-secrets
subjects:
  - kind: ServiceAccount
    name: af-x509-secrets-${namespace}
    namespace: ${namespace}
