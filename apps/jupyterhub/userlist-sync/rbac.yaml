apiVersion: v1
kind: ServiceAccount
metadata:
  name: af-userlist-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["af-auth-purdue", "af-auth-cern"]
    verbs: ["get", "patch"]
  # A create request carries no name for resourceNames to match.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: af-userlist-sync-secret-manager
subjects:
  - kind: ServiceAccount
    name: af-userlist-sync
roleRef:
  kind: Role
  name: secret-manager
  apiGroup: rbac.authorization.k8s.io
