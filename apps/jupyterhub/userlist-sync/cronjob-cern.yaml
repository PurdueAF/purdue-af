apiVersion: batch/v1
kind: CronJob
metadata:
  name: af-userlist-sync-cern
spec:
  schedule: "*/30 * * * *" # Run every 30 minutes
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # The script already retries the flaky upstream fetch in-pod, so a
      # pod-level retry storm adds nothing but Error pods (the default
      # backoffLimit of 6 left 7 per failed run). One retry still covers
      # genuine pod-level mishaps (eviction, image pull).
      backoffLimit: 1
      # concurrencyPolicy is Forbid: without a deadline, ONE wedged pod
      # blocks every later run indefinitely (a missing-secret pod stuck in
      # ContainerCreating once stalled the cern sync for 23 h). Comfortably
      # above the in-pod retry budget (5 x 60 s + fetch time).
      activeDeadlineSeconds: 900
      # Finished Jobs (and their pods) delete themselves — the namespace
      # stays clean without hand-pruning. Logs live in Loki; an hour is
      # plenty to inspect a failure in-cluster before it is swept.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          enableServiceLinks: false
          serviceAccountName: af-userlist-sync
          restartPolicy: Never
          nodeSelector: { "cms-af-prod": "true" }
          tolerations:
            - key: "hub.jupyter.org/dedicated"
              operator: "Equal"
              value: "cms-af"
              effect: "NoSchedule"
          containers:
            - name: af-userlist-sync-cern
              image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/rockylinux:8.9
              command: [/bin/bash, /scripts/sync-userlist.sh, cern]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: af-x509-proxy
                  mountPath: /etc/grid-security-ro
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: af-x509-proxy
              secret:
                secretName: ${x509_secret_name}
            - name: scripts
              configMap:
                name: af-userlist-sync-scripts
