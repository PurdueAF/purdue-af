apiVersion: batch/v1
kind: CronJob
metadata:
  name: af-userlist-sync-purdue
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      # Above the script retry budget: with Forbid, a wedged pod blocks every later run.
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          enableServiceLinks: false
          serviceAccountName: af-userlist-sync
          restartPolicy: Never
          nodeSelector:
            ${af_node_label:=cms-af-prod}: ${af_node_label_value:="true"}
          tolerations:
            - key: "hub.jupyter.org/dedicated"
              operator: "Equal"
              value: "cms-af"
              effect: "NoSchedule"
          containers:
            - name: af-userlist-sync-purdue
              image: geddes2-registry.rcac.purdue.edu/dockerhub-proxy-cache/library/bash:5.3.20
              command: [bash, /scripts/sync-userlist.sh, purdue]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: af-userlist-sync-scripts
