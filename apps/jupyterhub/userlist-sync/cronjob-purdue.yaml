apiVersion: batch/v1
kind: CronJob
metadata:
  name: af-userlist-sync-purdue
spec:
  schedule: "*/30 * * * *" # Run every 30 minutes
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # The script already retries the flaky upstream fetch in-pod, so a
      # pod-level retry storm adds nothing but Error pods (the default
      # backoffLimit of 6 left 7 per failed run). One retry still covers
      # genuine pod-level mishaps (eviction, image pull).
      backoffLimit: 1
      # concurrencyPolicy is Forbid: without a deadline, ONE wedged pod
      # blocks every later run indefinitely (a missing-secret pod stuck in
      # ContainerCreating once stalled the cern sync for 23 h). Comfortably
      # above the in-pod retry budget (5 x 60 s + fetch time).
      activeDeadlineSeconds: 900
      # Finished Jobs (and their pods) delete themselves — the namespace
      # stays clean without hand-pruning. Logs live in Loki; an hour is
      # plenty to inspect a failure in-cluster before it is swept.
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          enableServiceLinks: false
          serviceAccountName: af-userlist-sync
          restartPolicy: Never
          nodeSelector: { "cms-af-prod": "true" }
          # auth.hammer answers only from 172.18.29.0/24 (the paf-* nodes);
          # the 7 geddes cms-af-prod nodes are 172.21.160.0/24 and carry
          # role=storage-node, so excluding that label leaves exactly the
          # nodes that can reach it. Drop once RCAC opens 172.21.160.0/24.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: role
                        operator: DoesNotExist
          tolerations:
            - key: "hub.jupyter.org/dedicated"
              operator: "Equal"
              value: "cms-af"
              effect: "NoSchedule"
          containers:
            - name: af-userlist-sync-purdue
              image: geddes-registry.rcac.purdue.edu/docker-hub-cache/library/rockylinux:8.9
              command: [/bin/bash, /scripts/sync-userlist.sh, purdue]
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: af-userlist-sync-scripts
