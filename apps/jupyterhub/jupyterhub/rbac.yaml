# The Hub's access to the pooled-account ledger it keeps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hub-pooled-accounts
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["af-pooled-accounts"]
    verbs: ["get", "update"]
  # A create cannot be scoped to a name: it runs before the object has one.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hub-pooled-accounts
subjects:
  - kind: ServiceAccount
    name: hub
roleRef:
  kind: Role
  name: hub-pooled-accounts
  apiGroup: rbac.authorization.k8s.io
