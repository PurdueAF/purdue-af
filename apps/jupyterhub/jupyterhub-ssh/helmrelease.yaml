apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jupyterhub-ssh
spec:
  interval: 5m
  chart:
    spec:
      chart: jupyterhub-ssh
      version: "0.0.1-n142.h402a3d6"
      sourceRef:
        kind: HelmRepository
        name: jupyterhub-ssh
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: jupyterhub-ssh-config
      valuesKey: values.yaml
