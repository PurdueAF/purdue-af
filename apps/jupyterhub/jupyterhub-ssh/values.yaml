hubUrl: https://cms.geddes.rcac.purdue.edu

ssh:
  config:
    JupyterHubSSH:
      # Quieter than the chart default; upstream only toggles DEBUG vs INFO.
      debug: false

  image:
    repository: quay.io/jupyterhub-ssh/ssh
    tag: "0.0.1-0.dev.git.149.he5107a4"

  service:
    type: LoadBalancer

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  nodeSelector: { "cms-af-prod": "true" }
  tolerations:
    - key: "hub.jupyter.org/dedicated"
      operator: "Equal"
      value: "cms-af"
      effect: "NoSchedule"

sftp:
  enabled: false
