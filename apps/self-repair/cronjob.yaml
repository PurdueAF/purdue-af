# Starts one `triage` run per tick and exits once the run is accepted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: self-repair
spec:
  schedule: "0 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            cms-af-prod: "true"
          tolerations:
            - key: hub.jupyter.org/dedicated
              operator: Equal
              value: cms-af
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: launch
              image: geddes-registry.rcac.purdue.edu/ghcr-proxy-cache/purdueaf/self-repair:latest
              imagePullPolicy: Always
              # ConfigMap files are symlinks, which Flyte's bundler skips: copy them out.
              command: ["sh", "-c"]
              args:
                - mkdir /tmp/workflow && cp -L /workflow/*.py /workflow/config.yaml /tmp/workflow/ && cd /tmp/workflow && exec python self_repair.py
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: workflow
                  mountPath: /workflow
                  readOnly: true
          volumes:
            - name: workflow
              configMap:
                name: self-repair-workflow
