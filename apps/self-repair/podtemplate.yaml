# Pod spec of every self-repair task; replaces the flyte-task default.
apiVersion: v1
kind: PodTemplate
metadata:
  name: self-repair
template:
  spec:
    nodeSelector:
      cms-af-prod: "true"
    tolerations:
      - key: hub.jupyter.org/dedicated
        operator: Equal
        value: cms-af
        effect: NoSchedule
    # The image's `app` user (docker/self-repair/Dockerfile).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containers:
      - name: default
        image: overridden-by-flyte
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: self-repair-github
                key: token
          - name: GENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: self-repair-genai
                key: api-key
          - name: OPENCODE_API_KEY
            valueFrom:
              secretKeyRef:
                name: self-repair-opencode
                key: api-key
                optional: true
        volumeMounts:
          # Same path as in the purdue-af image.
          - name: platform-context
            mountPath: /opt/purdue-af/agents
            readOnly: true
    volumes:
      - name: platform-context
        configMap:
          name: self-repair-platform-context
