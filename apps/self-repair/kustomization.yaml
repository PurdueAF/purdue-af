apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podtemplate.yaml
  - cronjob.yaml
  # sops-encrypted (age recipient in .sops.yaml); the token value only.
  - secret-github.yaml
  - secret-genai.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # Read by the launcher at every tick, so a merged code change is picked up
  # by the next run with no redeploy.
  - name: self-repair-workflow
    options:
      annotations:
        # python uses ${...}-like strings — keep Flux substitution away
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../workflows/self-repair/self_repair.py
      - ../../workflows/self-repair/triage.py
      - ../../workflows/self-repair/prompts.py
      - ../../workflows/self-repair/genai_proxy.py
      - ../../workflows/self-repair/config.yaml
  # The platform context every agent in an AF session reads, from the one file
  # the purdue-af image bakes in (docker/purdue-af/agents/platform-context.md);
  # mounted at the same path by podtemplate.yaml.
  - name: self-repair-platform-context
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - ../../docker/purdue-af/agents/platform-context.md
