apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-train-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-train-gateway
rules:
  # Users' clusters: created on first use, deleted once idle.
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "create", "delete"]
  # Submitted jobs, a RayJob each: KubeRay creates and removes their clusters.
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # The Jobs that copy a job on NRP's inputs there and its outputs back.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "patch", "delete"]
  # Their token Secrets, never read back: the gateway derives the tokens.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-train-gateway
subjects:
  - kind: ServiceAccount
    name: ray-train-gateway
    namespace: cms
roleRef:
  kind: Role
  name: ray-train-gateway
  apiGroup: rbac.authorization.k8s.io
