# The AF release of KubeRay's ray-cluster chart (apps/ray-train/README.md).

# Names the RayCluster and its head Service, ray-train-head-svc.
fullnameOverride: ray-train

image:
  # CPU flavor on GPU pods too: PyPI torch brings its own CUDA, and the CUDA flavors expose every GPU to the head.
  repository: geddes-registry.rcac.purdue.edu/docker-hub-cache/rayproject/ray
  tag: 2.58.0-py312-cpu
  pullPolicy: IfNotPresent

head:
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    # A warm GPU pod keeps its image and its installed packages for the next job.
    idleTimeoutSeconds: 300
  rayStartParams:
    # Job drivers and the Train controller ask for no CPUs; nothing else lands here.
    num-cpus: "0"
  containerEnv:
    # Train's 60 s default is shorter than a GPU pod's cold start; each expiry logs a timeout error.
    - name: RAY_TRAIN_WORKER_GROUP_START_TIMEOUT_S
      value: "600"
  resources:
    limits:
      cpu: "4"
      memory: 16Gi
    requests:
      cpu: "4"
      memory: 16Gi
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  # The results directory, owned by the image's ray user (1000:100).
  initContainers:
    - name: results-dir
      image: geddes-registry.rcac.purdue.edu/docker-hub-cache/rayproject/ray:2.58.0-py312-cpu
      command:
        - install
        - -d
        - -o
        - "1000"
        - -g
        - "100"
        - -m
        - "0755"
        - /work/projects/ray-train
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: work
          mountPath: /work
  # Session paths read-only; the results directory, Train's storage_path, is the one writable mount.
  volumes:
    - name: log-volume
      emptyDir: {}
    - name: work
      persistentVolumeClaim:
        claimName: af-shared-storage
    - name: depot
      nfs:
        server: datadepot.rcac.purdue.edu
        path: /depot/cms
    - name: eos
      hostPath:
        path: /eos
    - name: cvmfs
      persistentVolumeClaim:
        claimName: cvmfs
  volumeMounts:
    - name: log-volume
      mountPath: /tmp/ray
    - name: work
      mountPath: /work
      readOnly: true
      mountPropagation: HostToContainer
    - name: work
      mountPath: /work/projects/ray-train
      subPath: projects/ray-train
    - name: depot
      mountPath: /depot/cms
      readOnly: true
      mountPropagation: HostToContainer
    - name: eos
      mountPath: /eos
      readOnly: true
      mountPropagation: HostToContainer
    - name: cvmfs
      mountPath: /cvmfs
      readOnly: true
      mountPropagation: HostToContainer

worker:
  groupName: gpu
  replicas: 0
  minReplicas: 0
  maxReplicas: 4
  resources:
    limits:
      cpu: "8"
      memory: 32Gi
      # The T4s; the A100s are split into MIG devices with their own resource names.
      nvidia.com/gpu: 1
    requests:
      cpu: "8"
      memory: 32Gi
      nvidia.com/gpu: 1
  nodeSelector:
    cms-af-prod: "true"
  tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: cms-af
      effect: NoSchedule
  volumes:
    - name: log-volume
      emptyDir: {}
    - name: work
      persistentVolumeClaim:
        claimName: af-shared-storage
    - name: depot
      nfs:
        server: datadepot.rcac.purdue.edu
        path: /depot/cms
    - name: eos
      hostPath:
        path: /eos
    - name: cvmfs
      persistentVolumeClaim:
        claimName: cvmfs
  volumeMounts:
    - name: log-volume
      mountPath: /tmp/ray
    - name: work
      mountPath: /work
      readOnly: true
      mountPropagation: HostToContainer
    - name: work
      mountPath: /work/projects/ray-train
      subPath: projects/ray-train
    - name: depot
      mountPath: /depot/cms
      readOnly: true
      mountPropagation: HostToContainer
    - name: eos
      mountPath: /eos
      readOnly: true
      mountPropagation: HostToContainer
    - name: cvmfs
      mountPath: /cvmfs
      readOnly: true
      mountPropagation: HostToContainer

# Never exposed outside the cluster; networkpolicy.yaml admits only AF sessions to the Jobs API.
service:
  type: ClusterIP
