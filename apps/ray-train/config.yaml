# The settings of gateway.py, which restarts when they change.

# How long a cluster stays after its last task, job or call.
idleTimeoutSeconds: 900
# How long a call waits for a head to start, or for an old cluster to go.
startTimeoutSeconds: 600
startPollSeconds: 5
# How long a cluster may wait for the last of its workers before it is removed.
provisionTimeoutSeconds: 600
reapEverySeconds: 60
codePollSeconds: 10
userCacheSeconds: 300
# How long the clients of a removed cluster hear so, instead of starting another: longer than Ray Client retries (RAY_CLIENT_RECONNECT_GRACE_PERIOD in the Hub's ray-train.py).
goneSeconds: 300

# The GPUs a worker may hold, of one kind each, those a cluster takes first at the top: the resource, its memory,
# the most of them all clusters hold together while Prometheus does not say how many are free, and the most one
# worker may hold: a process uses one MIG slice only, and no node has more than two T4s.
# A call may ask for as many workers as the budgets of the GPUs with the memory it asks for hold.
gpus:
  - resource: nvidia.com/mig-1g.5gb
    memoryGb: 5
    budget: 14
    maxPerWorker: 1
  - resource: nvidia.com/gpu
    memoryGb: 16
    budget: 8
    maxPerWorker: 2
# The most CPU cores, and the least and the most memory, a call may ask for each worker; raycluster.yaml holds what
# a worker has unless a call asks.
workerCpusMax: 16
workerMemoryGbMin: 4
workerMemoryGbMax: 64
# The PriorityClass of a cluster's workers past its first.
preemptiblePriorityClass: low-priority-preemptible
# How long an admitted cluster's GPUs count as taken, for Prometheus to see its pods.
grantSeconds: 120
prometheusUrl: http://prometheus-server:9090

# The environment pixi-global-sync keeps (apps/af-utils/pixi-global-sync).
defaultEnv: /work/pixi/global/.pixi/envs/default

ldapHost: geddes-auth.rcac.purdue.edu
ldapBase: ou=AllPeople,dc=geddes,dc=rcac,dc=purdue,dc=edu
