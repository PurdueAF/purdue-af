# The settings of gateway.py, which restarts when they change.

# How long a cluster stays after its last task, job or call.
idleTimeoutSeconds: 900
# How long a call waits for a head to start, or for an old cluster to go.
startTimeoutSeconds: 600
startPollSeconds: 5
# How long a cluster may wait for the last of its workers before it is removed.
provisionTimeoutSeconds: 600
reapEverySeconds: 60
codePollSeconds: 10
userCacheSeconds: 300
# How long the clients of a removed cluster hear so, instead of starting another: Ray Client retries for 30 s.
goneSeconds: 300

# The GPUs a worker may hold, one each, those a cluster takes first at the top: the resource, its memory,
# and the most of them all clusters hold together while Prometheus does not say how many are free.
# A call may ask for as many workers as the budgets of the GPUs with the memory it asks for.
gpus:
  - resource: nvidia.com/mig-1g.5gb
    memoryGb: 5
    budget: 14
  - resource: nvidia.com/gpu
    memoryGb: 16
    budget: 8
# The PriorityClass of a cluster's workers past its first.
preemptiblePriorityClass: low-priority-preemptible
# How long an admitted cluster's GPUs count as taken, for Prometheus to see its pods.
grantSeconds: 120
prometheusUrl: http://prometheus-server:9090

# The environment pixi-global-sync keeps (apps/af-utils/pixi-global-sync).
defaultEnv: /work/pixi/global/.pixi/envs/default

ldapHost: geddes-auth.rcac.purdue.edu
ldapBase: ou=AllPeople,dc=geddes,dc=rcac,dc=purdue,dc=edu
