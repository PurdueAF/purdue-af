apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ray-train
spec:
  suspend: false
  interval: 1m
  # The ray.io CRDs must exist before the chart's RayCluster applies.
  dependsOn:
    - name: kuberay-operator
  chart:
    spec:
      chart: ray-cluster
      version: "1.7.1"
      sourceRef:
        kind: HelmRepository
        name: kuberay
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: ray-train-config
      valuesKey: values.yaml
  # The chart has no value for it. Without Recreate a spec change reaches only
  # pods created afterwards, so new workers would join a head on the old spec.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: RayCluster
              name: ray-train
            patch: |
              - op: add
                path: /spec/upgradeStrategy
                value:
                  type: Recreate
