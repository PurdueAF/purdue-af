# One AF user's Ray cluster: a head with one T4 and up to three workers with
# one each, all running as that user. The gateway fills in the name, the
# user's identity, the token Secret and the workers.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-train-template
spec:
  # The oldest Ray an environment may have: token authentication needs 2.52, and a 2.53+ here makes KubeRay probe /api/healthz, which 2.52 lacks.
  rayVersion: "2.52.0"
  authOptions:
    mode: token
    secretName: ray-train-template
  # Pods of one cluster reach each other; networkpolicy.yaml adds the gateway.
  networkPolicy:
    mode: DenyAllIngress
  # On for af-ray-gpus: auto.
  enableInTreeAutoscaling: false
  autoscalerOptions:
    idleTimeoutSeconds: 60
    # The image's user, not the cluster's: the token is the autoscaler's alone.
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    volumeMounts:
      - name: autoscaler-token
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
  headGroupSpec:
    rayStartParams: {}
    template:
      metadata:
        labels:
          app: ray-train-cluster
      spec:
        # User code runs in this pod: only the autoscaler mounts a token.
        automountServiceAccountToken: false
        # The image's Python is under /home/ray, which only group 100 may enter; the gateway adds the user's UID/GID.
        securityContext:
          supplementalGroups: [100]
        nodeSelector:
          cms-af-prod: "true"
        tolerations:
          - key: hub.jupyter.org/dedicated
            operator: Equal
            value: cms-af
            effect: NoSchedule
        containers:
          - name: ray-head
            # CPU flavor: the environments bring their own CUDA, and the CUDA flavors cost a 6.3 GB pull.
            image: geddes-registry.rcac.purdue.edu/docker-hub-cache/rayproject/ray:2.58.0-py312-cpu
            env:
              # The user has no home directory in the image.
              - name: HOME
                value: /tmp
              # The image's own PATH; the gateway puts the cluster's environment in front of it.
              - name: PATH
                value: /home/ray/anaconda3/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/nvidia/bin
            resources:
              limits:
                cpu: "8"
                memory: 32Gi
                # The T4s; the A100s are split into MIG devices with their own resource names.
                nvidia.com/gpu: 1
              requests:
                cpu: "8"
                memory: 32Gi
                nvidia.com/gpu: 1
            volumeMounts:
              - name: log-volume
                mountPath: /tmp/ray
              - name: work
                mountPath: /work
                mountPropagation: HostToContainer
              - name: depot
                mountPath: /depot/cms
                mountPropagation: HostToContainer
              - name: eos
                mountPath: /eos
                readOnly: true
                mountPropagation: HostToContainer
              - name: cvmfs
                mountPath: /cvmfs
                readOnly: true
                mountPropagation: HostToContainer
        volumes:
          - name: log-volume
            emptyDir: {}
          - name: work
            persistentVolumeClaim:
              claimName: af-shared-storage
          - name: depot
            nfs:
              server: datadepot.rcac.purdue.edu
              path: /depot/cms
          - name: eos
            hostPath:
              path: /eos
          - name: cvmfs
            persistentVolumeClaim:
              claimName: cvmfs
          # The autoscaler's ServiceAccount token; the gateway drops it unless autoscaling.
          - name: autoscaler-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
  # The workers: copies of the head's pod, which the gateway counts.
  workerGroupSpecs:
    - groupName: gpu
      rayStartParams: {}
