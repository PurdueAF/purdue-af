; mypy configuration — static type checking for first-party Python.
; Runs via pre-commit (so `pre-commit run --all-files` and CI agree) or
; locally with: uv run --project tests mypy
;
; Scope: everything first-party. NOT the vendored dask-gateway fork, which
; is excluded from every lint here — upstream owns its style.
;
; Third-party SDKs used here (kubernetes, mcp, jupyterhub, traitlets,
; oauthenticator) ship no type information, so imports are untyped by
; necessity; `ignore_missing_imports` keeps that from drowning real
; findings. Everything WE write is checked strictly.

[mypy]
python_version = 3.12
ignore_missing_imports = True
; Checked scope — the pre-commit hook passes no filenames, so this list IS
; the scope (types cross files; checking only what changed would miss
; breakage in callers).
files =
    .github/workflows/bump-af-version.py,
    .github/workflows/component-status.py,
    .github/workflows/fix-coverage-paths.py,
    apps/af-utils,
    apps/jupyterhub/jupyterhub/extraFiles,
    docker/af-node-monitor,
    docker/af-pod-monitor,
    docker/agentic-interface,
    docker/purdue-af/jupyter,
    docker/sonic-ray,
    pixi/check-env.py,
    pixi/global/check-gpu.py
; our own flat-import packages (agentic-interface uses `from context import ...`;
; gpu_queries is shared with the hub snippets and copied into the image)
mypy_path = docker/agentic-interface:apps/jupyterhub/jupyterhub/extraFiles:docker/sonic-ray
explicit_package_bases = True
namespace_packages = True

; Strict-equivalent for first-party code, spelled out so each flag is a
; deliberate choice rather than a moving upstream default.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
strict_equality = True
extra_checks = True

; The MCP SDK ships no type information, so its @mcp.tool() / @mcp.prompt()
; decorators are untyped and would mark every tool they wrap as untyped.
; The tool bodies themselves are still fully checked.
[mypy-tools.*]
disallow_untyped_decorators = False

; Ray Serve's @serve.deployment / @serve.ingress ship no type information
; (ray is not installed in the hook environment), so the deployment class they
; wrap would count as untyped. The route bodies are still fully checked.
[mypy-sonic_ray.serve_app]
disallow_untyped_decorators = False

; node_healthcheck imports kubernetes optionally (try/except ImportError with
; None fallbacks) and carries `type: ignore`s for the typed-kubernetes case.
; Under `ignore_missing_imports` those read as unused — they are not stale,
; they cover the other mode, so keep them without the warning.
[mypy-node_healthcheck]
warn_unused_ignores = False
