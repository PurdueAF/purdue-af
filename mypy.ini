[mypy]
python_version = 3.12
ignore_missing_imports = True
; The whole checked scope: the pre-commit hook passes no filenames.
files = .github/workflows, apps, docker, pixi, workflows
; flat-import first-party modules
mypy_path = docker/agentic-interface:apps/jupyterhub/jupyterhub/extraFiles:workflows/agentic-analysis
explicit_package_bases = True
namespace_packages = True

; Strict, spelled out rather than tracking upstream's `strict` set.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
strict_equality = True
extra_checks = True

; flyte is not in the hook's dependencies, so @env.task resolves to Any.
[mypy-agentic_analysis]
disallow_untyped_decorators = False
