[mypy]
python_version = 3.12
ignore_missing_imports = True
; The whole checked scope: the pre-commit hook passes no filenames.
files =
    .github/workflows/bump-af-version.py,
    .github/workflows/check-markdown-links.py,
    .github/workflows/component-status.py,
    apps/af-utils,
    apps/jupyterhub/jupyterhub/extraFiles,
    docker/af-node-monitor,
    docker/af-pod-monitor,
    docker/agentic-interface,
    docker/purdue-af/jupyter,
    helm/sonic-ray/files,
    pixi/check-env.py,
    pixi/global/check-gpu.py,
    workflows/integration-challenge,
    workflows/self-repair
; flat-import first-party modules
mypy_path = docker/agentic-interface:apps/jupyterhub/jupyterhub/extraFiles:helm/sonic-ray/files:workflows/integration-challenge:workflows/self-repair
explicit_package_bases = True
namespace_packages = True

; Strict, spelled out rather than tracking upstream's `strict` set.
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unused_configs = True
strict_equality = True
extra_checks = True

; The MCP SDK's decorators are untyped.
[mypy-tools.*]
disallow_untyped_decorators = False

; flyte is not in the hook's dependencies, so @env.task resolves to Any.
[mypy-workflow,self_repair]
disallow_untyped_decorators = False

; Its `type: ignore`s cover the optional-kubernetes import; they only look unused here.
[mypy-node_healthcheck]
warn_unused_ignores = False
