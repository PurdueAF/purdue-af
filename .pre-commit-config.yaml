repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: \.rpm$ # site Slurm clients + OSG certs, vendored on purpose

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check # lint (+ import sorting), config in ruff.toml
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (JSON/YAML)
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        entry: prettier --write
        types_or: [json, yaml]
        # Helm templates are Go templates, not YAML.
        exclude: ^(apps/.*/chart|helm/[^/]+)/templates/

      - id: markdown-links
        name: markdown links resolve
        language: python
        entry: python .github/workflows/check-markdown-links.py
        types: [markdown]

      - id: shfmt
        name: shfmt
        language: golang
        additional_dependencies: ["mvdan.cc/sh/v3/cmd/shfmt@v3.14.1"]
        entry: shfmt -w
        types: [shell]
        # Leaves slurm/'s extensionless site scripts (slist) verbatim.
        files: \.sh$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (first-party python)
        # Types cross files: check mypy.ini's whole scope every run.
        pass_filenames: false
        args: ["--config-file", "mypy.ini"]
        # Typed third-party packages our calls are checked against.
        additional_dependencies:
          - httpx>=0.27
          - starlette>=0.40
          - pydantic>=2.9
          - prometheus_client>=0.22
          - types-PyYAML
          - types-cachetools

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        # slurm/ scripts are site-provided and deployed verbatim.
        exclude: ^slurm/

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        # Pin the image (the upstream hook defaults to :latest).
        entry: ghcr.io/hadolint/hadolint:v2.14.0 hadolint
        # DL3041/DL3033/DL3008: unpinned dnf/yum/apt package versions —
        # distro archives drop old versions, so pinning breaks rebuilds.
        args:
          [
            "--ignore",
            "DL3041",
            "--ignore",
            "DL3033",
            "--ignore",
            "DL3008",
            "--failure-threshold",
            "warning",
          ]
